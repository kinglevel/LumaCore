# LumaCore: lets the station's render and send threads use real-time scheduling
# (SCHED_FIFO 70 and 65; decisions §24, §31 "Thread priority"). JACK / PipeWire do the same
# for the `audio` group.
#
# Install (or run ./scripts/unix/dev_setup.sh --realtime):
#   sudo cp scripts/unix/realtime.conf /etc/security/limits.d/90-lumacore.conf
#   sudo groupadd -f lumacore && sudo usermod -aG lumacore "$USER"
# then log out and in again (limits are read at login; a tmux started earlier keeps the old ones).
# A systemd service ignores this file: give it LimitRTPRIO=70 instead.
# `Info Health Threads` shows what each thread got.
@lumacore   -   rtprio   70
