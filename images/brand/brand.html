<!doctype html>
<!-- The source of the README hero and the logo lockups. render.mjs opens it as
     brand.html?mark=prompt|moon&kind=hero|lockup and screenshots #art at 2×. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap">
<style>
  html, body { margin: 0; background: transparent; }
  #art { display: inline-block; }
  svg { display: block; }
</style>
<div id="art"></div>
<script>
const q = new URLSearchParams(location.search);
const mark = q.get('mark') || 'prompt', kind = q.get('kind') || 'hero';
const SANS = "'Source Sans 3', 'Segoe UI', sans-serif", MONO = "JetBrains Mono, Menlo, monospace";
const HEAD = 'M24 46 L22 14 L46 32 Q70 26 94 32 L118 14 L116 46 Q122 60 120 82 Q116 124 70 124 Q24 124 20 82 Q18 60 24 46 Z';
const CAT = `<path fill="#121212" d="M36.5 30 L35 10 L47 21.5 Q50 21 53 21.5 L65 10 L63.5 30 Q65 36 62 41 Q66 50 68.5 62 Q71 76 69 84 Q67 94 50 94 Q33 94 31 84 Q29 76 31.5 62 Q34 50 38 41 Q35 36 36.5 30 Z"/><path fill="none" stroke="#121212" stroke-width="5.5" stroke-linecap="round" d="M66 89 C83 92 90 80 85 68 C83 63 79 62 77 64"/><ellipse cx="44" cy="31" rx="2.3" ry="3.2" fill="#3fc8d8"/><ellipse cx="56" cy="31" rx="2.3" ry="3.2" fill="#3fc8d8"/>`;
const DEFS = `<defs>
  <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0cf6a"/><stop offset=".55" stop-color="#d4a634"/><stop offset="1" stop-color="#9a7a08"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d4a634" stop-opacity=".32"/><stop offset="1" stop-color="#d4a634" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b341" stop-opacity=".22"/><stop offset="1" stop-color="#e0b341" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".05"/></pattern>
</defs>`;

// One mark in a 140 × 140 box.
function markSvg(m) {
  if (m === 'moon') return `<circle cx="70" cy="66" r="62" fill="url(#glow)"/><circle cx="70" cy="62" r="44" fill="url(#moon)"/>
    <path d="M18 112 Q70 96 122 112" stroke="#9a7a08" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g transform="translate(38 44) scale(.64)">${CAT}</g>`;
  return `<circle cx="70" cy="74" r="64" fill="url(#glow)"/>
    <path d="${HEAD}" fill="#1c1c1c" stroke="#d4a634" stroke-width="4" stroke-linejoin="round"/>
    <path d="M44 62 L62 76 L44 90" fill="none" stroke="#e0b341" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="84" width="26" height="7" rx="2" fill="#3fc8d8"/>`;
}

// A few quiet stars, placed by hand so every render is the same.
const STARS = [[470, 52, 1.6], [560, 120, 1], [690, 40, 1.3], [820, 92, 1], [930, 34, 1.8], [1040, 76, 1.1], [1150, 46, 1.4],
  [1210, 150, 1], [1100, 190, 1.2], [610, 380, 1], [1180, 360, 1.3], [980, 392, 1], [60, 360, 1.1], [30, 70, 1.4], [330, 30, 1]];
// The moon behind the mark: the moon mark's disc and branch; with the prompt mark Luma's head sits in front of it.
const moonBehind = mark === 'prompt'
  ? `<circle cx="201" cy="186" r="186" fill="url(#glow)"/><circle cx="201" cy="180" r="128" fill="url(#moon)"/>
     <path d="M70 318 Q201 284 332 318" stroke="#9a7a08" stroke-width="7" fill="none" stroke-linecap="round"/>`
  : '';
const hero = `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">${DEFS}
  <rect width="1280" height="420" rx="18" fill="#121212"/><rect width="1280" height="420" rx="18" fill="url(#dots)"/>
  ${STARS.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#ececec" fill-opacity=".55"/>`).join('')}
  ${moonBehind}
  <g transform="${mark === 'prompt' ? 'translate(88 82) scale(1.62)' : 'translate(60 50) scale(2.2)'}">${mark === 'prompt' ? markSvg(mark).replace(/<circle[^>]*url\(#glow\)[^>]*\/>/, '') : markSvg(mark)}</g>
  <text x="400" y="196" font-family="${SANS}" font-weight="800" font-size="104" fill="#ececec" letter-spacing="-2">Luma<tspan fill="#e0b341">Core</tspan></text>
  <text x="404" y="246" font-family="${SANS}" font-size="30" fill="#d1d1d1">An open-source lighting console, written in Rust.</text>
  <text x="406" y="296" font-family="${MONO}" font-size="18" fill="#8a8a8a">Luma is the cat · Lum is the language · TreeShell is the tree</text>
  <rect x="404" y="326" width="372" height="40" rx="6" fill="#1c1c1c" stroke="#424242"/>
  <text x="420" y="352" font-family="${MONO}" font-size="17" fill="#8a8a8a">[Admin]&gt; <tspan fill="#ececec">Fixture 1 Thru 8 At Full</tspan></text>
</svg>`;

const lockup = `<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150">${DEFS}
  <rect width="560" height="150" rx="14" fill="#121212"/>
  <g transform="translate(6 4)">${markSvg(mark)}</g>
  <text x="160" y="90" font-family="${SANS}" font-weight="700" font-size="60" fill="#ececec" letter-spacing="-1">Luma<tspan fill="#e0b341">Core</tspan></text>
  <text x="163" y="120" font-family="${MONO}" font-size="15" fill="#8a8a8a" letter-spacing="3">TREESHELL · LUM</text>
</svg>`;

document.getElementById('art').innerHTML = kind === 'lockup' ? lockup : hero;
</script>
