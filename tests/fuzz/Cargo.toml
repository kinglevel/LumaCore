# cargo-fuzz targets (decisions §25 "Step 10 hardening"). Outside the
# workspace, nightly only: `cargo +nightly fuzz run <target> --fuzz-dir fuzz`,
# or every target overnight with `scripts/unix/fuzz_long`.
[package]
name = "lumacore-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
lumacore-sweep = { path = "../../crates/dev/lumacore-sweep" }
lumacore-artnet = { path = "../../crates/network/protocols/dmx/lumacore-artnet" }
lumacore-sacn = { path = "../../crates/network/protocols/dmx/lumacore-sacn" }
lumacore-wire = { path = "../../crates/foundation/lumacore-wire" }
lumacore-syntax = { path = "../../crates/foundation/lumacore-syntax" }

# Not part of the LumaCore workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "osc"
path = "fuzz_targets/osc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sacn"
path = "fuzz_targets/sacn.rs"
test = false
doc = false
bench = false

