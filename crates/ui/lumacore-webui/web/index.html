function leaves(node = layout.root, out = []) {
  node.type === 'split' ? node.children.forEach(c => leaves(c, out)) : out.push(node);
  return out;
}
function leafWith(no) { return leaves().find(l => l.wins.includes(no)) || null; }
function winLabel(no) {
  const w = layout.windows[no];
  return w?.label || TAB_KINDS[w?.kind]?.label || w?.kind || '';
}
/** `1.4`: the window as the station names it (`Window <screen>.<n>`). */
function winName(no) { return liveScreen ? `${liveScreen}.${no}` : String(no); }

// ── Focus ──────────────────────────────────────────────────────────────────
// Client-local (not part of the shared layout). Stored as a child-index path so
// it survives re-renders and layouts replaced from the server; an invalid path
// falls back to the nearest leaf.
let focusPath = [];
let pendingFocus = null; // window to focus once the server's layout has it
let barFocus = false;    // the command line bar has focus (no panel does)

function pathOf(target, node = layout.root, path = []) {
  if (node === target) return path;
  if (node.type !== 'split') return null;
  for (let i = 0; i < 2; i++) {
    const p = pathOf(target, node.children[i], [...path, i]);
    if (p) return p;
  }
  return null;
}

function focusedLeaf() {
  let n = layout.root;
  for (const i of focusPath) { if (n.type !== 'split') break; n = n.children[i]; }
  while (n.type === 'split') n = n.children[0];
  return n;
}
function focusedWin() { const l = focusedLeaf(); return l.wins[l.active]; }

function focusNode(node) { focusPath = pathOf(node) || []; }

// Tell the server where navigation keys go, and which window window commands
// act beside (deduplicated; reset on reconnect).
let lastFocusMsg = '';
function sendFocus() {
  const no = focusedWin();
  const kind = layout.windows[no]?.kind;
  // On the command line bar the last focused window stays `Self` (decisions §30 "12c").
  const msg = barFocus ? (no != null ? { type: 'focus', target: 'terminal', window: no } : { type: 'focus', target: 'terminal' })
    : kind === 'terminal'
    ? { type: 'focus', target: 'terminal', window: no }
    : { type: 'focus', target: 'panel', kind, window: no };
  const json = JSON.stringify(msg);
  if (json === lastFocusMsg || ws?.readyState !== WebSocket.OPEN) return;
  lastFocusMsg = json;
  ws.send(json);
}

function syncKeyboardFocus() {
  sendFocus();
  document.getElementById('cmdbar').classList.toggle('focused', barFocus);
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('focused', !barFocus && p.dataset.focus === '1'));
  const no = focusedWin();
  if (barFocus) {
    for (const t of terms.values()) if (t.opened) t.term.blur();
    const bar = terms.get(BAR_VIEW);
    if (bar?.opened) bar.term.focus();
  } else if (layout.windows[no]?.kind === 'terminal') {
    if (primaryTerm !== no) { primaryTerm = no; syncTermSizes(); }
    const t = terms.get(no);
    if (t?.opened) t.term.focus();
  } else {
    for (const t of terms.values()) if (t.opened) t.term.blur();
  }
}

// Focus window `no`, activating its tab (Window <n>, Esc → terminal).
function focusWindow(no) {
  const leaf = leafWith(no);
  if (!leaf) { pendingFocus = no; return; }
  pendingFocus = null;
  barFocus = false;
  const i = leaf.wins.indexOf(no);
  focusNode(leaf);
  if (leaf.active !== i) { leaf.active = i; commit(); } else renderLayout();
}

// Navigation events from the server for the focused panel.
function handleUiEvent(ev) {
  if (!ev) return;
  // Nothing opens over the lock: asks wait (their timeouts run) and show after unlocking.
  if (deviceStatus.locked && QUEUED_WHILE_LOCKED.has(ev.action)) {
    lockQueue.push(ev);
    surface?.update({ waiting: lockQueue.length + (barStatus?.dialogs?.length || 0) });
    return;
  }
  if (ev.action === 'page') return pageAction(ev.what, ev.on);
  if (ev.action === 'focus_window') return focusWindow(ev.no);
  if (ev.action === 'edit_settings') return openObjectSettings(ev);
  if (ev.action === 'user_changed') {
    if (ev.token) setToken(ev.token);
    // The new login is finished once the Meow License is accepted (decisions 0290); then the
    // app reopens this session's screens for the new user.
    return awaitConsent(ev.user, user => {
      if (APP) return toApp({ type: 'user_changed', user, token: ev.token });
      switchUser(user);
    });
  }
  if (ev.action === 'logged_out') {
    if (APP) { loggedIn = false; return toApp({ type: 'logged_out', disconnect: !!ev.disconnect }); }
    return logout();
  }
  if (ev.action === 'open_menu') return openMenuEvent(ev);
  if (ev.action === 'attribute_board') return openAttributeBoard(ev);
  if (ev.action === 'sequence_sheet') return openSequenceSheet(ev.sequence);
  if (ev.action === 'close_menu') {
    menuEpoch++;
    document.querySelectorAll('.mo-overlay.open').forEach(o => closeMenuOverlay(o.id));
    closeSetupMenu();
    return;
  }
  if (ev.action === 'notice') return notice(ev.text, 5000, ev.level);
  // The user's clipboard (the NAV inspector's copy keys; never the station's object clipboard).
  if (ev.action === 'copy_text') return LumaKit.clipboard.copyText(ev.label, ev.text, { host: HOST });
  if (ev.action === 'feedback_settings') return loadFeedbackSettings();
  if (ev.action === 'connect') {
    if (APP) { loggedIn = false; return toApp({ type: 'connect', target: ev.target, user: ev.user, password: ev.password }); }
    return notice('Connect switches servers in the LumaCore app. In a browser, open the other server\'s address.');
  }
  if (ev.action === 'screen_config') {
    if (APP) return toApp({ type: 'screen_config', no: ev.no });
    return switchScreenConfig(ev.no);
  }
  if (ev.action === 'focus_terminal') {
    const term = primaryTerm != null && leafWith(primaryTerm) ? primaryTerm
      : Object.values(layout.windows).find(w => w.kind === 'terminal' && leafWith(w.no))?.no;
    if (term != null) focusWindow(term);
    else focusBar(); // no terminal window open — the bar is the command line
    return;
  }
  const kind = TAB_KINDS[layout.windows[focusedWin()]?.kind];
  const panel = document.querySelector('.panel.focused .panel-body');
  if (kind?.onUi && panel) kind.onUi(ev, panel);
}

function setFocus(leaf, panel) {
  if (focusedLeaf() !== leaf) {
    focusNode(leaf);
    document.querySelectorAll('.panel').forEach(p => { p.dataset.focus = ''; });
    panel.dataset.focus = '1';
  }
  barFocus = false;
  syncKeyboardFocus();
}

function focusBar() {
  barFocus = true;
  syncKeyboardFocus();
}

// ── Held full screen / maximised (decisions §30 "12c2", HoldFullscreen) ──
// A window can fill the screen area with ‹ › × above it (kit luma-maxbar):
// held on a phone or tablet (hold a miniature pane), or the window menu's
// Maximize. With the profile's HoldFollows on, it is the live screen's
// `maximized` window (`Set Self "Maximized" On|Off`): every client of the
// screen — the desk too — shows it. Off: only this device (nothing is sent).
let layoutMax = null;     // the live screen's maximised window (station)
let heldLocal = null;     // HoldFollows Off: held on this device only
let pendingMax = null;    // { value, until }: our own line on its way
const MINI_NATURAL = 1;   // a pane's natural size: its type's bar_min × this (+ its bars)
function holdFollows() { return barStatus?.hold_follows ?? uiKeys.holdFollows ?? true; }
function maximizedWin() {
  const m = heldLocal ?? layoutMax;
  return m != null && layout.windows[m] && leafWith(m) ? m : null;
}
/** The station's word on the maximised window (screen JSON / windows feed). */
function stationMax(value) {
  value = value ?? null;
  if (pendingMax && performance.now() < pendingMax.until && value !== pendingMax.value) return false;
  pendingMax = null;
  if (value === layoutMax) return false;
  layoutMax = value;
  return true;
}
/** Hold window `no` full screen (null: back to the whole screen). */
function setHeld(no) {
  const leaf = no != null ? leafWith(no) : null;
  if (leaf && leaf.wins[leaf.active] !== no) { leaf.active = leaf.wins.indexOf(no); saveLayout(); }
  if (holdFollows()) {
    const cur = maximizedWin();
    if (no == null) { if (cur != null) wsCommand('Set Self "Maximized" Off', cur); }
    else wsCommand('Set Self "Maximized" On', no);
    heldLocal = null;
    layoutMax = no;
    pendingMax = { value: no, until: performance.now() + 1500 };
  } else {
    heldLocal = no;
  }
  if (leaf) focusNode(leaf);
  renderLayout();
}
/** The panes in tree order (each pane's active window): ‹ › walk these. */
function paneOrder() { return leaves().map(l => l.wins[l.active]); }

function buildMaximized(no) {
  const leaf = leafWith(no);
  const panel = document.createElement('div');
  panel.className = 'panel max-win' + (!barFocus ? ' focused' : '');
  panel.dataset.focus = '1';
  panel.dataset.max = no;
  focusNode(leaf);
  panel.addEventListener('pointerdown', () => setFocus(leaf, panel), true);
  const bar = document.createElement('luma-maxbar');
  const order = paneOrder();
  const at = Math.max(0, leaves().indexOf(leaf));
  // ‹ › and a swipe step through the panes in tree order and stop at the
  // ends (decisions §30 "12e"): past the first or the last it springs back.
  const step = go => {
    const to = at + (go === 'next' ? 1 : -1);
    if (to < 0 || to >= order.length) { LumaKit.toast(go === 'next' ? 'Last pane' : 'First pane'); return false; }
    setHeld(order[to]);
    return true;
  };
  bar.addEventListener('maxbar', e => (e.detail.go === 'close' ? setHeld(null) : step(e.detail.go)));
  const body = document.createElement('div');
  body.className = 'panel-body';
  body.appendChild(buildWindow(layout.windows[no]));
  const atEnd = dx => (dx > 0 && at === 0) || (dx < 0 && at === order.length - 1);
  LumaKit.pointer.swipe(body, {
    onMove: dx => { body.style.transform = `translateX(${atEnd(dx) ? dx / 3 : dx}px)`; },
    onSwipe: go => { body.style.transform = ''; step(go); },
    onCancel: () => { body.style.transform = ''; },
  });
  panel.append(bar, body);
  bar.update({ title: winLabel(no), sub: winFeed.views[no]?.title || '', count: order.length, index: at });
  return panel;
}

// ── Render ─────────────────────────────────────────────────────────────────
let miniatures = [];
function renderLayout() {
  pruneTerms();
  for (const no of winBars.keys()) if (!layout.windows[no]) winBars.delete(no);
  for (const m of miniatures) m.destroy();
  miniatures = [];
  const area = document.getElementById('panel-area');
  area.innerHTML = '';
  const max = maximizedWin();
  area.appendChild(max != null ? buildMaximized(max) : buildNode(layout.root));
  requestAnimationFrame(() => { syncTermSizes(); syncKeyboardFocus(); });
}

function buildNode(n) {
  if (n.type === 'leaf') return buildLeaf(n);
  const wrap = document.createElement('div');
  wrap.className = `snode snode-${n.dir}`;
  const c1 = document.createElement('div');
  c1.className = 'schild';
  c1.style.flex = `${n.ratio} 1 0%`;
  c1.appendChild(buildNode(n.children[0]));
  const c2 = document.createElement('div');
  c2.className = 'schild';
  c2.style.flex = `${1 - n.ratio} 1 0%`;
  c2.appendChild(buildNode(n.children[1]));
  // A drag, a double-tap reset or a key is one layout step.
  const hdl = LumaKit.split.handle(n.dir, {
    size: () => (n.dir === 'h' ? wrap.offsetWidth : wrap.offsetHeight) - 4,
    ratio: () => n.ratio,
    set: r => { n.ratio = r; c1.style.flex = `${r} 1 0%`; c2.style.flex = `${1 - r} 1 0%`; },
    commit: () => saveLayout(),
  });
  wrap.append(c1, hdl, c2);
  return wrap;
}

function buildLeaf(n) {
  const panel = document.createElement('div');
  const isFocused = n === focusedLeaf();
  panel.className = 'panel' + (isFocused && !barFocus ? ' focused' : '');
  panel.dataset.focus = isFocused ? '1' : '';
  panel.addEventListener('pointerdown', () => setFocus(n, panel), true);

  const hdr = document.createElement('div');
  hdr.className = 'panel-hdr';
  // Hold (or right-click) on the empty header: the active window's menu.
  LumaKit.pointer.hold(hdr, {
    filter: e => !e.target.closest('.ptab, .panel-close'),
    onHold: at => showCtx(at, n, n.wins[n.active]),
  });

  const bar = document.createElement('div');
  bar.className = 'panel-tabs';
  n.wins.forEach((no, i) => {
    const on = i === n.active;
    const btn = document.createElement('button');
    btn.className = 'ptab' + (on ? ' on' : '');
    btn.title = `Window ${no}`;
    btn.dataset.win = no;
    // The gold dot is the window's header button (decisions §30): a tap opens
    // the window menu; the rest of the tab switches to it; a hold on the tab
    // opens the menu too.
    const dot = document.createElement('span');
    dot.className = 'tab-dot';
    dot.dataset.kit = 'tab-dot';
    dot.title = 'Window menu';
    dot.addEventListener('click', e => {
      e.stopPropagation();
      // Tap the dot again: the press already closed its menu — leave it closed.
      if (ctxClosedAt.dot === dot && performance.now() - ctxClosedAt.t < 400) return;
      const r = dot.getBoundingClientRect();
      showCtx({ x: r.left, y: r.bottom + 2 }, n, no, dot);
    });
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(winLabel(no)));
    // The live title (decisions §30 "12c"): rendered by the station on the `windows` feed.
    const live = document.createElement('span');
    live.className = 'tab-title';
    btn.appendChild(live);
    paintTitle(no, live);
    btn.onclick = () => activateTab(n, i);
    LumaKit.pointer.hold(btn, { filter: e => !e.target.closest('.tab-dot'), onHold: at => showCtx(at, n, no) });
    bar.appendChild(btn);
  });

  hdr.appendChild(bar);
  if (layout.root !== n) {
    const cls = document.createElement('button');
    cls.className = 'panel-close';
    cls.innerHTML = '<luma-icon name="x"></luma-icon>';
    cls.title = 'Close panel';
    cls.onclick = () => closePanel(n);
    hdr.appendChild(cls);
  }

  const body = document.createElement('div');
  body.className = 'panel-body';
  const win = layout.windows[n.wins[n.active]];
  body.appendChild(buildWindow(win));

  // The pane's content in one wrapper: on a touch screen a pane smaller than
  // its window's natural size draws it in miniature (kit minipane.js); hold
  // it to open the window full screen (decisions §30 "12c2").
  const inner = document.createElement('div');
  inner.className = 'lc-mini-inner';
  inner.append(hdr, body);
  panel.append(inner);
  if (!document.body.classList.contains('mirror')) {
    miniatures.push(LumaKit.mini.miniature(panel, inner, {
      enabled: () => matchMedia('(any-pointer: coarse)').matches,
      natural: () => {
        const min = windowType(win.kind)?.bar_min || { width_px: 240, height_px: 120 };
        const chrome = hdr.offsetHeight + (winBars.get(win.no)?.offsetHeight || 0);
        return { w: min.width_px * MINI_NATURAL, h: min.height_px * MINI_NATURAL + chrome };
      },
      name: () => winLabel(win.no),
      onHold: () => setHeld(win.no),
    }));
  }
  return panel;
}

// ── Drag handles ───────────────────────────────────────────────────────────
// ── Tab / panel operations ─────────────────────────────────────────────────
function activateTab(leaf, i) {
  if (i === leaf.active) return;
  leaf.active = i;
  commit();
}

// Split the panel: it stays as it is, the new panel gets an empty placeholder
// window ("Add window"). side: 'right' | 'down'.
function doSplit(leaf, side) {
  const no = nextWinNo();
  layout.windows[no] = newWindow(no, 'empty');
  const fresh = { type: 'leaf', wins: [no], active: 0 };
  replaceNode(leaf, { type: 'split', dir: side === 'right' ? 'h' : 'v', ratio: 0.5, children: [leaf, fresh] });
  focusNode(fresh);
  commit();
}

function closeTab(leaf, no) {
  if (leaf.wins.length === 1) return closePanel(leaf);
  const i = leaf.wins.indexOf(no);
  leaf.wins.splice(i, 1);
  delete layout.windows[no];
  if (i < leaf.active || leaf.active >= leaf.wins.length) leaf.active = Math.max(0, leaf.active - 1);
  commit();
}

// Removing a leaf collapses its parent split into the sibling. The last panel
// stays, as an empty one.
function closePanel(leaf) {
  leaf.wins.forEach(no => delete layout.windows[no]);
  const p = findParent(layout.root, leaf);
  if (!p) {
    const no = nextWinNo();
    layout.windows[no] = newWindow(no, 'empty');
    leaf.wins = [no];
    leaf.active = 0;
    return commit();
  }
  const wasFocused = focusedLeaf() === leaf;
  const sibling = p.children[p.children[0] === leaf ? 1 : 0];
  const keep = focusedLeaf();
  replaceNode(p, sibling);
  focusNode(wasFocused ? sibling : keep);
  commit();
}

// ── Context menu ───────────────────────────────────────────────────────────
const ctx = document.getElementById('ctx');

// The window menu at `at` ({x, y}): tap the tab dot, hold the tab or the
// header, or right-click — the same menu for mouse and touch.
function showCtx(at, leaf, no, dot) {
  const w = layout.windows[no];
  const label = winLabel(no);
  const empty = w.kind === 'empty';
  const lastEmpty = empty && layout.root === leaf && leaf.wins.length === 1;
  // 12c: the window's own lines (Settings…, its bar, Reset) run with the
  // window as owner; a bar hidden for size lists its items here.
  const view = winFeed.views[no];
  const bar = winBars.get(no);
  const hiddenItems = !empty && view?.bar && bar?.hiddenBySize ? bar.menuItems() : [];
  const own = empty ? [] : [
    ...(hiddenItems.length ? [{ hdr: 'Bar hidden — its items:' }, ...hiddenItems, null] : []),
    { ico: 'settings', lbl: 'Settings…', hint: 'EditSetting Self', id: `${w.kind}/settings`, fn: () => openSettings(at, no) },
    { ico: 'panel-left', lbl: 'Window bar', check: !!view?.bar, id: `${w.kind}/window_bar`, fn: () => wsCommand('Set Self "WindowBar" Toggle', no) },
    { ico: 'rotate-ccw', lbl: 'Reset window…', hint: 'Reset Self', warn: true, id: `${w.kind}/reset`, fn: () => wsCommand('Reset Self', no) },
    // 12c2: the window full screen (every client of the screen when the
    // profile's HoldFollows is on), and F12 / F11 by touch.
    { ico: 'maximize', lbl: maximizedWin() === no ? 'Back into its pane' : 'Maximize', hint: 'Set Self "Maximized"', id: `${w.kind}/maximize`,
      fn: () => setHeld(maximizedWin() === no ? null : no) },
    null,
  ];
  renderCtx(at, [
    { hdr: `Window ${winName(no)} · ${label}` },
    ...own,
    { ico: 'columns-2', lbl: 'Split right', fn: () => doSplit(leaf, 'right') },
    { ico: 'rows-2', lbl: 'Split down',  fn: () => doSplit(leaf, 'down') },
    null,
    // On an empty pane, adding fills the placeholder instead of tabbing beside it.
    { ico: 'app-window', lbl: 'Add window…', hint: 'Store Window', fn: () => openPicker({ mode: empty ? 'fill' : 'add', win: no }) },
    { ico: 'replace', lbl: 'Change type…', off: empty, fn: () => openPicker({ mode: 'retype', win: no }) },
    { ico: 'pencil', lbl: 'Rename…', hint: 'Label Self', off: empty, fn: () => wsCommand('Label Self', no) },
    null,
    { ico: 'maximize', lbl: 'Full screen (bars)', hint: 'Sidebars · F12', fn: () => wsCommand('Sidebars') },
    { ico: 'camera', lbl: 'Screenshot', hint: 'Screenshot · F11', fn: () => wsCommand('Screenshot') },
    null,
    { ico: 'x', lbl: `Close ${label}`, off: lastEmpty, fn: () => closeTab(leaf, no) },
    { ico: 'x', lbl: 'Close panel', off: lastEmpty, danger: true, fn: () => closePanel(leaf) },
  ]);
  dot?.classList.add('open');
}

// A menu (the kit's, decisions §30) at `at`: {x, y} or a pointer event.
// Items: { ico: <icon name>, lbl, fn, off, danger, warn, hint, keep, check, id } · null · { hdr }
// · kit menu rows as they are (a window bar's items: { label, value, check, id, fn }).
function renderCtx(at, items) {
  const point = at.x != null ? { x: at.x, y: at.y } : { x: at.clientX, y: at.clientY };
  LumaKit.menu.openMenu(point, items.map(i => !i ? null : i.hdr ? { header: i.hdr } : i.label != null ? i
    : { icon: i.ico, label: i.lbl, fn: i.fn, off: i.off, danger: i.danger, warn: i.warn, hint: i.hint, keep: i.keep, check: i.check, id: i.id }));
}
let ctxClosedAt = { t: 0, dot: null };
function hideCtx() {
  if (ctx.hidden) return;
  ctx.hidden = true;
  ctxClosedAt = { t: performance.now(), dot: document.querySelector('.tab-dot.open') };
  document.querySelectorAll('.tab-dot.open').forEach(d => d.classList.remove('open'));
}
// A press anywhere outside the menu closes it (touch and mouse alike).
document.addEventListener('pointerdown', e => { if (!ctx.contains(e.target)) hideCtx(); }, true);
document.addEventListener('click', e => { if (!ctx.contains(e.target)) hideCtx(); });
window.addEventListener('blur', hideCtx);

// ── Add Window picker ──────────────────────────────────────────────────────
// Category tabs plus an "All" tab with a filter over name, category and
// keywords; typing a letter anywhere jumps to All and filters.
// Picking runs a command:
//   fill    Store Window <no> "Type"              an empty pane
//   add     Store Window "Type" /Pane <no>        a new tab beside <no>
//   retype  Store Window <no> "Type" /Overwrite   change the type in place
const CATEGORY_ORDER = ['Common', 'Pools', 'Sheets', 'Tools', 'Others'];
const pickerEl = document.getElementById('picker-overlay');
let picker = null; // { mode, win, tab, filter, sel }

function pickerTypes() {
  const known = windowTypes.length ? windowTypes
    : Object.entries(TAB_KINDS).map(([name, k]) => ({ name, label: k.label, icon: k.ico, category: 'Common', keywords: [], hidden: name === 'empty' }));
  return known.filter(t => !t.hidden && TAB_KINDS[t.name]);
}

function pickerTabs() {
  const rank = c => (CATEGORY_ORDER.indexOf(c) + 1) || 99;
  const cats = [...new Set(pickerTypes().map(t => t.category))].sort((a, b) => rank(a) - rank(b));
  return [...cats, 'All'];
}

function pickerItems() {
  const q = picker.filter.trim().toLowerCase();
  return pickerTypes().filter(t => picker.tab !== 'All' ? t.category === picker.tab
    : !q || [t.label, t.name, t.category, ...(t.keywords || [])].some(s => s.toLowerCase().includes(q)));
}

function openPicker(opts) {
  ctx.hidden = true;
  // Opens on All with the filter focused, so the user can type right away.
  picker = { ...opts, tab: 'All', filter: '', sel: 0 };
  pickerEl.classList.add('open');
  renderPicker();
  pickerEl.querySelector('.pk-filter input').focus();
}

function closePicker() {
  picker = null;
  pickerEl.classList.remove('open');
  syncKeyboardFocus();
}

function renderPicker() {
  const { mode, win } = picker;
  pickerEl.querySelector('.pk-title').textContent =
    mode === 'retype' ? `Change Window ${win} (${winLabel(win)})` : mode === 'fill' ? `Add Window ${win}` : 'Add Window';

  const tabs = pickerEl.querySelector('.pk-tabs');
  tabs.innerHTML = '';
  for (const name of pickerTabs()) {
    const b = document.createElement('button');
    b.className = 'pk-tab' + (name === picker.tab ? ' on' : '');
    b.textContent = name;
    b.onclick = () => { picker.tab = name; picker.sel = 0; renderPicker(); };
    tabs.appendChild(b);
  }

  const filter = pickerEl.querySelector('.pk-filter');
  filter.hidden = picker.tab !== 'All';
  const input = filter.querySelector('input');
  if (input.value !== picker.filter) input.value = picker.filter;
  renderPickerItems();
}

function renderPickerItems() {
  const grid = pickerEl.querySelector('.pk-grid');
  grid.innerHTML = '';
  const items = pickerItems();
  picker.sel = Math.min(picker.sel, Math.max(0, items.length - 1));
  const current = picker.mode === 'retype' ? layout.windows[picker.win]?.kind : null;
  items.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'pk-item' + (i === picker.sel ? ' sel' : '') + (t.name === current ? ' cur' : '');
    b.style.setProperty('--ind', 'var(--lc-dot-off)');
    b.innerHTML = `<span class="pk-ico">${LumaKit.icon(TAB_KINDS[t.name].ico || t.icon)}</span>`
      + `<span class="pk-text"><span class="pk-name"></span><span class="pk-desc"></span></span>`
      + (picker.tab === 'All' ? `<span class="pk-cat"></span>` : '');
    b.querySelector('.pk-name').textContent = t.label;
    b.querySelector('.pk-desc').textContent = t.description || '';
    if (picker.tab === 'All') b.querySelector('.pk-cat').textContent = t.category;
    b.onclick = () => pickType(t);
    grid.appendChild(b);
  });
  if (!items.length) {
    const none = document.createElement('div');
    none.className = 'pk-none';
    none.textContent = 'No window matches.';
    grid.appendChild(none);
  }
}

function pickType(t) {
  const { mode, win } = picker;
  closePicker();
  const type = `"${t.label}"`;
  if (mode === 'retype') {
    if (layout.windows[win]?.kind !== t.name) wsCommand(`Store Window ${win} ${type} /Overwrite`);
  } else if (mode === 'add') {
    wsCommand(`Store Window ${type} /Pane ${win}`);
  } else {
    wsCommand(`Store Window ${win} ${type}`);
  }
}

pickerEl.querySelector('.pk-filter input').addEventListener('input', e => {
  picker.filter = e.target.value;
  picker.sel = 0;
  renderPickerItems();
});
pickerEl.addEventListener('pointerdown', e => { if (e.target === pickerEl) closePicker(); });
pickerEl.addEventListener('keydown', e => {
  if (!picker) return;
  const grid = pickerEl.querySelector('.pk-grid');
  const items = pickerItems();
  const inFilter = e.target.tagName === 'INPUT';
  if (e.key === 'Escape') { e.preventDefault(); return closePicker(); }
  if (e.key === 'Enter') { e.preventDefault(); if (items[picker.sel]) pickType(items[picker.sel]); return; }
  const cols = poolColumns(grid);
  const step = { ArrowLeft: inFilter ? 0 : -1, ArrowRight: inFilter ? 0 : 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
  if (step) {
    e.preventDefault();
    picker.sel = Math.max(0, Math.min(items.length - 1, picker.sel + step));
    renderPickerItems();
    grid.querySelector('.pk-item.sel')?.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const tabs = pickerTabs();
    picker.tab = tabs[(tabs.indexOf(picker.tab) + (e.shiftKey ? tabs.length - 1 : 1)) % tabs.length];
    picker.sel = 0;
    return renderPicker();
  }
  // Typing outside the filter: jump to All and start filtering with that key.
  if (!inFilter && e.key.length === 1 && /\S/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    picker.tab = 'All';
    picker.filter = e.key;
    picker.sel = 0;
    renderPicker();
    const input = pickerEl.querySelector('.pk-filter input');
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
});

// ── Command line bar ───────────────────────────────────────────────────────
// Full width at the bottom of every screen: ◀ control bar toggle, PURR
// (command line history), the command line itself — a one-row viewport of the
// shared session with only the input layer — contextual status icons, the
// session indicator, the shortcut mode toggle and ▶ view bar toggle.

function initCmdBar() {
  const line = document.getElementById('cb-line');
  line.appendChild(termFor(BAR_VIEW, { layers: 'input', term: { fontSize: 14, theme: barTermTheme() } }).host);
  line.addEventListener('pointerdown', () => focusBar());
  barSuggest.init();
  updateNet();
}

// Suggestions above the command line (decisions §30 "12b2", Suggest board):
// the kit's <luma-suggest> fed by the station (`suggest` / `suggestions` on
// the shell socket; the line itself lives in the station's session). The
// profile's Suggestions setting: Auto opens it after a short pause while
// typing, TabOnly on Tab, Off never. Enter runs the line as typed; Tab or a
// tap takes the selected item (the station writes it into the line, `line_edit`);
// ↑ ↓ move only while it is open (else history); → at the end takes the grey
// ghost text (drawn by the station in the line); Esc closes. The grey text is
// the station's too. `barSuggest.ctl` is the list's controller.
const barSuggest = {
  ctl: null, timer: 0, tabbed: false,
  PAUSE_MS: 220,
  init() {
    const el = document.createElement('luma-suggest');
    el.setAttribute('mode', 'inline');
    el.id = 'cb-suggest';
    document.body.append(el);
    this.ctl = LumaKit.suggest.attach({
      el, surface: 'bar', send: wsSend,
      anchor: () => document.getElementById('cb-line').getBoundingClientRect(),
      onTake: (item, reply) => this.take(item, reply),
      onReply: reply => this.reply(reply),
    });
    // A press anywhere else closes it.
    document.addEventListener('pointerdown', e => { if (!e.target.closest?.('#cb-suggest')) this.close(); }, true);
  },
  mode() { return barStatus?.suggestions || 'Auto'; },
  visible() { return !!document.getElementById('cb-line')?.offsetParent; },
  ask() { clearTimeout(this.timer); if (ws?.readyState === WebSocket.OPEN) this.ctl.query(); },
  later(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.ask(), ms); },
  close() { clearTimeout(this.timer); this.tabbed = false; this.ctl?.close(); },
  reply(r) {
    const tab = this.tabbed;
    this.tabbed = false;
    // Tab on an empty line is the station's own (the quick sheet).
    if (tab && !r.line) return wsSend({ type: 'key', key: 'Tab', ctrl: false, alt: false, shift: false, repeat: false });
    if (!this.visible() || !r.items.length) return this.ctl.close();
    if (tab && r.items.filter(i => !i.disabled).length === 1) return this.take(r.items.find(i => !i.disabled), r);
    if (tab || this.mode() === 'Auto' || this.ctl.isOpen()) this.ctl.open();
  },
  take(item, reply) {
    wsSend({ type: 'line_edit', start: reply.replace[0], end: reply.replace[1], text: item.insert, expect: reply.line });
    // Auto goes on with what fits next; TabOnly closes until the next Tab.
    if (this.mode() === 'Auto') this.ask(); else this.close();
  },
  /** A key on its way to the station: true when the list took it. */
  key(e) {
    if (!this.ctl || this.mode() === 'Off' || !this.visible()) return false;
    const plain = !e.ctrlKey && !e.altKey && !e.metaKey;
    if (this.ctl.isOpen() && plain) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { this.ctl.move(e.key === 'ArrowDown' ? 1 : -1); return true; }
      if (e.key === 'Tab' && !e.shiftKey) { this.ctl.take(); return true; }
      if (e.key === 'Escape') { this.close(); return true; }
    }
    if (e.key === 'Tab' && plain && !e.shiftKey) { this.tabbed = true; this.ask(); return true; }
    if (e.key === 'Enter' || e.key === 'Escape') { this.close(); return false; }
    const edits = (e.key.length === 1 && !e.ctrlKey && !e.metaKey) ||
      ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key);
    if (edits && (this.mode() === 'Auto' || this.ctl.isOpen())) this.later(this.ctl.isOpen() ? 60 : this.PAUSE_MS);
    else if (!edits && !['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) this.close();
    return false;
  },
};

// PURR: the session's output in a popup (output layer only), a temporary
// command line history window.
function toggleHistory(open) {
  const pop = document.getElementById('history-pop');
  const show = open ?? pop.hidden;
  pop.hidden = !show;
  document.getElementById('cb-purr').classList.toggle('on', show);
  const t = termFor(HISTORY_VIEW, { layers: 'output' });
  if (show) pop.querySelector('.hp-body').appendChild(t.host);
  else t.host.remove();
  requestAnimationFrame(syncTermSizes);
}

// ◀ / ▶ hide the control bar and the view bar; remembered per screen in this
// browser.
const sidebars = { left: true, right: true, full: false };
function sidebarKey() { return `lumacore.sidebars.${liveScreen || 0}`; }
function applySidebars() {
  if (APP) Object.assign(sidebars, APP.page?.sidebars || {});
  else try { Object.assign(sidebars, JSON.parse(localStorage.getItem(sidebarKey())) || {}); } catch(_) {}
  document.getElementById('sidebar-left').classList.toggle('hidden', !sidebars.left);
  document.getElementById('sidebar-right').classList.toggle('hidden', !sidebars.right);
  document.body.classList.toggle('fullwin', !!sidebars.full);
  if (!sidebars.full) document.body.classList.remove('typing');
  document.getElementById('fs-handle').hidden = !sidebars.full;
  requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
  document.getElementById('cb-left').innerHTML = LumaKit.icon(sidebars.left ? 'chevron-left' : 'chevron-right');
  document.getElementById('cb-right').innerHTML = LumaKit.icon(sidebars.right ? 'chevron-right' : 'chevron-left');
}
function toggleSidebar(side) { setSidebars({ [side]: !sidebars[side] }); }
function setSidebars(next) {
  Object.assign(sidebars, next);
  // The app remembers it per machine, server, user and screen.
  if (APP) { APP.page = { ...(APP.page || {}), sidebars: { ...sidebars } }; toApp({ type: 'pref', key: 'sidebars', value: sidebars }); }
  else try { localStorage.setItem(sidebarKey(), JSON.stringify(sidebars)); } catch(_) {}
  applySidebars();
}

// F12 / Meow+F10 / Meow+F12 (decisions §30 "12a3"; core keys, never letters):
// the station sends a `page` event to the window the key came from.
function pageAction(what, on) {
  if (what === 'sidebars') {
    // F12 / Sidebars: full screen of the windows (every bar), the sidebars'
    // own state comes back with the bars.
    setSidebars({ full: on == null ? !sidebars.full : !on });
  } else if (what === 'viewbar') {
    setSidebars({ right: on ?? !sidebars.right });
  } else if (what === 'fullscreen') {
    if (HOST?.fullscreen) return HOST.fullscreen(on);
    const full = !!document.fullscreenElement;
    if ((on ?? !full) && !full) document.documentElement.requestFullscreen?.().catch(() => {});
    else if (!(on ?? !full) && full) document.exitFullscreen?.().catch(() => {});
  }
}

// Status icons: only what is active is shown (inactive status
// icons hide). Colours follow the status theme group.
let barStatus = null;
// Key LEDs (decisions §17): a UI key whose `state` names a mode is lit while
// that mode is on for this user (`Runtime.Users.{User}.Modes.Blind`).
let ledModes = [];
function renderKeyLeds(modes) {
  ledModes = modes;
  for (const el of document.querySelectorAll('[data-key]')) {
    const def = uiKeys.defs.get(el.dataset.key.toLowerCase());
    const mode = def?.state?.match(/\.Modes\.(\w+)$/i)?.[1];
    el.classList.toggle('lit', !!mode && modes.some(m => m.toLowerCase() === mode.toLowerCase()));
  }
}
function renderStatus(st) {
  barStatus = st;
  consentStep(st);
  const waiting = document.getElementById('sl-waiting');
  waiting.hidden = !st.attributes_waiting;
  waiting.querySelector('small').textContent = st.attributes_waiting ? `${st.attributes_waiting} WAIT` : '';
  const box = document.getElementById('cb-status');
  box.innerHTML = '';
  const icon = (glyph, text, cls, tip) => {
    const el = document.createElement('div');
    el.className = `cb-icon ${cls}`;
    el.title = tip;
    el.innerHTML = '<span class="cb-glyph"></span><span class="cb-text"></span>';
    el.querySelector('.cb-glyph').innerHTML = LumaKit.icon(glyph);
    el.querySelector('.cb-text').textContent = text;
    box.appendChild(el);
  };
  // Station statuses (feedback status events), then this client's own.
  for (const [key, f] of fb.statuses) {
    const [cls, tip, glyph] = FB_STATUS_STYLE[key] || ['active', f.title, 'info'];
    icon(glyph, f.title, cls, tip);
  }
  // This user's modes and the LumaSession role are in the top bar's strip (decisions
  // top-bar-status-strip); the keys there light as before.
  renderKeyLeds(st.modes || []);
  if (st.walk) icon('repeat', `${st.walk[0]}/${st.walk[1]}`, 'active', 'Walking through the selection');
  if (st.selected) icon('square-check', `${st.selected} FIX`, 'active', `${st.selected} fixture${st.selected === 1 ? '' : 's'} selected`);
  for (const c of st.claims || [])
    icon('flag', c.mine ? c.object : `${c.object}:${c.owner}`, c.mine ? 'mine' : '',
      c.mine ? `You have claimed ${c.object}` : `${c.object} is claimed by ${c.owner}`);
  renderStationDialogs(st);
  // Phones: ⋯ carries the statuses; it takes the worst one's colour.
  const more = document.getElementById('cb-more');
  more.classList.toggle('alert', !!box.querySelector('.cb-icon.alert'));
  more.classList.toggle('warning', !box.querySelector('.cb-icon.alert') && !!box.querySelector('.cb-icon.warning'));

  const mode = document.getElementById('cb-mode');
  mode.querySelector('.cb-text').textContent = st.mode;
  mode.classList.toggle('prg', st.mode === 'PRG');
  mode.classList.toggle('nav', st.mode === 'NAV');
  updateNet();
  onDeviceStatus(st.device);
}

// Phones (decisions §30 "12c2", PhoneFixes board): the command line bar is
// PURR · line · VK · ⋯; ⋯ lists the statuses, the session and the mode, and
// brings the control bar and F12 within a tap.
function cbMoreMenu(btn, ev) {
  ev?.stopPropagation(); // the page's click-outside would close it again
  const r = btn.getBoundingClientRect();
  const statuses = [...document.querySelectorAll('#cb-status .cb-icon')].map(el => ({
    icon: el.classList.contains('alert') ? 'octagon-alert' : el.classList.contains('warning') ? 'triangle-alert' : 'info',
    label: el.querySelector('.cb-text')?.textContent || '', hint: el.title, off: true,
  }));
  const up = ws?.readyState === WebSocket.OPEN;
  // A phone (decisions §30 "12e"): the folded sidebar's keys and the views
  // come first — each runs as it does from its own button.
  const folded = [];
  if (getComputedStyle(document.getElementById('sidebar-left')).display === 'none') {
    folded.push({ header: 'Sidebar' });
    for (const b of document.querySelectorAll('#sidebar-left .sl-btn')) {
      const label = b.querySelector('small')?.textContent || b.title.split(' — ')[0].split(' (')[0];
      folded.push({ icon: b.querySelector('luma-icon')?.getAttribute('name') || 'circle', label, check: b.classList.contains('lit') || b.classList.contains('on') || undefined,
        fn: () => (b.dataset.key ? keyAction(b.dataset.key, 'press', {}) : b.click()) });
    }
    // The view bar is hidden too: its buttons, as they would run.
    const held = (viewBar.buttons || []).filter(b => !b.missing);
    if (held.length) {
      folded.push(null, { header: 'View bar' });
      for (const b of held) folded.push({ icon: BAR_ICON[b.kind] || 'circle', label: `${b.slot} ${buttonName(b)}`, check: b.slot === activeSlot || undefined, fn: () => tapViewButton(b.slot, false) });
    }
    folded.push(null);
  }
  LumaKit.menu.openMenu({ x: r.right - 260, y: r.top - 8 }, [
    ...folded,
    { header: 'Status' },
    ...(statuses.length ? statuses : [{ icon: 'check', label: 'Nothing active', off: true }]),
    { icon: 'network', label: up ? 'Online' : 'Offline', hint: LumaKit.statusStrip.markState({ conn: stripConn, busy: !!station?.busy, ls: barStatus?.lumasession }).tip, off: true },
    null,
    { icon: 'keyboard', label: `Shortcut mode: ${barStatus?.mode || 'KBD'}`, hint: 'Shortcuts', fn: () => wsCommand('Shortcuts') },
    { icon: 'panel-left', label: 'Control bar', check: !!sidebars.left, fn: () => toggleSidebar('left') },
    { icon: 'maximize', label: 'Full screen', hint: 'Sidebars · F12', fn: () => wsCommand('Sidebars') },
  ]);
  // The menu opens upwards from the bar.
  const ctxEl = document.getElementById('ctx');
  ctxEl.style.top = `${Math.max(4, r.top - ctxEl.offsetHeight - 4)}px`;
}

// After `Login`: this client now works as `user` — join one of their screens
// and load their view bar.
async function switchUser(user) {
  currentUser = user;
  loadUiKeys();
  rememberUser(user);
  liveScreen = null;
  await loadLayout();
  loadSlots();
}

// `ScreenConfig n`: this machine now uses config n — open its screen.
async function switchScreenConfig(no) {
  try { localStorage.setItem(cfgKey(), String(no)); } catch(_) {}
  liveScreen = null;
  await loadLayout();
}

// The top bar's strip (decisions top-bar-status-strip): this client's status, the socket, the
// station's busy flag and Meow. It replaces the command line's ONLINE key.
function updateStrip() {
  stripConn = ws?.readyState === WebSocket.OPEN ? 'up' : 'retry';
  strip.update({
    status: barStatus || { user: viewUser || '' }, conn: stripConn, busy: !!station?.busy,
    meow: meowHeldNow ? 'held' : uiKeys.meowLatched ? 'latched' : '',
  });
}
const updateNet = updateStrip;
// A tap on the mark: the station's details and the lines you'd want next.
strip.addEventListener('mark', e => {
  e.stopPropagation(); // the page's click-outside would close the menu again
  const st = barStatus || {};
  const ls = st.lumasession || {};
  const m = LumaKit.statusStrip.markState({ conn: stripConn, busy: !!station?.busy, ls });
  const fact = (label, value) => ({ label: `${label}: ${value}`, off: true });
  LumaKit.menu.openMenu({ x: e.detail.x, y: e.detail.y }, [
    { header: `Station ${st.strip?.station || ''} · ${m.tip}` },
    fact('LumaSession', ls.status ? `${ls.status}${ls.master ? ` of ${ls.master}` : ''}` : 'Standalone'),
    ...(ls.latency_ms != null ? [fact('Latency', `${ls.latency_ms} ms`)] : []),
    ...(ls.pending ? [fact('Pending', `${ls.pending} lines`)] : []),
    fact('Show', `${st.show?.name || 'no show'}${st.show?.dirty ? ' · unsaved' : ''}`),
    fact('This device', `${st.user || viewUser || ''}${liveScreen ? ` · screen ${liveScreen}` : ''}`),
    null,
    { icon: 'radio-tower', label: 'LumaSessions…', fn: () => wsCommand('Menu "LumaSessions"') },
    { icon: 'activity', label: 'Info Health Clock', fn: () => wsCommand('Info Health Clock') },
  ]);
});

// Window types come from the server (GET /api/window-types, published at
// Root.Resources.WindowTypes): picker entries and settings schemas. Values are
// stored per window (layout.windows[no].settings). 0 means "auto" for slots /
// columns / rows.
async function loadWindowTypes() {
  try {
    const r = await fetch('/api/window-types');
    if (!r.ok) return;
    windowTypes = await r.json();
    for (const t of windowTypes) {
      if (!TAB_KINDS[t.name]) continue;
      TAB_KINDS[t.name].label = t.label;
      TAB_KINDS[t.name].settings = t.settings.map(f => ({
        key: f.key, label: f.label, hint: f.hint, def: f.default,
        type: f.type === 'bool' ? 'check' : f.type === 'enum' ? 'select' : f.type === 'int' ? 'number' : f.type,
        min: f.min, max: f.max, options: f.options, max_len: f.max_len,
      }));
    }
  } catch(_) {}
}

function winSettings(win) {
  const spec = TAB_KINDS[win.kind].settings || [];
  const stored = win.settings || {};
  return Object.fromEntries(spec.map(f => [f.key, stored[f.key] ?? f.def]));
}

// ── Window bars and live titles (decisions §30 "12c") ───────────────────────
// One `windows` feed per page (State, our live screen): each window's live
// title, bar items, states, values and chips, resolved on the station. Each
// window shows a kit <luma-window-bar> above its content; every gesture in it
// is a command line sent with the window as owner (`Self`). The layout PUT
// carries only splits, sizes and tabs — never a bar or setting change.
const winFeed = { sub: null, screen: null, views: {} };
const winBars = new Map(); // window no → its <luma-window-bar>
let winSettingsOpen = null; // { no, target, title }: the settings window shows this window

function windowType(kind) { return windowTypes.find(t => t.name === kind) || null; }

// The screen's encoder bar (decisions §30 "12f"): the `encoder` feed draws it; its lines go out
// as commands (`Set Screen Encoder…`) and gestures (the document's `gesture` listener).
const encFeed = { sub: null, screen: null };
function encoderSubscribe() {
  if (!liveScreen || (encFeed.sub && encFeed.screen === liveScreen)) return;
  encFeed.sub?.close();
  encFeed.screen = liveScreen;
  const bar = document.getElementById('encbar');
  if (!bar.dataset.wired) {
    bar.dataset.wired = '1';
    bar.addEventListener('run', e => wsCommand(e.detail.line));
  }
  encFeed.sub = feeds().sub('encoder', { screen: liveScreen }, { batch: m => {
    if (!m.data || m.data.missing != null) return;
    bar.update(m.data);
    // A Presets window follows the encoder bar's feature group (decisions 0288).
    const feature = m.data.feature ?? '';
    if (feature !== encFeed.feature) { encFeed.feature = feature; presetPoolsFollow(); }
  } });
}

function windowsSubscribe() {
  if (!liveScreen || (winFeed.sub && winFeed.screen === liveScreen)) return;
  winFeed.sub?.close();
  winFeed.screen = liveScreen;
  winFeed.views = {};
  winFeed.sub = feeds().sub('windows', { screen: liveScreen }, { batch: m => onWindows(m.data) });
}

function onWindows(d) {
  if (!d || d.missing != null || d.screen !== liveScreen) return;
  // 12c2: the screen's maximised window (every client follows it).
  if ('maximized' in d && stationMax(d.maximized)) renderLayout();
  const prev = winFeed.views;
  winFeed.views = d.windows || {};
  for (const [no, v] of Object.entries(winFeed.views)) {
    const n = Number(no);
    if (layout.windows[n]?.kind === v.type) winBars.get(n)?.update({ type: windowType(v.type), view: v });
    document.querySelectorAll(`.ptab[data-win="${n}"] .tab-title`).forEach(el => paintTitle(n, el));
    if (prev[no] && JSON.stringify(prev[no]) !== JSON.stringify(v)) refreshWinSettings(n);
  }
}

/** A tab's live title: the station's (sysmon "3 errors" as an alert pill),
 *  or the page's own reading (Realtime "60 fps"). */
function paintTitle(no, el) {
  const own = layout.windows[no]?.kind === 'realtime' ? rtTitle(no) : null;
  const text = own?.text ?? winFeed.views[no]?.title ?? '';
  const errors = /^(\d+) errors?$/.exec(text);
  el.textContent = text;
  el.hidden = !text;
  el.className = 'tab-title' + (errors && +errors[1] > 0 ? ' alert' : own?.tone ? ` ${own.tone}` : '');
}

/** A window's content under its bar. */
function buildWindow(win) {
  const content = TAB_KINDS[win.kind].build(win);
  if (win.kind === 'empty') return content;
  const wrap = document.createElement('div');
  wrap.className = 'win-wrap';
  wrap.dataset.win = win.no;
  let bar = winBars.get(win.no);
  if (!bar) {
    bar = document.createElement('luma-window-bar');
    bar.addEventListener('run', e => wsCommand(e.detail.line, win.no));
    winBars.set(win.no, bar);
  }
  const v = winFeed.views[win.no];
  bar.update({ type: windowType(win.kind), view: v?.type === win.kind ? v : null });
  wrap.append(bar, content);
  return wrap;
}

/** The open settings window shows window `no`: ask the station again (its
 *  values, ↺ marks, pins and preset line follow every change, from anywhere). */
let winSettingsTimer = null;
function refreshWinSettings(no) {
  const open = winSettingsOpen;
  if (!open || open.no !== no || LumaKit.settings.settingsTitle() !== open.title) return;
  clearTimeout(winSettingsTimer);
  winSettingsTimer = setTimeout(() => wsCommand(`EditSetting ${open.target}`), 60);
}

// ── Pool windows — one component for every pool (decisions §22) ─────────────
// The pool layout grid. The server builds the cells (GET /api/pools/<pool>,
// live over the `pools` feed: number, name, colour, who edits it, references, how
// much of it the selection covers, a level bar, badges); every gesture sends
// a real command line through our shell, so rights, claims, undo and
// replication apply:
//   tap         completes a pending command (Delete + tap → Delete Group 3;
//               Move/Copy wait for the target) or runs the window's action
//   hold        (hold still for the profile's hold time) opens the full-screen
//               selector; drag over it and release on an object to tap it
//   drag        Move <pool> a At b; Ctrl-drag copies (profile pool_drag Off
//               switches dragging off, e.g. on touch screens)
//   right-click Store / Edit / Label / Delete / Move / Copy / settings
const pools = { subs: new Map(), data: new Map(), renders: new Map(), drag: 'Move' };

// One `pools` feed subscription per window (state: the cells as they are now).
function poolSubscribe(id, pool, datapool, profile = 'selected', filter = {}) {
  const prev = pools.subs.get(id);
  // Windows that are gone stop their feed.
  for (const [no, s] of [...pools.subs])
    if (!layout.windows[no]) { s.sub.close(); pools.subs.delete(no); pools.data.delete(no); pools.renders.delete(no); }
  if (prev && layout.windows[id] && prev.pool === pool && JSON.stringify(prev.datapool) === JSON.stringify(datapool)
    && JSON.stringify(prev.profile) === JSON.stringify(profile) && JSON.stringify(prev.filter) === JSON.stringify(filter)) return;
  prev?.sub.close();
  const sub = feeds().sub('pools', { pool, datapool, profile, ...filter }, {
    batch: m => {
      const d = { ...m.data, id };
      pools.data.set(id, d);
      pools.renders.get(id)?.(d);
    },
  });
  pools.subs.set(id, { pool, datapool, profile, filter, sub });
}

/** A Presets window's filter (decisions 0288): its feature group — the encoder bar's while it
 *  follows, `all`, or a pinned group's GUID — and its lit tags. */
function presetFilter(win) {
  if (win.kind !== 'presets') return {};
  const cfg = winSettings(win);
  const fg = String(cfg.feature_group ?? 'selected');
  return { feature: fg === 'selected' ? (encFeed.feature ?? '') : fg, tags: cfg.tags || '' };
}
function poolSubscribeFor(win, pool) {
  const cfg = winSettings(win);
  poolSubscribe(win.no, pool, cfg.datapool || 'selected', cfg.profile || 'selected', presetFilter(win));
}
/** The encoder bar's feature group changed: every following Presets window filters again. */
function presetPoolsFollow() {
  for (const w of Object.values(layout.windows || {})) if (w.kind === 'presets') poolSubscribeFor(w, 'Preset');
}

const poolCursor = new Map(); // window no → keyboard cursor slot

function buildPoolPanel(win, pool) {
  const cfg = { action: '', datapool: 'selected', ...winSettings(win) };
  const wrap = document.createElement('div');
  wrap.className = 'pool-win';
  wrap.dataset.win = win.no;
  const title = document.createElement('div');
  title.className = 'pool-title';
  title.hidden = cfg.show_title === false;
  // A Presets window: the tag chips on top; Packed closes the cells up (decisions 0288).
  const presets = win.kind === 'presets';
  const chips = document.createElement('div');
  chips.className = 'lc-pre-tags';
  chips.hidden = !presets;
  chips.addEventListener('click', e => {
    const b = e.target.closest('[data-tag]');
    if (!b) return;
    const on = new Set(String(winSettings(win).tags || '').split(',').filter(Boolean));
    on.has(b.dataset.tag) ? on.delete(b.dataset.tag) : on.add(b.dataset.tag);
    wsCommand(`Set Self "Tags" "${[...on].join(',')}"`, win.no);
  });
  // The pool itself is the kit's (decisions §30 "12e"): only the rows in
  // view, cells updated in place, its scroll kept; every gesture comes back
  // here and becomes a command line.
  const el = document.createElement('luma-pool');
  const body = document.createElement('div');
  body.className = 'pool-body';
  body.appendChild(el);
  wrap.append(title, chips, body);
  wrap.pool = el;
  let lastRow = Math.max(0, Math.floor(Number(win.scroll?.v) || 0));
  el.setup({
    kind: win.kind,
    settings: { ...cfg, packed: presets && (cfg.layout ?? 'Packed') === 'Packed' },
    onTap: n => poolTap(win, n),
    // A press-and-release action (Top, decisions §32): its line at the press, the release line
    // when the finger lifts.
    pressRelease: () => !!poolAction(win)?.release,
    onPress: n => wsSend({ type: 'tap', object: poolObject(win), no: n, action: poolAction(win)?.command ?? '', window: win.no }),
    onRelease: n => wsSend({ type: 'tap', object: poolObject(win), no: n, action: poolAction(win)?.release ?? '', window: win.no }),
    // Hold (or right-click) on an object: the window's Hold action (a Sequence pool: Edit by
    // default, decisions §30 "12f"), else the one context menu; on an empty slot nothing.
    onHold: (n, c, at) => {
      if (!c) return;
      if (win.kind === 'sequences' && (winSettings(win).hold_action ?? 'Edit') === 'Edit') return poolCmd(`Edit ${poolObject(win)} ${n}`);
      openPoolMenu(win, n, c, at);
    },
    onDrop: (from, to, copy) => poolCmd(`${copy ? 'Copy' : 'Move'} ${poolObject(win)} ${from} At ${to}`),
    // Onto a view button: one Assign line (decisions 0287).
    dropOut: (no, x, y) => {
      const vb = viewButtonUnder(x, y);
      if (!vb) return null;
      const line = `Assign ${poolObject(win)} ${no} At ViewButton ${viewBar.screen}.${vb.dataset.slot}`;
      return { el: vb, label: line, drop: () => poolCmd(line) };
    },
    drag: () => pools.drag !== 'Off' && !poolViewOnly(win),
    label: () => poolName(win),
    // The window's scroll: its first visible row, quietly (R1 Q31).
    onScrollRow: row => {
      if (row === lastRow) return;
      lastRow = row;
      win.scroll = { ...(win.scroll || {}), h: 0, v: row };
      wsSend({ type: 'scroll', window: win.no, row });
    },
  });
  el.cursor = poolCursor.get(win.no) ?? 1;
  if (lastRow) el.scrollToRow(lastRow);

  const first = Math.max(1, cfg.first_index || 1);
  const render = d => {
    if (d.datapool_missing) { title.textContent = `${pool}: its DataPool is gone (Settings → DataPool)`; el.cells = []; return; }
    if (d.missing) { title.textContent = `${pool}: not a pool`; return; }
    const action = cfg.action || d.actions[0]?.name || 'None';
    // A profile's pool (Views) names its profile; another user's views are only shown; a Presets
    // window names the feature group it shows.
    const fg = String(cfg.feature_group ?? 'selected');
    const shows = d.head?.feature ? esc(d.head.feature) : 'every preset';
    const home = win.kind === 'views' ? `Profile ${esc(d.profile ?? '')}${d.mine === false ? ' · view only' : ''}`
      : presets ? `${fg === 'selected' ? 'Following' : 'Pinned'}: ${shows}` : `DataPool ${esc(d.datapool)}`;
    if (presets) {
      const lit = new Set(String(cfg.tags || '').split(',').filter(Boolean));
      chips.innerHTML = (d.head?.tags || []).map(t => `<button type="button" class="lc-pre-chip" data-tag="${esc(t.guid)}" aria-pressed="${lit.has(t.guid)}">#${esc(t.name)}</button>`).join('')
        || '<span class="now">No tags yet: Assign Tag "name" At Preset n</span>';
    }
    el.head = d.head;
    // The label is user text (replicated with the profile): escaped, never markup.
    title.innerHTML = `<span class="pt-name">${esc(winLabel(win.no))}</span>`
      + `<span class="pt-info">${home}${first > 1 ? ` · ≥${esc(first)}` : ''} · ${esc(action)}</span>`;
    el.cells = d.cells;
  };
  pools.renders.set(win.no, render);
  const cached = pools.data.get(win.no);
  if (cached && cached.pool?.toLowerCase() === pool.toLowerCase()) render(cached);
  // "selected" (follow) or a DataPool's GUID; the station resolves it (decisions §30 "12b2").
  poolSubscribeFor(win, pool);

  // Hold (or right-click) outside the cells: the window's settings.
  LumaKit.pointer.hold(wrap, {
    filter: e => !e.target.closest('.lc-pool-cell, .lc-pool-banner'),
    onHold: at => renderCtx(at, [{ ico: 'settings', lbl: `${winLabel(win.no)} settings…`, fn: () => openSettings(at, win.no) }]),
  });
  return wrap;
}

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]); }

function poolOf(win) { return pools.data.get(win.no); }
function poolName(win) { return poolOf(win)?.pool || 'Group'; }
function poolPinned(win) {
  // A profile's pool (Views) has no DataPool: its lines name the user's own views.
  if (win.kind === 'views') return false;
  return !['', 'selected', '0', 'null', 'undefined'].includes(String(winSettings(win).datapool ?? '').toLowerCase());
}
/** Another profile's views are only shown: no line acts on them. */
function poolViewOnly(win) { return poolOf(win)?.mine === false; }
// The object word a window's lines name: owner first when the window is
// pinned to a DataPool (`DataPool 2 Group`, R1-55) — a bare `Group 3` would
// act in the user's selected DataPool instead.
function poolObject(win) {
  const d = poolOf(win);
  return poolPinned(win) && d ? `DataPool ${d.datapool} ${d.pool}` : poolName(win);
}

// A tap: the server completes a pending command or runs the action.
/** The window's tap action (its setting, else the pool's first). */
function poolAction(win) {
  const d = poolOf(win);
  if (!d || d.missing) return null;
  const name = winSettings(win).action || d.actions[0]?.name;
  return d.actions.find(a => a.name === name) || d.actions[0];
}

function poolTap(win, n) {
  const d = poolOf(win);
  if (!d || d.missing || poolViewOnly(win)) return;
  setPoolCursor(win.no, n);
  const cell = d.cells.find(c => c.no === n);
  const action = poolAction(win);
  // An empty slot only completes a pending command (Store + tap).
  wsSend({ type: 'tap', object: poolObject(win), no: n, action: cell ? (action?.command ?? '') : '', window: win.no });
}

function poolCmd(cmd) { wsCommand(cmd); }

// The one context menu on a pool object (decisions §34 round 3, 18; it replaces the object
// sheet): the object's menu from the registry, each pick one line; Move / Copy pick their target
// by a tap in the pool, Edit members opens the group editor, Edit… the object's settings card.
async function openPoolMenu(win, n, c, at) {
  const kind = poolName(win);
  const menu = (await LumaKit.context.objectMenus())[kind];
  const obj = `${poolObject(win)} ${n}`;
  if (!menu) { poolCmd(`EditSetting ${obj}`); return; }
  const r = document.querySelector(`.pool-win[data-win="${win.no}"]`)?.getBoundingClientRect();
  LumaKit.context.openContext({
    at: at || { x: r?.left ?? 0, y: r?.top ?? 0 }, menu, object: poolObject(win), rows: String(n), count: 1,
    value: prop => (String(prop).toLowerCase() === 'name' ? [c.name || ''] : null),
    note: [poolOf(win)?.datapool != null ? `DataPool ${poolOf(win).datapool}` : '', c.owner ? `Held by ${c.owner}` : c.locked ? 'Locked' : ''].filter(Boolean).join(' · '),
    level: myLevel(),
    run: line => (line === `Edit ${obj}` ? openPoolEditor(win, n) : poolCmd(line)),
    edit: () => poolCmd(`EditSetting ${obj}`),
    // Renumber… is the value dialog (free numbers, Skip taken / Swap) over the pool's numbers.
    valueDialog: k => {
      if (k === 'preseteditor') { openPoolEditor(win, n); return true; }
      if (k !== 'number') return false;
      const nos = (poolOf(win)?.cells || []).map(x => x.no);
      LumaKit.value.openValue({
        title: 'Renumber', sub: `${kind} ${n}${c.name ? ` · ${c.name}` : ''}`, avoid: r,
        kind: LumaKit.value.renumberKind({ object: poolObject(win), rows: [n], grid: [n], taken: nos.filter(x => x !== n) }),
        apply: poolCmd,
      });
      return true;
    },
    target: (item, go) => {
      if (item.id !== 'move' && item.id !== 'copy') return false;
      const pool = document.querySelector(`.pool-win[data-win="${win.no}"]`)?.pool;
      if (!pool) return false;
      pool.armPick(`${item.id === 'move' ? 'Move' : 'Copy'} ${kind} ${n}: tap the target`, n, to => go(String(to)));
      return true;
    },
  });
}

// ── Object editor (Edit; Group: members and grid) ───────────────────────────
// `Edit Group 3` claims the group (others see the red lock); the editor sends
// the same commands the Shell uses and closes with `exit`.
const editor = { open: false, pool: null, no: 0, ed: null, sub: null };

async function openPoolEditor(win, n) {
  const pool = poolName(win);
  // A preset's values (decisions 0288): the kit's preset editor on the same feed.
  if (pool.toLowerCase() === 'preset') {
    closePoolEditor(false);
    const ed = LumaKit.presetEditor.openPresetEditor({ onClose: () => closePoolEditor(false) });
    Object.assign(editor, { open: true, pool, no: n, ed });
    editor.sub = feeds().sub('pool_editor', { pool, no: n }, {
      batch: m => {
        if (!editor.open) return;
        if (m.data?.missing != null) { closePoolEditor(false); return; }
        editor.ed.update(m.data);
      },
    });
    return;
  }
  if (pool.toLowerCase() !== 'group') { poolCmd(`Edit ${pool} ${n}`); return; }
  closePoolEditor(false);
  poolCmd(`Edit ${pool} ${n}`);
  const types = await LumaKit.tools.toolTypes();
  // The kit's editor (decisions §30 "12e"): every gesture is a command line.
  const ed = LumaKit.groupEditor.openGroupEditor({ line: poolCmd, exit: () => closePoolEditor(true), types });
  Object.assign(editor, { open: true, pool, no: n, ed });
  // The `pool_editor` feed (decisions §30 "12d"): the object as it is now,
  // pushed after every change — no poll.
  editor.sub = feeds().sub('pool_editor', { pool, no: n }, {
    batch: m => {
      if (!editor.open) return;
      if (m.data?.missing != null) { closePoolEditor(false); return; }
      editor.ed.update(m.data);
    },
  });
}

function closePoolEditor(sendExit) {
  if (!editor.open) return;
  editor.sub?.close();
  editor.ed?.close();
  if (sendExit) poolCmd('exit');
  Object.assign(editor, { open: false, ed: null, sub: null });
}

// ── Attribute board (decisions §30 "12f-a"): `Edit [UserProfile] Attribute` ──
// The kit's <luma-attr-board> fed by the `attributes` feed; every gesture is a
// command line. A second board (the patcher's show + own) waits for the first.
const attrBoard = { open: null, sub: null, queue: [] };

function openAttributeBoard(ev) {
  if (attrBoard.open) {
    const same = b => b.profile === ev.profile;
    if (!same(attrBoard.open.ev) && !attrBoard.queue.some(same)) attrBoard.queue.push(ev);
    return;
  }
  const board = LumaKit.attrBoard.openAttrBoard({ line: wsCommand, close: () => closeAttributeBoard(), filter: ev.filter, view: ev.view });
  attrBoard.open = { ev, board };
  attrBoard.sub = feeds().sub('attributes', ev.profile ? { profile: ev.profile } : {}, {
    batch: m => {
      if (!attrBoard.open) return;
      if (m.data?.missing != null) { attrBoard.open.board.close(); closeAttributeBoard(); return; }
      attrBoard.open.board.update(m.data);
    },
  });
}

function closeAttributeBoard() {
  attrBoard.sub?.close();
  Object.assign(attrBoard, { open: null, sub: null });
  const next = attrBoard.queue.shift();
  if (next) openAttributeBoard(next);
}

// ── Keyboard in a pool window (UI events from the server's key routing) ─────
function setPoolCursor(no, n) {
  poolCursor.set(no, n);
  const pool = document.querySelector(`.pool-win[data-win="${no}"]`)?.pool;
  if (!pool) return;
  pool.cursor = n;
  if (pool.closest('.panel.focused')) pool.reveal(n);
}

// How many columns a CSS grid lays out (the picker's arrow keys).
function poolColumns(grid) {
  const kids = grid.children;
  if (!kids.length) return 1;
  const top = kids[0].offsetTop;
  let c = 0;
  while (c < kids.length && kids[c].offsetTop === top) c++;
  return Math.max(1, c);
}

// Arrow keys move the cursor over the pool's slots (any slot / empty setting).
function poolUi(ev, body) {
  const pool = body.querySelector('.pool-win')?.pool;
  if (!pool) return;
  const no = focusedWin();
  const win = layout.windows[no];
  const cur = poolCursor.get(no) ?? 1;
  const c = poolOf(win)?.cells.find(x => x.no === cur);
  switch (ev.action) {
    case 'move':
      setPoolCursor(no, pool.step(cur, ev.dir));
      break;
    case 'activate':
      poolTap(win, cur);
      break;
    case 'edit':
      if (c) openPoolEditor(win, cur);
      break;
    case 'delete':
      if (c) poolCmd(`Delete ${poolObject(win)} ${cur}`);
      break;
  }
}

// ── System Monitor window ──────────────────────────────────────────────────
// The `sysmon` feed opens with the first monitor window (decisions §30
// "12b2"): the station's whole history in one batch, then its new lines per
// tick, into one store the page keeps as long as the station does (5000
// lines). Each window is a kit virtual list (luma-vlist: only the visible
// rows exist; filters and search run over the lines in memory) that keeps
// its view across re-renders. Rows: local time · subsystem · message,
// coloured by level. Scrolled up → tinted, following paused; back at
// the bottom → live again.
const SYSMON_MAX = 5000;
const sysmon = { lines: [], seq: 0, sub: null, views: new Map() };
const SM_RANK = { info: 0, warn: 1, error: 2, alert: 3 };

function sysmonConnect() {
  if (sysmon.sub) return;
  sysmon.sub = feeds().sub('sysmon', {}, {
    reset: () => {
      sysmon.lines = []; sysmon.seq = 0;
      for (const v of sysmon.views.values()) v.reset();
    },
    batch: m => {
      const c = m.cols;
      const add = [];
      // Lines the station no longer had for us: said, never silently lost.
      if (m.gap) add.push({ seq: m.gap.to, time_ms: Date.now(), elapsed_ms: 0, level: 'warn', subsystem: 'Monitor',
        message: `${m.gap.to - m.gap.from + 1} lines missed (the station's history moved on)` });
      for (let i = 0; i < c.seq.length; i++) {
        if (c.seq[i] <= sysmon.seq) continue;
        add.push({ seq: c.seq[i], time_ms: c.time_ms[i], elapsed_ms: c.elapsed_ms[i], level: c.level[i],
          subsystem: c.subsystem[i], message: c.message[i] });
      }
      if (!add.length) return;
      sysmon.seq = add[add.length - 1].seq;
      for (const l of add) sysmon.lines.push(l);
      if (sysmon.lines.length > SYSMON_MAX) sysmon.lines.splice(0, sysmon.lines.length - SYSMON_MAX);
      for (const v of sysmon.views.values()) v.add(add);
    },
  });
}

/** No monitor window left: the feed stops (it opens again with the next one). */
function sysmonRelease() {
  for (const no of sysmon.views.keys()) if (!layout.windows[no]) sysmon.views.delete(no);
  if (sysmon.views.size || !sysmon.sub) return;
  sysmon.sub.close();
  sysmon.sub = null; sysmon.lines = []; sysmon.seq = 0;
}

function smTime(ms) {
  const d = new Date(ms);
  const p = (n, w = 2) => String(n).padStart(w, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
}
/** Session time: since the station started (`1:02:03.004`). */
function smSession(ms) {
  const s = Math.floor(ms / 1000);
  const p = n => String(n).padStart(2, '0');
  return `${Math.floor(s / 3600)}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}.${String(ms % 1000).padStart(3, '0')}`;
}
function smElapsed(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}h${String(Math.floor(s / 60) % 60).padStart(2, '0')}m${String(s % 60).padStart(2, '0')}.${String(ms % 1000).padStart(3, '0')}s since start`;
}

function sysmonFor(no) {
  if (sysmon.views.has(no)) return sysmon.views.get(no);
  const host = document.createElement('div');
  host.className = 'sysmon';
  // The bar (Pause, Wrap, Level, Time, Clear, the search chip) is the
  // window's <luma-window-bar> (decisions §30 "12c"); here only the lines.
  host.innerHTML = `<div class="sm-cleared" hidden>— cleared here (this window only; the station keeps its history) —</div>
    <luma-vlist class="sm-list" tabindex="-1" placeholder="Waiting for the System Monitor…"></luma-vlist>`;
  const list = host.querySelector('.sm-list');
  const cleared = host.querySelector('.sm-cleared');
  const v = { host, list, cfg: null, key: '' };
  list.cap = SYSMON_MAX;

  const subs = () => (v.cfg.subsystems || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
  const passes = line => {
    if (v.cfg.since > 0 && line.time_ms <= v.cfg.since) return false;
    if (SM_RANK[line.level] < SM_RANK[v.cfg.level || 'info']) return false;
    const want = subs();
    if (want.length && !want.includes(String(line.subsystem).toLowerCase())) return false;
    const q = (v.cfg.search || '').toLowerCase();
    return !q || `${line.subsystem} ${line.message}`.toLowerCase().includes(q);
  };
  const highlight = (el, text) => {
    const q = (v.cfg.search || '').toLowerCase();
    if (!q) { el.textContent = text; return; }
    const lower = text.toLowerCase();
    let i = 0, j;
    while ((j = lower.indexOf(q, i)) >= 0) {
      el.append(text.slice(i, j));
      const m = document.createElement('mark');
      m.textContent = text.slice(j, j + q.length);
      el.append(m);
      i = j + q.length;
    }
    el.append(text.slice(i));
  };
  // A reused row element gets this line. Time: Session = since the station
  // started, Wall clock = local time (the other one on hover).
  list.renderRow = (line, r) => {
    r.className = `sm-row ${line.level}${line.subsystem === 'Cmd' ? ' cmd' : ''}`;
    r.dataset.seq = line.seq;
    if (!r.firstChild) r.innerHTML = '<span class="sm-time"></span><span class="sm-sub"></span><span class="sm-msg"></span>';
    const [t, s, m] = r.children;
    const wall = v.cfg.time === 'wall';
    t.textContent = wall ? smTime(line.time_ms) : smSession(line.elapsed_ms);
    t.title = wall ? smElapsed(line.elapsed_ms) : smTime(line.time_ms);
    s.textContent = line.subsystem; s.title = line.subsystem;
    m.textContent = '';
    m.title = v.cfg.wrap ? line.message : '';
    highlight(m, line.message);
  };

  // Settings changed / first open: the view is rebuilt from the store.
  v.render = () => {
    list.filter = passes;
    list.autoFollow = v.cfg.auto_scroll !== false;
    list.setItems(sysmon.lines);
    if (list.autoFollow) list.toEnd();
  };
  v.add = lines => { if (v.cfg) list.push(lines); };
  v.reset = () => list.setItems([]);
  // The window's settings (from the layout): Pause = AutoScroll off, Clear =
  // Since (hide what came before, in this window only), Wrap, Time.
  v.apply = cfg => {
    v.cfg = cfg;
    list.style.setProperty('--sm-font', `${cfg.font_size || 12}px`);
    list.classList.toggle('wrap', !!cfg.wrap);
    list.measure();
    cleared.hidden = !(cfg.since > 0);
    const key = JSON.stringify([cfg.level, cfg.subsystems, cfg.search, cfg.auto_scroll, cfg.since, cfg.time, cfg.wrap]);
    if (key !== v.key) { v.key = key; v.render(); }
  };

  LumaKit.pointer.hold(host, {
    onHold: at => renderCtx(at, [
      { ico: 'settings', lbl: `${winLabel(no)} settings…`, hint: 'EditSetting Self', fn: () => openSettings(at, no) },
      { ico: 'arrow-down-to-line', lbl: 'Jump to newest', fn: () => list.toEnd() },
    ]),
  });

  sysmon.views.set(no, v);
  return v;
}

function buildSysmonPanel(win) {
  // Drop views of windows that were closed.
  sysmonRelease();
  const v = sysmonFor(win.no);
  v.apply({ font_size: 12, level: 'info', subsystems: '', search: '', auto_scroll: true, wrap: false, time: 'session', since: 0, ...winSettings(win) });
  sysmonConnect();
  return v.host;
}

// ── Realtime window ────────────────────────────────────────────────────────
// The render stages at the native 60 fps (decisions §30 "12b2",
// the Realtime board): every render frame arrives over the `health.render`
// feed (16 ms batches, a hidden page 250 ms — still every frame) into a
// typed-array ring; each stage's number and its 10 s graph (kit luma-graph:
// dashed budget, late frames marked, a gap breaks the line) are drawn on the
// window's own requestAnimationFrame. The lines' send numbers, the session
// clock (offset to the master per member, PTP when linuxptp runs) and every
// thread come from the `health` state feed (4 Hz).
const RT_POINTS = 600;      // 10 s at 60 fps (the Graph setting: 5 / 10 / 30 s)
const RT_RING = 1800;       // 30 s kept
const RT_STAGES = 6;
const rtViews = new Map();
const rtUs = us => us == null || Number.isNaN(us) ? '—' : us >= 1000 ? `${(us / 1000).toFixed(2)} ms` : `${Math.round(us)} µs`;
const rtSigned = us => us == null ? '—' : `${us < 0 ? '−' : '+'}${rtUs(Math.abs(us))}`;
const rtPpm = v => v == null ? '—' : `${v} ppm`;
const rtEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function realtimeFor(no) {
  if (rtViews.has(no)) return rtViews.get(no);
  const host = document.createElement('div');
  host.className = 'rt';
  host.innerHTML = `<div class="rt-head"></div><div class="rt-graphs"></div>
    <div class="rt-note"></div>
    <div class="rt-sec">Lines</div><div class="rt-lines"></div>
    <div class="rt-sec">Clock</div><div class="rt-clock"></div><div class="rt-sec">Threads</div><div class="rt-threads"></div>`;
  const cols = ['frame_us', 'headroom_us', 'jitter_us', 'late', ...Array.from({ length: RT_STAGES }, (_, i) => `s${i}`)];
  const v = { host, health: null, ring: new LumaKit.feeds.SampleRing(RT_RING, cols), subs: [], graphs: [], names: '', lastGap: null, points: RT_POINTS, paused: false };
  const note = host.querySelector('.rt-note');
  const head = host.querySelector('.rt-head');
  const graphsBox = host.querySelector('.rt-graphs');
  const lines = host.querySelector('.rt-lines');
  const clock = host.querySelector('.rt-clock');
  const threads = host.querySelector('.rt-threads');

  // One row per graph: Frame, every stage, Headroom.
  const buildGraphs = stages => {
    const key = stages.join(',');
    if (key === v.names) return;
    v.names = key;
    const defs = [{ name: 'Frame', col: 'frame_us', tone: 'accent', budget: 16667, late: 'late' },
      ...stages.slice(0, RT_STAGES).map((name, i) => ({ name, col: `s${i}`, tone: 'info' })),
      { name: 'Headroom', col: 'headroom_us', tone: 'ok' }];
    graphsBox.innerHTML = '';
    v.graphs = defs.map(d => {
      const row = document.createElement('div');
      row.className = 'rt-g';
      row.innerHTML = `<div class="rt-g-label"><span class="rt-g-name"></span><span class="rt-g-now"></span><span class="rt-g-max"></span></div>
        <luma-graph points="${v.points}" tone="${d.tone}"></luma-graph>`;
      row.querySelector('.rt-g-name').textContent = d.name;
      const graph = row.querySelector('luma-graph');
      graph.budget = d.budget || 0;
      graph.setAttribute('aria-label', `${d.name} over the last 10 seconds`);
      graphsBox.append(row);
      return { ...d, graph, now: row.querySelector('.rt-g-now'), max: row.querySelector('.rt-g-max') };
    });
  };
  buildGraphs(['Plan', 'Inputs', 'Channels', 'Park', 'InputMerge', 'Publish']);

  // Network: store and ask for a frame. Drawing: on requestAnimationFrame.
  v.loop = LumaKit.feeds.drawLoop(() => v.draw());
  v.onFrames = m => {
    if (m.stages) buildGraphs(m.stages);
    if (m.gap) { v.ring.gap(m.gap.to - m.gap.from + 1); v.lastGap = { n: m.gap.to - m.gap.from + 1, at: Date.now() }; }
    const c = m.cols;
    if (c && c.frame_us.length) {
      const batch = { frame_us: c.frame_us, headroom_us: c.headroom_us, jitter_us: c.jitter_us, late: c.late };
      (c.stage_us || []).forEach((s, i) => { batch[`s${i}`] = s; });
      v.ring.pushCols(batch);
    }
    v.loop.dirty();
  };

  // The window's settings: Graph (seconds shown) and Pause (frames keep arriving).
  v.apply = cfg => {
    const points = Math.round((Number(cfg.graph) || 10) * 60);
    v.paused = !!cfg.pause;
    if (points !== v.points) { v.points = points; for (const g of v.graphs) g.graph.setAttribute('points', String(points)); }
    note.textContent = `${points / 60} s · one point per frame (${points}) · dashed = budget · red dot = late frame · a shaded break = gap${v.paused ? ' · paused' : ''}`;
    v.loop.dirty();
  };

  v.draw = () => {
    if (!host.isConnected || v.paused) return;
    const ring = v.ring;
    for (const g of v.graphs) {
      g.graph.draw(ring, g.col, g.late);
      g.now.textContent = rtUs(ring.last(g.col));
      g.max.textContent = `max ${rtUs(ring.max(g.col))}`;
    }
    const r = v.health?.render;
    if (!r) return;
    let late = 0;
    for (let i = 0; i < ring.length; i++) if (ring.at('late', i) > 0) late++;
    const gap = v.lastGap && Date.now() - v.lastGap.at < 10000 ? `<span class="rt-gap">gap ${v.lastGap.n} frames</span>` : '';
    head.innerHTML = [
      `<span>Rate <b>${r.rate_hz} Hz</b></span>`,
      `<span>Frame <b>${rtUs(ring.last('frame_us'))}</b> <small>max ${rtUs(r.frame_max_us)}</small></span>`,
      `<span>Headroom <b>${rtUs(ring.last('headroom_us'))}</b> <small>min ${rtUs(r.headroom_min_us)}</small></span>`,
      `<span>Jitter <b>${rtUs(r.jitter_us)}</b></span>`,
      `<span>Late <b class="${r.late ? 'rt-bad' : ''}">${r.late}</b> · skipped ${r.skipped} · ${late} in 10 s</span>`,
      gap,
      r.down ? `<span class="rt-bad"><b>DOWN</b> holding the last frame</span>`
        : r.overload ? `<span class="rt-bad"><b>OVERLOAD</b></span>` : `<span class="rt-ok">OK</span>`,
      `<span>Panics ${r.panics} · restarts ${r.restarts}</span>`,
      `<span>Plan #${r.plan_generation} · ${r.channels} channels · ${r.universes} universes · compile ${rtUs(r.compile_channel_us)} + ${rtUs(r.compile_value_us)}</span>`,
    ].join('');
  };

  // The tables (4 Hz state).
  v.paintTables = () => {
    const d = v.health;
    if (!d) return;
    // tidy: table-ok (the Realtime window's health tables; onto <luma-grid> with the windows later)
    lines.innerHTML = d.lines.length ? `<table class="rt-table"><tr><th>Line</th><th>Protocol</th>
        <th>Rate</th><th>Used</th><th>Actual</th><th>Send</th><th>Max</th><th>Packets</th><th>Errors</th></tr>
        ${d.lines.map(l => `<tr><td>${l.line}</td><td>${rtEsc(l.protocol)}</td><td class="n">${l.rate_hz} Hz</td>
        <td class="n">${l.effective_hz} Hz</td><td class="n">${l.actual_hz} Hz</td><td class="n">${rtUs(l.send_us)}</td>
        <td class="n">${rtUs(l.send_max_us)}</td><td class="n">${l.packets}</td><td class="n">${l.errors}</td></tr>`).join('')}</table>`
      : '<div class="rt-empty">No output line is sending.</div>';

    const c = d.clock;
    const clockRows = (c.members || []).map(m => `<tr><td>${rtEsc(m.station)}</td><td class="n">${rtSigned(m.offset_us)}</td>
        <td class="n">${rtUs(m.rtt_us)}</td><td class="n">${rtUs(m.jitter_us)}</td><td class="n">${rtPpm(m.drift_ppm)}</td><td class="n">${m.last_sync_ms ? smTime(m.last_sync_ms) : '—'}</td></tr>`);
    const ptp = c.ptp ? `<tr><td>PTP ${rtEsc(c.ptp.port_state)}</td><td class="n">${rtSigned(Math.trunc(c.ptp.offset_ns / 1000))}</td>
        <td class="n">${rtUs(Math.trunc(c.ptp.path_delay_ns / 1000))}</td><td colspan="3">GM ${rtEsc(c.ptp.grandmaster)}</td></tr>` : '';
    // tidy: table-ok (the Realtime window's health tables; onto <luma-grid> with the windows later)
    clock.innerHTML = `<table class="rt-table"><tr><th>${rtEsc(c.role)}</th><th>Offset</th><th>Round trip</th><th>Jitter</th><th>Drift</th><th>Last sync</th></tr>
        <tr><td>this station</td><td class="n">${rtSigned(c.offset_us)}</td><td class="n">${rtUs(c.rtt_us)}</td>
        <td class="n">${rtUs(c.jitter_us)}</td><td class="n">${rtPpm(c.drift_ppm)}</td><td class="n">${c.last_sync_ms ? smTime(c.last_sync_ms) : '—'}</td></tr>
        ${clockRows.join('')}${ptp}</table>${c.ptp ? '' : `<div class="rt-empty">PTP: ${rtEsc(c.ptp_note || 'not available')}</div>`}`;

    // tidy: table-ok (the Realtime window's health tables; onto <luma-grid> with the windows later)
    threads.innerHTML = `<table class="rt-table"><tr><th>Thread</th><th>Alive</th><th>Loop</th><th>Max</th><th>Queue</th><th>Panics</th></tr>
        ${d.threads.map(t => `<tr><td>${rtEsc(t.name)}</td><td>${t.alive ? '<span class="rt-ok">yes</span>' : '<span class="rt-bad">no</span>'}</td>
        <td class="n">${rtUs(t.last_loop_us)}</td><td class="n">${rtUs(t.max_loop_us)}</td><td class="n">${t.queue_depth}</td><td class="n">${t.panics}</td></tr>`).join('')}</table>`;
  };

  // Subscribed while the window exists: every frame at 16 ms, the tables at 4 Hz.
  v.connect = () => {
    if (v.subs.length) return;
    v.subs = [
      feeds().sub('health.render', { period_ms: 16 }, { batch: v.onFrames, reset: () => { v.ring.clear(); v.loop.dirty(); } }),
      feeds().sub('health', { period_ms: 250 }, { batch: m => {
        v.health = m.data; v.paintTables(); v.loop.dirty();
        document.querySelectorAll(`.ptab[data-win="${no}"] .tab-title`).forEach(el => paintTitle(no, el));
      } }),
    ];
  };
  v.close = () => { for (const s of v.subs) s.close(); v.subs = []; v.loop.stop(); };

  LumaKit.pointer.hold(host, {
