    onHold: at => renderCtx(at, [{ ico: 'settings', lbl: `${winLabel(no)} settings…`, hint: 'EditSetting Self', fn: () => openSettings(at, no) }]),
  });

  rtViews.set(no, v);
  return v;
}

/** The Realtime tab's title: the render rate (the page's own reading of `health`). */
function rtTitle(no) {
  const r = rtViews.get(no)?.health?.render;
  if (!r) return null;
  return { text: r.down ? 'down' : `${r.rate_hz} fps`, tone: r.down || r.overload ? 'alert' : 'ok' };
}

function buildRealtimePanel(win) {
  for (const no of rtViews.keys()) if (!layout.windows[no]) { rtViews.get(no).close(); rtViews.delete(no); }
  const v = realtimeFor(win.no);
  v.apply({ graph: 10, pause: false, ...winSettings(win) });
  v.connect();
  v.paintTables();
  v.loop.dirty();
  return v.host;
}

// ── DMX window ─────────────────────────────────────────────────────────────
// The DMX sheet at 60 Hz while visible (decisions §30 "12b2"): the
// window subscribes the `dmx` feed for the universe it shows (or follows the
// selection) and gets the patch (who sits on which channel) as JSON and the
// live values with each channel's winner — ours, park or a DMX input line —
// as binary frames, only when the universe changed. View "input" shows what
// the input lines bring in instead. The 512 cells are built once; a frame
// touches only the cells whose value or winner changed, on the window's
// requestAnimationFrame.
const dmxViews = new Map();
const DX_WIN = ['unpatched', 'default', 'ours', 'park', 'input'];

function dxFormat(v, readout) {
  if (v == null) return '';
  if (readout === 'hex') return v.toString(16).toUpperCase().padStart(2, '0');
  if (readout === 'decimal') return String(v);
  return `${Math.round(v / 255 * 100)}%`;
}

/** The universes in a binary `dmx` frame (feeds.rs `dmx_frame`). */
function dxFrame(view) {
  const count = view.getUint16(16, true);
  const out = [];
  for (let k = 0, off = 20; k < count; k++, off += 8 + 2048 + 1024) {
    const at = off + 8;
    const buf = view.buffer;
    out.push({
      universe: view.getUint32(off, true),
      values: new Uint8Array(buf, at, 512),
      ours: new Uint8Array(buf, at + 512, 512),
      winners: new Uint8Array(buf, at + 1024, 512),
      input: view.getUint8(off + 4) & 1 ? new Uint8Array(buf, at + 1536, 512) : null,
      lines: new Uint16Array(buf, at + 2048, 512),
    });
  }
  return out;
}

function dmxFor(no) {
  if (dmxViews.has(no)) return dmxViews.get(no);
  const host = document.createElement('div');
  host.className = 'dmx';
  // The bar (Universe ‹ ›, Values, Show input …) is the window's
  // <luma-window-bar> (decisions §30 "12c"); here the channels and the
  // status line (the hovered channel; the colour legend on the right).
  host.innerHTML = `<div class="dx-grid"></div><div class="dx-status"><span class="dx-hover"></span>
      <span class="dx-legend"><span><i style="background:var(--lc-strong)"></i>ours</span><span><i style="background:var(--lc-info)"></i>input</span><span><i style="background:var(--lc-park)"></i>park</span></span></div>`;
  const grid = host.querySelector('.dx-grid');
  const status = host.querySelector('.dx-hover');
  const v = {
    host, cfg: null, sub: null, cells: [], rows: [], follow: null,
    patch: null, data: null, universes: [], exists: true, hover: null, shape: '', force: true,
  };
  v.loop = LumaKit.feeds.drawLoop(() => v.paint());

  // Only Selection: the station follows the selection's universe; the window
  // shows it without storing it (the setting stays as it is).
  const universe = () => (v.cfg.only_selection && v.follow != null ? v.follow : v.cfg.universe);
  const subscribe = () => {
    const opts = { universes: [universe()], follow_selection: !!v.cfg.only_selection, period_ms: 16 };
    if (v.sub) { v.sub.set(opts); return; }
    v.sub = feeds().sub('dmx', opts, {
      batch: m => {
        if (m.follow != null) {
          if (m.follow !== v.follow) { v.follow = m.follow; v.patch = null; v.data = null; subscribe(); v.layoutCells(); v.force = true; v.loop.dirty(); }
          return;
        }
        if (m.data) {
          const p = (m.data.patches || []).find(x => x.universe === universe());
          v.patch = p || null; v.exists = p ? p.exists : true; v.universes = m.data.universes || [];
          v.layoutCells(); v.force = true; v.loop.dirty();
        }
      },
      binary: frame => {
        const u = dxFrame(frame).find(x => x.universe === universe());
        if (u) { v.data = u; v.loop.dirty(); }
      },
    });
  };
  v.close = () => { v.sub?.close(); v.sub = null; v.loop.stop(); };

  // Which fixture sits on each channel: [{fixture, name, attribute, first, last, alt}].
  const channelInfo = () => {
    const info = new Array(512).fill(null);
    (v.patch?.spans || []).forEach((sp, k) => {
      sp.attributes.forEach((attr, i) => {
        const a = sp.start - 1 + i;
        if (a < 0 || a >= 512) return;
        info[a] = { fixture: sp.fixture, name: sp.name, attribute: attr, first: i === 0,
                    last: i === sp.attributes.length - 1, alt: k % 2 === 1 };
      });
    });
    return info;
  };

  const addrLabel = a => v.cfg.address_mode === 'absolute'
    ? String((universe() - 1) * 512 + a + 1)
    : `${universe()}.${String(a + 1).padStart(3, '0')}`;

  // Build the grid: a label column, then `columns` cells per row.
  v.layoutCells = () => {
    let cols = v.cfg.columns || Math.max(4, Math.floor((grid.clientWidth - 50) / 52)) || 20;
    // Touch screens: a channel stays tappable (44 px wide), fewer columns (12c2).
    if (matchMedia('(any-pointer: coarse)').matches && grid.clientWidth) cols = Math.min(cols, Math.max(4, Math.floor((grid.clientWidth - 50) / 44)));
    const shape = JSON.stringify([cols, v.cfg.address_mode, universe(), v.exists]);
    if (shape !== v.shape) {
      v.shape = shape;
      grid.innerHTML = '';
      v.cells = []; v.rows = [];
      v.force = true;
      // Every column fits the window (no cut-off last column, 11d): cells shrink, text ellipsis.
      grid.style.gridTemplateColumns = `44px repeat(${cols}, minmax(0, 1fr))`;
      if (!v.exists) {
        const e = document.createElement('div');
        e.className = 'dx-empty';
        e.textContent = `Universe ${universe()} doesn't exist in this show.`;
        grid.appendChild(e);
        return;
      }
      const frag = document.createDocumentFragment();
      for (let a = 0; a < 512; a++) {
        if (a % cols === 0) {
          const r = document.createElement('div');
          r.className = 'dx-row';
          r.textContent = addrLabel(a);
          frag.appendChild(r);
        }
        const c = document.createElement('div');
        c.className = 'dx-cell';
        c.innerHTML = '<span class="dx-lvl"></span><span class="dx-v"></span><span class="dx-a"></span><span class="dx-id"></span>';
        [c._lvl, c._v, c._a, c._id] = c.children;
        c.dataset.a = a;
        c.addEventListener('pointerenter', () => { v.hover = a; v.describe(); });
        // A tap shows the channel in the status line too (12c2: hover has a tap equal).
        c.addEventListener('click', () => { v.hover = a; v.describe(); });
        c.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { v.hover = a; v.describe(); } });
        frag.appendChild(c);
        v.cells.push(c);
      }
      grid.appendChild(frag);
    }
    const info = channelInfo();
    v.info = info;
    v.cells.forEach((c, a) => {
      const f = info[a];
      c.classList.toggle('fx', !!f);
      c.classList.toggle('alt', !!f && f.alt);
      c.classList.toggle('first', !!f && f.first);
      c.classList.toggle('last', !!f && f.last);
      c._a.textContent = v.cfg.show_attribute && f ? f.attribute : '';
      c._id.textContent = v.cfg.show_id && f && f.first ? `${f.fixture}` : '';
    });
  };

  // Values, winners and level bars: only the cells that changed (all after
  // a settings or patch change).
  v.paint = () => {
    if (!v.cells.length || !v.cfg) return;
    const d = v.data;
    const input = v.cfg.view === 'input';
    const force = v.force;
    v.force = false;
    const bar = v.cfg.level_bar === 'bar';
    for (let a = 0; a < v.cells.length; a++) {
      const c = v.cells[a];
      const val = !d ? null : input ? (d.input ? d.input[a] : null) : d.values[a];
      const win = d && !input ? DX_WIN[d.winners[a]] : (input && d?.input ? 'input' : 'unpatched');
      if (!force && c._val === val && c._win === win) continue;
      if (c._win !== win) {
        if (c._win) c.classList.remove(`w-${c._win}`);
        c.classList.add(`w-${win}`);
      }
      c._val = val; c._win = win;
      c._v.textContent = v.cfg.show_value ? dxFormat(val, v.cfg.readout) : '';
      const lvl = c._lvl;
      const f = (val || 0) / 255;
      const tint = `var(--lc-${win === 'input' ? 'info' : win === 'park' ? 'park' : 'ok'})`;
      lvl.style.top = bar ? 'auto' : '';
      lvl.style.height = bar ? '3px' : '';
      if (v.cfg.level_bar === 'background') {
        lvl.style.background = f ? `color-mix(in srgb, ${tint} ${Math.round(10 + f * 50)}%, transparent)` : '';
      } else if (bar) {
        lvl.style.background = f ? `linear-gradient(to right, ${tint} ${f * 100}%, transparent ${f * 100}%)` : '';
      } else {
        lvl.style.background = '';
      }
    }
    if (v.hover != null) v.describe();
  };

  // The status line: the hovered channel, its fixture, winner, ours and input.
  v.describe = () => {
    const a = v.hover;
    if (a == null || !v.cfg) { status.textContent = ''; return; }
    const f = v.info?.[a];
    const d = v.data;
    const fmt = x => dxFormat(x, v.cfg.readout);
    const parts = [addrLabel(a)];
    if (f) parts.push(`Fixture ${f.fixture}${f.name ? ` "${f.name}"` : ''} · ${f.attribute || '—'}`);
    else parts.push('unpatched');
    if (d) {
      const w = DX_WIN[d.winners[a]];
      parts.push(w === 'input' ? `won by Input ${d.lines[a]}` : w === 'park' ? 'parked' : w === 'ours' ? 'ours' : w);
      parts.push(`out ${fmt(d.values[a])}`, `ours ${fmt(d.ours[a])}`);
      parts.push(d.input ? `in ${fmt(d.input[a])}` : 'no input');
    }
    status.textContent = parts.join('  ·  ');
  };

  v.apply = cfg => {
    const prev = v.cfg;
    v.cfg = cfg;
    if (!prev || prev.universe !== cfg.universe || prev.only_selection !== cfg.only_selection) {
      if (!cfg.only_selection) v.follow = null;
      v.patch = null; v.data = null;
      subscribe();
    }
    v.layoutCells();
    v.force = true;
    v.paint();
    if (!prev || prev.address !== cfg.address) {
      requestAnimationFrame(() => {
        const c = v.cells[(cfg.address || 1) - 1];
        if (!c) return;
        v.cells.forEach(x => x.classList.remove('goto'));
        if (cfg.address > 1) { c.classList.add('goto'); c.scrollIntoView({ block: 'nearest' }); }
      });
    }
  };

  grid.addEventListener('mouseleave', () => { v.hover = null; status.textContent = ''; });
  new ResizeObserver(() => { if (v.cfg && !v.cfg.columns) { v.layoutCells(); v.force = true; v.paint(); } }).observe(grid);

  LumaKit.pointer.hold(host, {
    onHold: at => renderCtx(at, [{ ico: 'settings', lbl: `${winLabel(no)} settings…`, hint: 'EditSetting Self', fn: () => openSettings(at, no) }]),
  });

  dmxViews.set(no, v);
  return v;
}

function buildDmxPanel(win) {
  for (const no of dmxViews.keys()) if (!layout.windows[no]) { dmxViews.get(no).close(); dmxViews.delete(no); }
  const v = dmxFor(win.no);
  v.apply({
    universe: 1, address: 1, view: 'output', readout: 'percent', address_mode: 'universe',
    level_bar: 'background', columns: 20, show_value: true, show_attribute: true, show_id: false,
    only_selection: false, ...winSettings(win),
  });
  return v.host;
}

// ── Window settings (decisions §30 "12b2") ────────────────────────────────
// The window menu's Settings runs `EditSetting Window n`: the station answers
// with typed fields (UiEvent edit_settings) and the kit's settings window
// draws them; every change is a `Set Window` line.
function openSettings(_at, no) {
  if (!layout.windows[no]) return;

}

// ── A question the page asks itself (a Delete): the kit's standard dialog ──
// ── Shutdown Menu / Menu overlays ────────────────────────────────
// Every button runs a command (Shutdown, Restart, SaveShow, LoadShow, …), so
// it echoes in the command line. Commands that need an answer come back as
// one of the station's dialogs (renderStationDialogs).
function openMenuOverlay(id) {
  ctx.hidden = true;
  // Keys belong to the overlay now, not to a focused terminal.
  for (const t of terms.values()) if (t.opened) t.term.blur();
  document.getElementById(id).classList.add('open');
}
// What an overlay does when it closes (its feed subscription goes).
const MA_CLOSE = {};
function closeMenuOverlay(id) {
  const el = document.getElementById(id);
  const was = el.classList.contains('open');
  el.classList.remove('open');
  syncKeyboardFocus();
  if (was) MA_CLOSE[id]?.();
}
document.querySelectorAll('.mo-overlay').forEach(o => o.addEventListener('pointerdown', e => {
  if (e.target === o) closeMenuOverlay(o.id);
}));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  ctx.hidden = true;
  if (LumaKit.dialog.dialogOpen()) return;
  const open = [...document.querySelectorAll('.mo-overlay.open')].pop();
  if (open) { e.preventDefault(); closeMenuOverlay(open.id); }
});

// ── Setup menus (decisions §30 "12d": a MenuDef registry → <luma-setup>) ──
// The station declares every menu (GET /api/menu-types: tabs, grid columns
// from the declared props, slab line templates, bound cells, the power
// toggle). `Menu "<name>" [/Tab x]` sends OpenMenu: the same line again
// closes it (never a stacked copy); with /Tab it switches (the profile keeps
// the last tab).
// Rows come from the tab's feed (`feed` + `rows`), settings cells from
// `EditSetting <target>`, the power state from its feed; every gesture is a
// command line.
let menuTypes = null;
async function loadMenuTypes() {
  if (!menuTypes?.length) try { menuTypes = await (await fetch('/api/menu-types')).json(); } catch (_) { menuTypes = []; }
  return menuTypes;
}
const setupMenu = { ctl: null, def: null, subs: [], pendingTab: null, data: {}, asked: {}, retry: {}, showsSub: null, historyOf: '', drive: '', librarySelected: false };
const sameName = (a, b) => String(a ?? '').toLowerCase() === String(b ?? '').toLowerCase();
function myLevel() { return stationUser(currentUser)?.rights || ''; }

// UI events run in order even across the await below: a `close_menu` (or a
// newer open) that lands while the menu types load makes this open stale — the
// ⚙ key's double press sends Toggle Menu then Quick Save's close in one batch.
let menuEpoch = 0;
async function openMenuEvent(ev) {
  const epoch = ++menuEpoch;
  const defs = await loadMenuTypes();
  if (epoch !== menuEpoch) return;
  const def = defs.find(d => sameName(d.name, ev.menu));
  if (!def || def.name === 'Menu') return openMenu();
  if (def.name === 'Shutdown') return openPowerMenu();
  if (def.name === 'Oops') return toggleOops(ev.toggle);
  // `/Open "<row> [<group> [<part>]]"`: drill into a row (§30 "Users &
  // Profiles follows storage", `Edit EncoderBar`).
  const [row, group, part] = String(ev.open || '').split(/\s+/).filter(Boolean);
  if (row) {
    const ctl = setupMenu.ctl && sameName(setupMenu.def?.name, def.name) ? setupMenu.ctl : await openSetupMenu(def.name, ev.tab, {});
    ctl?.openRow(ev.tab || ctl.tab(), row, group, part);
    return;
  }
  if (setupMenu.ctl && sameName(setupMenu.def?.name, def.name)) {
    if (ev.toggle) return closeSetupMenu();
    if (ev.tab) {
      // Our own tab switch coming back: nothing to do.
      if (setupMenu.pendingTab && sameName(setupMenu.pendingTab, ev.tab)) { setupMenu.pendingTab = null; return; }
      if (sameName(setupMenu.ctl.tab(), ev.tab)) return closeSetupMenu();
      return setupMenu.ctl.setTab(ev.tab);
    }
  }
  let grids = {};
  try { grids = ev.grids ? JSON.parse(ev.grids) : {}; } catch (_) {}
  openSetupMenu(def.name, ev.tab, grids);
}

function closeSetupMenu() { setupMenu.ctl?.close(); }

// The Oops window (decisions §30 "12f"): `Menu "Oops"` (the held Oops key) opens it, the same line
// closes it; its rows come from the `oops` feed while it is open.
const oopsWin = { ctl: null, sub: null };
function toggleOops(toggle = true) {
  if (oopsWin.ctl?.open) { if (toggle) oopsWin.ctl.close(); return; }
  oopsWin.ctl = LumaKit.oops.openOops({
    run: line => wsCommand(line),
    onClose: () => { oopsWin.sub?.close(); oopsWin.sub = null; oopsWin.ctl = null; },
  });
  oopsWin.sub = feeds().sub('oops', {}, { batch: m => { if (m.data) oopsWin.ctl?.update(m.data); } });
}

// The sequence sheet (decisions §30 "12f" sequence windows A and B): a Sequence window draws the
// sequence its setting names ("selected" or a GUID); `Edit Sequence n` opens it as a pop-up. Rows
// come from the `sequence` feed; every edit is a line (a drag on the gesture channel).
const seqViews = new Map(); // window no → { wrap, el, sub, which }
function sequenceSub(el, which, onData) {

/** Draw MenuDef `name` in <luma-setup>, live. */
async function openSetupMenu(name, tab, grids = {}) {
  const defs = await loadMenuTypes();
  const def = defs.find(d => sameName(d.name, name));
  if (!def) return;
  closeSetupMenu();
  closeMenuOverlay('menu-overlay');
  const ctl = LumaKit.setup.openSetup(def, {
    tab, level: myLevel(), viewer: currentUser, grids,
    run: line => {
      wsCommand(line);
      // A drilled row's settings follow the station's answer too.
      if (setupMenu.detail && !/^Menu /.test(line)) setTimeout(() => askDetailFields(), 80);
      // Settings cells follow the station's answer (fresh fields).
      const c = def.tabs.find(t => sameName(t.name, ctl.tab()))?.content;
      if (c?.kind === 'settings' && !/^Menu /.test(line)) setTimeout(() => wsCommand(`EditSetting ${c.settings}`), 80);
      if (/^Set Station /.test(line) && setupBoundObjects(def).includes('station')) setTimeout(() => askSetup('EditSetting Station'), 80);
    },
    onTab: t => { setupMenu.pendingTab = t; wsCommand(`Menu "${def.name}" /Tab ${/\s/.test(t) ? `"${t}"` : t}`); askSettings(def, t); },
    onAction: a => setupAction(def, a),
    onSlab: a => setupSlab(def, a),
    onDetail: info => setupDetail(info),
    onWhere: w => { setupMenu.drive = w.drive || ''; setupMenu.librarySelected = true; subShows(); },
    onClose: () => {
      setupDetail(null);
      for (const s of setupMenu.subs) s.close();
      for (const t of Object.values(setupMenu.retry)) clearTimeout(t);
      setupMenu.showsSub?.close();
      Object.assign(setupMenu, { ctl: null, def: null, subs: [], pendingTab: null, data: {}, asked: {}, retry: {}, showsSub: null, historyOf: '', drive: '', librarySelected: false });
      syncKeyboardFocus();
    },
  });
  Object.assign(setupMenu, { ctl, def, subs: [], pendingTab: null, data: {}, asked: {}, retry: {}, historyOf: '', librarySelected: false });
  // Every feed the menu reads: the grids' rows, the left tabs, the power
  // state. The `station` feed is the page's own (always live).
  const wanted = new Set(def.tabs.map(t => t.content?.grid?.feed).filter(Boolean));
  if (def.power?.feed) wanted.add(def.power.feed);
  if (def.left?.feed) wanted.add(def.left.feed);
  if (def.area?.feed) wanted.add(def.area.feed);
  for (const f of wanted) {
    if (f === 'station') { setupFeed('station', station); continue; }
    if (f === 'shows') { subShows(); continue; }
    setupMenu.subs.push(feeds().sub(f, {}, { batch: m => setupFeed(f, m.data) }));
  }
  askSettings(def, ctl.tab());
  // Bound cells of this station's settings show their values.
  if (setupBoundObjects(def).includes('station')) askSetup('EditSetting Station');
  return ctl;
}

// Ask the station for a menu's settings / bound cells. Right after a login

    if (shellUp) wsCommand(line); else shellWaiters.push(line);
    clearTimeout(setupMenu.retry[key]);

  // A claim area's menu (the Patch dialog): its mode, holder and sidebar rows.

    const g = t.content?.grid;

    ctl.setRows(t.name, rows, extra);

    const raw = p.path.split('.').reduce((o, k) => o?.[k], data);
    const v = p.off_values?.length ? raw != null && !p.off_values.includes(raw) : !!raw;

// The title row's status chips, from what the menu's feeds say.
function setupChips(name, d) {
  const n = d.network, l = d.lumasessions, st = d.station;
  switch (name) {
    case 'Network': {
      if (!n) return [];
      const ifs = n.interfaces || [];
      const down = ifs.filter(i => i.link !== 'up').length;
      return [{ text: n.online ? 'Online' : 'Offline', tone: n.online ? 'ok' : 'alert' },
        { text: `${ifs.length} interfaces${down ? ` · ${down} no link` : ''}`, tone: down ? 'warn' : 'ok' }];
    }
    case 'DMXProtocols': {
      if (!n) return [];
      if (n.master) return [{ text: `member · sent by ${n.master}`, tone: 'warn' }];
      return [{ text: n.output_held ? 'output held' : n.online ? 'sending' : 'offline', tone: n.output_held || !n.online ? 'alert' : 'ok' }];
    }
    case 'LumaSessions': {
      if (!l) return [];
      const s = l.station || {};
      const members = (l.members || []).filter(m => ['Master', 'Member'].includes(m.role) || m.me).length;
      const chips = [{ text: `"${s.lumasession}" · ${s.status}${s.status === 'Standalone' ? '' : ` · ${members} stations`}`, tone: s.status === 'Standalone' ? 'off' : 'ok' }];
      const master = s.status === 'Master' ? s.name : s.master;
      if (master) chips.push({ text: `master: ${master}`, tone: 'warn' });
      return chips;
    }
    case 'Users': {
      if (!st) return [];
      const users = st.users || [];
      return [{ text: `${users.length} users · ${users.filter(u => (u.logged_in || []).length).length} logged in`, tone: 'ok' }];
    }
    case 'Settings': return station?.name ? [{ text: station.name, tone: 'ok' }] : [];
    case 'Backup': {
      const b = d.shows;
      if (!b) return [];
      const cur = b.current || {};
      const chips = [{ text: `${cur.name || 'untitled'} · ${cur.dirty ? 'unsaved changes' : 'saved'}`, tone: cur.dirty ? 'warn' : 'ok' }];
      chips.push(!cur.autosave_minutes ? { text: 'recovery copies off', tone: 'off' }
        : { text: cur.dirty && cur.autosave_in != null ? `recovery copy in ${mmss(cur.autosave_in)}` : `recovery copy every ${cur.autosave_minutes} min`, tone: 'ok' });

/** The Load show dialog (decisions §30 "Load show = one dialog with parts"):
 *  the file's facts, then its parts — each All / Pick / None, Pick… for
 *  single objects. Everything = `LoadShow "x"` (asks about unsaved changes);
 *  less = `Import Show "x" <parts | objects>`, by GUID, one Oops step. */
async function openLoadShow(src) {
  const q = new URLSearchParams({ show: src.show });
  if (src.version) q.set('version', src.version);
  if (src.recovery) q.set('recovery', src.recovery);
  if (src.drive && src.drive !== 'local-library') q.set('drive', src.drive);
  let info = null;
  try { info = await (await fetch(`/api/show-parts?${q}`)).json(); } catch (_) {}
  if (!info || info.error) { LumaKit.toast(info?.error || 'The show file can’t be read'); return; }
  const take = Object.fromEntries(info.parts.map(p => [p.key, 'All']));
  const picks = Object.fromEntries(info.parts.map(p => [p.key, new Set()]));
  const fx = info.facts || {};
  const from = src.version ? `version ${src.version}` : src.recovery ? `recovery copy` : 'show file';
  for (;;) {
    const all = info.parts.every(p => take[p.key] === 'All');
    const any = info.parts.some(p => take[p.key] === 'All' || (take[p.key] === 'Pick' && picks[p.key].size));
    const got = await LumaKit.dialog.openDialog({
      title: `Load show · ${src.show}`,
      meta: from,
      text: 'Tick what to take from the file. None = keep what is loaded now. Pick… takes single objects.',
      rows: [
        { k: 'Saved', v: `${fx.saved || '—'}${fx.by ? ` by ${fx.by}` : ''}${fx.station ? ` on ${fx.station}` : ''}` },
        { k: 'Reason', v: [fx.reason, fx.note].filter(Boolean).join(' · ') || '—' },
        { k: 'File', v: `${fx.size || '—'} · format ${fx.format}`, tone: info.loads ? 'ok' : 'alert' },
        ...(fx.description ? [{ k: 'Description', v: fx.description }] : []),
      ],
      selectors: info.parts.map(p => ({
        name: p.key, label: `${p.label} — ${p.sum}${picks[p.key].size ? ` · ${picks[p.key].size} picked` : ''}`,
        choices: p.objects.length ? ['All', 'Pick', 'None'] : ['All', 'None'], value: take[p.key],
      })),
      buttons: [
        { label: 'Load', value: 'go', kind: 'please', disabled: !info.loads || !any },
        { label: 'Pick…', value: 'pick', disabled: !info.loads },
        { label: 'Cancel', value: null },
      ],
      primary: 0, cancel: 2,
      note: info.refused || 'Everything ticked loads the show (LoadShow); less takes those parts into the loaded show by GUID (Import Show, one Oops step).',
    });
    if (!got?.value) return;
    Object.assign(take, got.selectors || {});
    if (got.value === 'go') {
      const line = loadShowLine(src, info, take, picks);
      if (line) setupMenu.ctl ? setupMenu.ctl.run(line) : wsCommand(line);
      return;
    }
    await pickParts(info, take, picks);
  }
}

async function pickParts(info, take, picks) {
  const parts = info.parts.filter(p => p.objects.length);
  if (!parts.length) return;
  let part = parts[0];
  if (parts.length > 1) {
    const got = await LumaKit.dialog.openDialog({
      title: 'Pick from', text: 'Which part’s objects?',
      selectors: [{ name: 'part', label: 'Part', choices: parts.map(p => p.label), value: parts.find(p => take[p.key] === 'Pick')?.label || parts[0].label }],
      buttons: [{ label: 'Next', value: 'go', kind: 'please' }, { label: 'Cancel', value: null }], primary: 0, cancel: 1,
    });
    if (!got?.value) return;
    part = parts.find(p => p.label === got.selectors.part) || parts[0];
  }
  const got = await LumaKit.dialog.openDialog({
    title: `Pick · ${part.label}`, text: `Objects of the file (${part.objects.length}); the ticked ones are taken by GUID.`,
    toggles: part.objects.map((o, i) => ({ name: `o${i}`, label: o.label, on: picks[part.key].has(o.ref) })),
    buttons: [{ label: 'OK', value: 'go', kind: 'please' }, { label: 'Cancel', value: null }], primary: 0, cancel: 1,
  });
  if (!got?.value) return;
  picks[part.key] = new Set(part.objects.filter((o, i) => got.toggles?.[`o${i}`]).map(o => o.ref));
  take[part.key] = picks[part.key].size ? 'Pick' : 'None';
}
function loadShowLine(src, info, take, picks) {
  const q = v => `"${String(v).replace(/[";]/g, '')}"`;
  const drive = src.drive && src.drive !== 'local-library' ? ` /Drive ${q(src.drive)}` : '';
  const from = (src.version ? ` /Version ${q(src.version)}` : src.recovery ? ` /Recovery ${q(src.recovery)}` : '') + drive;
  if (info.parts.every(p => take[p.key] === 'All')) return src.recovery ? `LoadShow /Recovery ${q(src.recovery)}${drive}` : `LoadShow ${q(src.show)}${from}`;
  const words = [];
  for (const p of info.parts) {
    if (take[p.key] === 'All') words.push(p.key);
    else if (take[p.key] === 'Pick') words.push(...picks[p.key]);
  }
  return words.length ? `Import Show ${q(src.show)}${from} ${words.join(' ')}` : '';
}

/** `EditSetting <target>` answered: a setup menu's settings tab or bound cells. */
function setupFields(ev) {
  const { ctl, def } = setupMenu;
  if (!ctl) return false;
  // The drilled row asked for its fields: they are its parts' cells.
  if (setupMenu.detail?.pending) {
    setupMenu.detail.pending = false;
    ctl.setDetail({ fields: ev.fields || [] });
    return true;
  }
  const title = String(ev.title || '');
  let used = false;
  for (const t of def.tabs) {
    if (t.content?.kind === 'settings' && sameName(t.content.settings, title)) {
      ctl.setFields(t.content.settings, ev.fields || []);
      setupMenu.asked[`editsetting ${t.content.settings.toLowerCase()}`] = true;
      used = true;
    }
    const bound = (t.bound || []).filter(b => sameName(b.object, title));
    if (bound.length) {
      const values = {};
      for (const b of bound) {
        const f = (ev.fields || []).find(x => sameName(x.name.replace(/\s+/g, ''), b.prop));
        if (f) values[`${b.object}.${b.prop}`] = { value: f.value, line: f.line, input: f.input, pick: f.pick };
      }
      ctl.setBound(values);
      setupMenu.asked[`editsetting ${title.toLowerCase()}`] = true;
      used = true;
    }
  }
  return used;
}

// ── The station's dialogs (decisions §30 "12b") ─────────────────────────────
// Every question the station asks — a line's confirm, a claim ask, the merge
// decision, Label / Move / Copy, a password — arrives in our Status
// (`dialogs`) and is drawn by the kit's standard dialog. The station owns it:
// it keeps the countdown, closes it on every client when one answers, then
// runs the button's line as the answering user. Nothing opens over the lock
// (DeskLock): the surface counts them as "n waiting".
let stationDlg = null;   // { id, key, ctl }
let powerSent = false;
const RECENT_KEY = kind => `lumacore.recent.${kind}`;
function recentNames(kind) {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY(kind)) || '[]'); } catch { return []; }
}
function rememberName(kind, name) {
  if (!name) return;
  try {
    const list = [name, ...recentNames(kind).filter(n => n !== name)].slice(0, 6);
    localStorage.setItem(RECENT_KEY(kind), JSON.stringify(list));
  } catch { /* private window: no chips */ }
}
function dialogSpec(d) {
  const buttons = d.buttons.map((b, i) => ({ label: b.label, value: i, kind: b.kind || 'plain', disabled: b.disabled || false }));
  // A Label dialog offers your last names for that kind as chips.
  const label = /^Label (\w+) /.exec(d.title);
  const inputs = (d.inputs || []).map(i => (label && i.name === 'name' ? { ...i, chips: recentNames(label[1]) } : i));
  // Powering another machine down: say so (a desk usually only powers itself).
  let note = d.note;
  const power = d.topic?.startsWith('power:') ? d.topic.slice(6) : null;
  if (power && !note && serverIsRemote()) {
    const where = APP ? `${APP.station || APP.host} (${APP.host})` : location.host;
    note = `This is not this computer: it ${power === 'Restart' ? 'restarts' : 'shuts down'} the server ${where} for everyone connected to it.`;
  }
  return { ...d, buttons, inputs, note };
}
function answerStationDialog(d, i, answers) {
  const label = /^Label (\w+) /.exec(d.title);
  if (label && i === d.primary) rememberName(label[1], answers.inputs?.name?.trim());
  const power = d.topic?.startsWith('power:') ? d.topic.slice(6) : null;
  if (power && i === d.cancel) { if (APP) toApp({ type: 'power_cancel' }); }
  else if (power) {
    if (power === 'Shutdown') shutdownSent = true;
    if (APP && !powerSent) { powerSent = true; toApp({ type: 'power', command: power }); }
  }
  wsSend({ type: 'dialog_answer', id: d.id, button: i, ...answers });
  stationDlg?.ctl.close();
  if (stationDlg) stationDlg.key = 'answered';
  syncKeyboardFocus();
}
const closedSeen = new Set();
function renderStationDialogs(st) {
  // Answered elsewhere (or by the countdown): say who, once.
  for (const c of st.dialogs_closed || []) {
    const tag = `${c.id}/${c.by}`;
    if (closedSeen.has(tag)) continue;
    closedSeen.add(tag);
    if (c.by !== st.user && (stationDlg?.id === c.id || c.by === 'time'))
      notice(c.by === 'time' ? `${c.title}: ${c.answer} (no answer in time)` : `${c.title}: answered by ${c.by} · ${c.answer}`, 4000);
  }
  // Locked: nothing over the lock — the surface counts what waits.
  if (deviceStatus.locked) surface?.update({ waiting: lockQueue.length + (st.dialogs?.length || 0) });
  const d = deviceStatus.locked ? null : (st.dialogs || [])[0];
  if (!d) {
    if (stationDlg) {
      stationDlg.ctl.close();
      stationDlg = null;
      syncKeyboardFocus();
    }
    return;
  }
  const key = JSON.stringify(d);
  if (stationDlg?.id === d.id) {
    if (stationDlg.key !== key && stationDlg.key !== 'answered') { stationDlg.key = key; stationDlg.ctl.update(dialogSpec(d)); }
    return;
  }
  stationDlg?.ctl.close();
  for (const t of terms.values()) if (t.opened) t.term.blur();
  const ctl = LumaKit.dialog.showDialog(dialogSpec(d), {
    onAnswer: (i, answers) => answerStationDialog(d, i, answers),
    onPause: () => wsSend({ type: 'dialog_pause', id: d.id }),
  });
  stationDlg = { id: d.id, key, ctl };
}

// ── ViewBar ────────────────────────────────────────────────────────────────
// The view bar (decisions 0287): this screen's buttons of the user's profile, from the `viewbar`
// feed. A button holds any object (a view, a group, a sequence, a macro); a tap is an object tap
// on the server's command line — it completes a pending command (Store + tap, Assign … + tap) or
// runs what the button holds (the station writes `ViewButton n` out as the object's line). Hold
// is the button's menu (Store, Assign…, Rename, Clear). As many buttons as fit; ▲ ▼ step a set.
// A pool cell dragged onto a button assigns it.
const SLOT_H = 50;
const BAR_KIND = { View: 'views', Group: 'groups', Sequence: 'sequences', Macro: 'macros' };
const BAR_ICON = { View: 'layout-dashboard', Group: 'layout-grid', Sequence: 'list-ordered', Macro: 'wand-sparkles' };
let viewPage = 0, activeSlot = null;
let viewBar = { screen: 1, buttons: [] };
const viewBarFeed = { sub: null, screen: null };

function visibleSlots() {
  return Math.max(1, Math.floor(document.getElementById('view-list').clientHeight / SLOT_H));
}
/** Follow this screen's bar (again after a login or another screen). */
function loadSlots() {
  if (viewBarFeed.sub && viewBarFeed.screen === liveScreen) return;
  viewBarFeed.sub?.close();
  viewBarFeed.sub = null;
  viewBarFeed.screen = liveScreen;
  viewBar = { screen: 1, buttons: [] };
  renderViewBar();
  if (!liveScreen) return;
  viewBarFeed.sub = feeds().sub('viewbar', { screen: liveScreen }, {
    batch: m => { if (!m.data?.missing) { viewBar = m.data; renderViewBar(); } },
  });
}
function buttonAt(n) { return viewBar.buttons?.find(b => b.slot === n) || null; }
function lastSlot() { return Math.max(0, ...(viewBar.buttons || []).map(b => b.slot)); }
function buttonName(b) { return b.missing ? `${b.kind} gone` : (b.name ?? `${b.kind} ${b.no}`); }
function renderViewBar() {
  if (!window.LumaKit) return; // drawn at boot, once the kit is in
  const list = document.getElementById('view-list');
  const pageSize = visibleSlots();
  viewPage = Math.min(viewPage, Math.max(0, Math.ceil((lastSlot() + 1) / pageSize) - 1));
  list.innerHTML = '';
  const start = viewPage * pageSize;
  for (let i = start; i < start + pageSize; i++) {
    const n = i + 1;
    const b = buttonAt(n);
    const btn = document.createElement('button');
    btn.className = 'vbtn' + (b ? ' filled' : '') + (b?.missing ? ' gone' : '') + (n === activeSlot ? ' on' : '');
    btn.dataset.slot = n;
    // The object's paint as this viewer sees it (decisions 0294), else its kind's colour.
    const paint = /^#[0-9a-f]{6}$/i.test(String(b?.paint ?? '')) ? b.paint : '';
    if (b) btn.style.setProperty('--vb-kind', paint || `var(--lc-pool-${BAR_KIND[b.kind]}, var(--lc-pool-default))`);
    if (paint) btn.dataset.paint = paint;
    btn.innerHTML = `<div class="vbtn-num">${viewBar.screen}.${n}${b ? LumaKit.icon(BAR_ICON[b.kind] || 'circle') : ''}</div><div class="vbtn-name"></div>`;
    btn.querySelector('.vbtn-name').textContent = b ? buttonName(b) : '';
    btn.title = b ? `ViewButton ${viewBar.screen}.${n}: ${b.kind} ${b.no ?? ''} ${b.name ?? ''}`.trim() : `ViewButton ${viewBar.screen}.${n}: empty`;
    attachTap(btn, n);
    btn.addEventListener('contextmenu', e => { e.preventDefault(); showViewButtonCtx(e, n, buttonAt(n)); });
    list.appendChild(btn);
  }
  const range = `${start + 1}–${start + pageSize}`;
  document.querySelector('#sidebar-right .vb-nav.up').title = `Previous set (${range})`;
  document.querySelector('#sidebar-right .vb-nav.down').title = `Next set (${range})`;
}

function attachTap(btn, slot) {
  btn.addEventListener('click', () => tapViewButton(slot, false));
  // Hold = right-click (decisions §30 "12c2": every right-click has a touch equal): the menu.
  LumaKit.pointer.hold(btn, { contextmenu: false, onHold: at => showViewButtonCtx(at, slot, buttonAt(slot)) });
}
function tapViewButton(slot, hold) {
  if (buttonAt(slot)?.kind === 'View' && !hold) { activeSlot = slot; renderViewBar(); }
  wsSend({ type: 'tap', object: 'viewbutton', no: slot, hold });
}

function showViewButtonCtx(e, slot, b) {
  const addr = `${viewBar.screen}.${slot}`;
  const view = b?.kind === 'View' && !b.missing;
  const items = [{ hdr: `ViewButton ${addr}` }];
  if (!b || view) items.push({ ico: 'arrow-down', lbl: view ? `Store into "${b.name}"…` : 'Store this screen here…',
    off: !liveScreen, fn: () => wsSend({ type: 'tap', object: 'viewbutton', no: slot, hold: true }) });
  items.push({ ico: 'link', lbl: 'Assign…', hint: `Assign … At ViewButton ${addr}`, fn: () => openAssignKinds(e, addr) });
  if (view) items.push({ ico: 'pencil', lbl: 'Rename…', hint: `Label ViewButton ${addr}`, fn: () => wsCommand(`Label ViewButton ${addr}`) });
  if (b) {
    items.push(null, { ico: 'eraser', lbl: 'Clear button', hint: `Delete ViewButton ${addr}`, fn: () => wsCommand(`Delete ViewButton ${addr}`) });
    if (view) items.push({ ico: 'trash-2', lbl: `Delete view ${b.no}`, danger: true, fn: () => wsCommand(`Delete View ${b.no}`) });
  }
  renderCtx(e, items);
}

// Assign… : a kind, then one of its objects (the pool's cells); the pick is one line.
function openAssignKinds(at, addr) {
  renderCtx(at, [{ hdr: `Assign to ViewButton ${addr}` },
    ...Object.keys(BAR_KIND).map(kind => ({ ico: BAR_ICON[kind], lbl: `${kind}…`, fn: () => openAssignObjects(at, addr, kind) }))]);
}
async function openAssignObjects(at, addr, kind) {
  let cells = [];
  try { const r = await fetch(`/api/pools/${BAR_KIND[kind]}`); if (r.ok) cells = (await r.json()).cells || []; } catch (_) {}
  renderCtx(at, [{ hdr: `${kind} → ViewButton ${addr}` },
    ...(cells.length ? cells.map(c => ({ ico: BAR_ICON[kind], lbl: `${c.no} ${c.name ?? ''}`.trim(), fn: () => wsCommand(`Assign ${kind} ${c.no} At ViewButton ${addr}`) }))
      : [{ ico: 'circle-off', lbl: `No ${kind.toLowerCase()}s`, off: true }])]);
}

/** A pool cell dragged over the bar: the button under the pointer (null when none). */
function viewButtonUnder(x, y) { return document.elementFromPoint(x, y)?.closest('#view-list .vbtn') || null; }

function viewPageUp()   { viewPage = Math.max(0, viewPage - 1); renderViewBar(); }
function viewPageDown() { viewPage = Math.min(Math.ceil((lastSlot() + 1) / visibleSlots()), viewPage + 1); renderViewBar(); }
new ResizeObserver(() => renderViewBar()).observe(document.getElementById('view-list'));


// `EditSetting <object>` / `EditSetting Window n` (decisions §29, §30 "12b2"):
// the kit's settings window; it updates in place when the station answers a
// change with fresh fields.
function openObjectSettings(ev) {
  // An open setup menu shows its settings tab / bound cells itself (12d).
  if (setupFields(ev)) return;
  // A profile's Theme (`Theme`, `EditSetting [UserProfile n] Theme`): the theme editor (archive
  // §30 "12g", the ThemeBg board). Its own fields answer it while it is open.
  const base = (ev.fields || []).find(f => f.name === 'Base' && /Theme "Base"/.test(f.line || ''));
  if (base) { openThemeEditor(ev, base); return; }
  // A kit dialog waiting for an object's fields (the Import MVR dialog's Options step takes the
  // profile's "MVR import" section): it says so by preventing the event.
  if (!document.dispatchEvent(new CustomEvent('lc-fields', { detail: ev, cancelable: true }))) return;
  // A window's settings (12c): `target` names it (`Window 1.4`); its header
  // buttons and pins run `Self` lines with the window as owner, and the
  // window's feed refreshes the cells after every change.
  const target = /^Window (\d+)\.(\d+)$/.exec(ev.target || '');
  if (target) {
    const no = Number(target[2]);
    const owner = Number(target[1]) === liveScreen ? no : null;
    const send = line => (owner != null ? wsCommand(line, owner) : wsCommand(line.replace(/\bSelf\b/, ev.target)));
    winSettingsOpen = { no: owner ?? -1, target: ev.target, title: ev.title };
    const ctl = LumaKit.settings.openSettings({
      title: ev.title, heading: `Settings · ${ev.title}`, subtitle: ev.subtitle || '', icon: 'settings', fields: ev.fields || [],
      actions: [
        { label: 'Load preset', line: 'Call WindowPreset' },
        { label: 'Save preset', line: 'Store WindowPreset' },
        { label: 'Reset window', line: 'Reset Self', variant: 'warn' },
        // tidy: slab-ok (a window's own settings header, not a list of objects)
        { label: 'Delete window', line: 'Delete Self', variant: 'danger' },
      ],
    }, { run: line => {
      send(line);
      if (/^Delete Self$/.test(line)) LumaKit.settings.settingsTitle() === ev.title && ctl.close();
      // Another screen's window has no feed here: ask again after the change.
      else if (owner == null) setTimeout(() => wsCommand(`EditSetting ${ev.target}`), 120);
    } });
    return;
  }
  const win = (ev.fields || [])[0]?.line?.match(/^Set Window (\S+) /)?.[1];
  LumaKit.settings.openSettings({
    title: ev.title, icon: win ? 'app-window' : 'settings', fields: ev.fields || [],
    delete_line: win ? `Delete Window ${win}` : null,
  }, { run: line => { wsCommand(line); if (!/^Delete /.test(line)) setTimeout(() => wsCommand(win ? `EditSetting Window ${win}` : `EditSetting ${ev.title}`), 60); } });
}

// ── The screen's events (the `screen` feed, decisions §30 "12d") ──────────
// Views / screen changed, ReloadUI and Screenshot requests, each with a seq
// (none is lost; a reconnect resumes). The subscription names our live
// screen: while it stands we count as its viewer (a `Screenshot` asks its
// viewers) — `screenFeed.live` is the screen the station has registered.
// Subscribed again when our screen changes.
const screenFeed = { sub: null, screen: null, live: null };
function screenSubscribe() {
  loadSlots();
  if (screenFeed.sub && screenFeed.screen === liveScreen) return;
  screenFeed.sub?.close();
  screenFeed.screen = liveScreen;
  screenFeed.live = null;
  const screen = liveScreen;
  screenFeed.sub = feeds().sub('screen', { screen: screen || 0 }, {
    subbed: () => { if (screenFeed.screen === screen) screenFeed.live = screen; },
    batch: m => {
      for (const ev of m.items || []) {
        if (ev.event === 'screen_changed') onScreenChanged(ev);
        // ReloadUI: reload when it targets every UI or our screen.
        if (ev.event === 'reload_ui' && (!ev.screens || ev.screens.includes(liveScreen))) location.reload();
        if (ev.event === 'capture' && ev.screens.includes(liveScreen)) captureScreen(ev.id);
      }
    },
  });
}

// ── Screenshots (decisions §29 "11d") ──────────────────────────────────────
// `Screenshot` (F11 / Print Screen) asks on the screen feed; this client renders
// its screen as seen — cards and pop-ups included — with the vendored
// modern-screenshot, uploads the PNG, then flashes green.
async function captureScreen(id) {
  const screen = liveScreen;
  // A cloned <select> shows its first option: mark the chosen one so the
  // capture shows what the screen shows.
  document.querySelectorAll('select').forEach(sel =>
    [...sel.options].forEach(o => o.toggleAttribute('selected', o.selected)));
  try {
    const blob = await modernScreenshot.domToBlob(document.documentElement, {
      type: 'image/png',
      scale: window.devicePixelRatio || 1,
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: getComputedStyle(document.body).backgroundColor,
    });
    const r = await fetch(`/api/screenshots?id=${id}&screen=${screen}`, {
      method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob,
    });
    if (r.ok) flashScreenshot();
    else console.warn('screenshot upload refused', r.status, await r.text());
  } catch (e) { console.warn('screenshot failed', e); }
}
function flashScreenshot() {
  const el = document.createElement('div');
  el.className = 'shot-flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 450);
}

// ── Device, login and lock (decisions §30 "12a3") ──────────────────────────
// One surface (luma-surface) for login and DeskLock. The station keeps this
// device's lock and normal theme (by DEVICE): a reload comes back locked.
// Before a login the surface reads the open station view (GET /api/station
// once, then the open `station` feed on /ws/feeds: users with colour,
// profile, where they are logged in, the status line). The last user per station logs in by itself after
// the 5 s countdown when they have no password (`?autologin=now` skips the
// wait — tests); Admin always asks (`admin`).
const HOST = window.LumaHost || null;   // the desktop / mobile app (a browser has none)
const DEVICE = (() => {
  if (HOST?.device) return HOST.device;
  if (APP?.device) return APP.device;
  try {
    let d = sessionStorage.getItem('lumacore.device');
    if (!d) { d = 'tab-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); sessionStorage.setItem('lumacore.device', d); }
    return d;
  } catch(_) { return 'tab-' + Math.random().toString(36).slice(2, 12); }
})();
const LAST_USER_KEY = 'lumacore.lastUser';
const QUEUED_WHILE_LOCKED = new Set(['edit_settings', 'open_menu', 'attribute_board']);
let loggedIn = false;
let loginError = '';
let station = null;
let surface = null;
let deviceStatus = {};
let lockQueue = [];
let countdownTimer = null;
let stationSub = null;

function setToken(token) {
  document.cookie = `lumacore_token=${token}; Path=/; SameSite=Lax; Max-Age=${30 * 86400}`;
}
const lastUserKey = () => `${LAST_USER_KEY}.${station?.id || location.host}`;
function lastUser() { try { return localStorage.getItem(lastUserKey()) || localStorage.getItem(LAST_USER_KEY); } catch(_) { return null; } }
function rememberUser(user) { try { localStorage.setItem(lastUserKey(), user); localStorage.setItem(LAST_USER_KEY, user); } catch(_) {} }
function stationUser(name) { return station?.users?.find(u => u.name.toLowerCase() === String(name ?? '').toLowerCase()); }

// The open station view, pushed whenever it changes (the `station` feed:
// open, so it works on the lock screen before anyone logs in).
async function loadStation() {
  if (stationSub) return;
  try { station = await (await fetch('/api/station')).json(); } catch(_) { station = null; }
  stationSub = feeds().sub('station', {}, { batch: m => {
    if (!m.data) return;
    station = m.data;
    surface?.update({ station });
    updateStrip();
    applyMyLook();
    // An open setup menu on the station feed (Users & Profiles) follows.
    setupFeed('station', station);
  } });
}

// The look of this user's profile — or the normal theme (Meow+F9, the
// station's ThemeOverride: the factory preset, nothing of the profile).
// The theme editor (kit/themeeditor.js): a drag or a colour previews on this page only; every
// change is the station's line, and the fresh fields come back through EditSetting.
function openThemeEditor(ev, base) {
  const owner = (base.line.match(/^Set (.*?Theme) "Base"/) || [])[1] || 'Theme';
  const again = () => setTimeout(() => wsCommand(`EditSetting ${owner}`), 80);
  const open = LumaKit.themeEditor.openEditor();
  if (open) { open.update(ev.fields); return; }
  const who = /^UserProfile (\d+)/.exec(owner)?.[1] || ev.title || '';
  LumaKit.themeEditor.openThemeEditor({ title: `Theme · ${who}`.replace(/ · $/, ''), fields: ev.fields }, {
    run: line => { wsCommand(line); again(); },
    preview: look => {
      if (look === 'normal') LumaKit.theme.applyLook(null, { normal: true });
      else if (look) LumaKit.theme.applyLook(look);
      else return applyMyLook();
      applyTermTheme();
    },
  });
}

function applyMyLook() {
  if (!window.LumaKit) return;
  const look = loggedIn ? stationUser(currentUser)?.look : null;
  LumaKit.theme.applyLook(look, { normal: !!deviceStatus.normal_theme, override: deviceStatus.theme_override });
  applyTermTheme();
}

// ── The screen's Keyboard setting and the VK button (decisions §30 "12b") ──
// Auto | OS | Built-in | Off, kept per device and screen (this browser's or
// app's local storage, so it stays with the hardware, not the user). Tap the
// VK button: show / hide the built-in keyboard (or bring up the OS one);
// hold: pick the mode. The built-in keyboard types into the command line.
const KB_WORDS = ['At', 'Thru', '+', '-', 'Group', 'Fixture', 'Store', 'Label', 'Oops']; // registry words (tidy)
const kbStoreKey = () => `lumacore.keyboard.screen${liveScreen ?? 0}`;
let cmdKeyboard = null;
function loadKeyboardMode() {
  let m = null;
  try { m = localStorage.getItem(kbStoreKey()); } catch { /* none */ }
  LumaKit.keyboard.setMode(m || 'Auto');
  paintVk();
}
function setKeyboardMode(m) {
  try { localStorage.setItem(kbStoreKey(), m); } catch { /* private window: this session only */ }
  LumaKit.keyboard.setMode(m);
  if (m !== 'Built-in' && !LumaKit.keyboard.useBuiltIn()) hideCommandKeyboard();
  paintVk();
}
function paintVk() {
  const b = document.getElementById('cb-vk');
  if (!b) return;
  const m = LumaKit.keyboard.mode();
  b.querySelector('.cb-text').textContent = m === 'Auto' ? 'VK' : m === 'Built-in' ? 'VK' : m.toUpperCase();
  b.classList.toggle('on', !!cmdKeyboard);
  b.classList.toggle('off', m === 'Off');
}
// The command line as the keyboard's target: each act goes to the station as a key.
const commandSink = {
  kbType(act) {
    const send = key => wsSend({ type: 'key', key, ctrl: false, alt: false, shift: false, repeat: false });
    if (act.startsWith('ch:')) for (const ch of act.slice(3)) send(ch);
    else {
      const key = { back: 'Backspace', left: 'ArrowLeft', right: 'ArrowRight', please: 'Enter', esc: 'Escape' }[act];
      if (key) send(key);
    }
  },
};
function showCommandKeyboard() {
  if (cmdKeyboard) return;
  const kb = document.createElement('luma-keyboard');
  kb.id = 'cmd-keyboard';
  kb.setAttribute('mode', 'text');
  document.body.append(kb);
  kb.setWords(KB_WORDS);
  kb.target = commandSink;
  kb.addEventListener('hide', hideCommandKeyboard);
  cmdKeyboard = kb;
  paintVk();
}
function hideCommandKeyboard() {
  cmdKeyboard?.remove();
  cmdKeyboard = null;
  paintVk();
}
function tapVk() {
  const m = LumaKit.keyboard.mode();
  if (cmdKeyboard) return hideCommandKeyboard();
  if (m === 'Off') return;
  if (LumaKit.keyboard.useBuiltIn()) return showCommandKeyboard();
  // The OS keyboard: focus the command line's terminal (phones and tablets).
  const t = [...terms.values()].find(x => x.opened);
  t?.term.focus();
}
function vkMenu(x, y) {
  const m = LumaKit.keyboard.mode();
  const notes = { Auto: 'built-in on consoles and touch screens without one', OS: 'the phone or tablet keyboard', 'Built-in': 'this keyboard', Off: 'a hardware keyboard' };
  LumaKit.menu.openMenu({ x, y }, [
    { header: 'Keyboard · this screen' },
    ...LumaKit.keyboard.KEYBOARD_MODES.map(k => ({ icon: k === m ? 'check' : '', label: k, hint: notes[k], fn: () => setKeyboardMode(k) })),
  ]);
}
function wireVk() {
  const b = document.getElementById('cb-vk');
  // Hold (or right-click) = the mode menu; the kit swallows the click after.
  LumaKit.pointer.hold(b, { onHold: e => vkMenu(e.x, b.getBoundingClientRect().top - 8) });
  b.addEventListener('click', tapVk);
}

async function boot() {
  initTiles();
  LumaKit.keyboard.setKiosk(!!HOST?.kiosk);
  wireVk();
  loadKeyboardMode();
  await loadStation();
  // The app logged in already (token per window).
  // A token whose login still waits for the Meow License (a user switched on the lock) shows
  // its dialog first (decisions 0290); the shell's first status says.
  if (APP?.token) {
    setToken(APP.token);
    if (PAGE_MODE.has('overview') || PAGE_MODE.has('mirror')) return start(APP.user);
    return awaitConsent(APP.user, start);
  }
  if (!APP) try {
    const me = await fetch('/api/me');
    if (me.ok) return start((await me.json()).user);
    // A login that still waits for the Meow License (a reload, a user switched on the lock):
    // its dialog again, over the surface.
    const d = await me.json().catch(() => ({}));
    if (d.consent) {
      showSurface({ mode: 'login', user: d.user });
      return awaitConsent(d.user, user => { hideSurface(); start(user); });
    }
  } catch(_) {}
  // The app's auto-start already counted down: its user logs in at once.
  if (APP?.autologin) {
    const u = stationUser(APP.autologin);
    if (u && !u.has_password) return login(u.name, null);
    return showLogin(APP.autologin, { noCountdown: true });
  }
  showLogin(lastUser());
}

async function login(user, password) {
  stopCountdown();
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, password: password || undefined }),
    });
    const d = await r.json();
    if (!r.ok) { loginError = d.message || 'Login failed'; surface?.update({ error: loginError }); return false; }
    loginError = '';
    setToken(d.token);
    rememberUser(d.user);
    // The login is finished once the user accepts the Meow License (decisions 0290). In the
    // app, the app then opens this user's screens with the token.
    awaitConsent(d.user, user => {
      if (HOST?.loggedIn) return HOST.loggedIn(user, d.token);
      hideSurface();
      start(user);
    });
    return true;
  } catch(_) {
    loginError = 'Server not reachable';
    surface?.update({ error: loginError });
    return false;
  }
}

// ── The Meow License (decisions 0290) ──
// Every login waits for the station's consent dialog (one server dialog; its buttons are the
// lines Consent and Logout). Meanwhile only the shell is open — it carries the dialog — and the
// surface stays behind it; the first status without the dialog finishes the login here
// (`then`). "Not me" is Logout: the shell's logged_out event brings the surface back.
let consenting = null; // { user, then }
function awaitConsent(user, then) {
  consenting = { user, then };
  currentUser = user;
  loggedIn = true;
  if (!ws || ws.readyState > WebSocket.OPEN) connect();
}
function consentStep(st) {
  if (!consenting) return;
  if ((st.dialogs || []).some(d => d.topic === 'consent')) return;
  const { user, then } = consenting;
  consenting = null;
  // After this status has closed the dialog (renderStationDialogs): the desk starts as after
  // any login, keyboard focus included.
  setTimeout(() => then(user), 0);
}

let started = false;
const PAGE_MODE = new URLSearchParams(location.search);
function start(user) {
  currentUser = user;
  loggedIn = true;
  applyMyLook();
  // Screens overview / tiled mode (decisions §30 "12a3", the Overview board).
  if (PAGE_MODE.has('overview')) return startOverview();
  // A live picture inside the overview: the screen, drawn, never typed into.
  if (PAGE_MODE.has('mirror')) document.body.classList.add('mirror');
  else if (!ws || ws.readyState > WebSocket.OPEN) connect(); // open already after the consent
  // The feeds socket logs in (maybe as another user): every subscription stays.
  feeds().auth(myToken());
  if (started) { liveScreen = null; loadUiKeys(); loadFeedbackSettings(); feedbackConnect(); loadLayout(); loadSlots(); return; }
  started = true;
  initCmdBar();
  loadUiKeys();
  loadFeedbackSettings();
  feedbackConnect();
  loadWindowTypes().then(loadLayout);
  loadSlots();
  screenSubscribe();
}

// Forget the login (Logout / Disconnect, refused shell): the surface with
// nobody picked.
async function logout() {
  loggedIn = false;
  consenting = null;
  try { await fetch('/api/logout', { method: 'POST' }); } catch(_) {}
  if (ws && ws.readyState <= 1) ws.close();
  // Logged out: the feeds that need a login wait (nosub E-FEED-002), the
  // station feed goes on for the lock screen.
  feedClient?.auth(null);
  await loadStation();
  applyMyLook();
  showLogin(null);
}

// ── The surface ──
function showSurface(data) {
  if (!surface) {
    surface = document.createElement('luma-surface');
    wireSurface(surface);
    document.body.append(surface);
  }
  surface.update({ station, error: '', countdown: null, waiting: lockQueue.length + (barStatus?.dialogs?.length || 0),
    kiosk: !!HOST?.kiosk, remote: serverIsRemote(), showServers: false, ...data });
}
function hideSurface() { stopCountdown(); surface?.remove(); surface = null; }

function showLogin(user, { noCountdown = false } = {}) {
  const u = stationUser(user);
  showSurface({ mode: 'login', user: u ? u.name : null });
  if (u && !u.has_password && !loginError && !noCountdown) startCountdown(u.name);
}

function startCountdown(user) {
  stopCountdown();
  if (new URLSearchParams(location.search).get('autologin') === 'now') return login(user, null);
  let left = 5;
  surface?.update({ countdown: { seconds: left, total: 5, user } });
  // tidy: not-a-poll (the 5 s login countdown: one login at its end)
  countdownTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) { stopCountdown(); login(user, null); }
    else surface?.update({ countdown: { seconds: left, total: 5, user } });
  }, 1000);
}
function stopCountdown() {
  if (!countdownTimer) return;
  clearInterval(countdownTimer);
  countdownTimer = null;
  surface?.update({ countdown: null });
}

function wireSurface(s) {
  s.addEventListener('surface-pick', () => stopCountdown());
  s.addEventListener('surface-now', () => { const u = s.data.countdown?.user; if (u) login(u, null); });
  s.addEventListener('surface-stop', () => stopCountdown());
  s.addEventListener('surface-login', e => {
    if (s.data.mode === 'locked') switchDevice(e.detail.user, e.detail.password);
    else login(e.detail.user, e.detail.password);
  });
  s.addEventListener('surface-unlock', e => unlock(e.detail.password));
  s.addEventListener('surface-corners', () => unlock(null));
  s.addEventListener('surface-servers', async e => {
    if (HOST?.showServers) return HOST.showServers();
    s.update({ showServers: e.detail.open, servers: await serversData() });
  });
  s.addEventListener('surface-server', e => openServerRow(e.detail.index));
  s.addEventListener('surface-address', e => openAddress(e.detail.text));
  s.addEventListener('surface-focus', () => HOST?.focusSurface?.());
}

// ── Lock ──
// The station's word on this device: locked, normal theme.
function onDeviceStatus(dev) {
  if (!dev) return;
  const was = deviceStatus;
  deviceStatus = dev;
  // This device's screen config changed (or arrived): open that config's screen.
  if ((was.screen_config ?? null) !== (dev.screen_config ?? null) && loadedConfig !== undefined && !PAGE_MODE.has('vs')
      && (dev.screen_config ?? null) !== (loadedConfig ?? null) && dev.screen_config != null) {
    if (APP) toApp({ type: 'screen_config', no: dev.screen_config });
    else { liveScreen = null; loadLayout(); }
  }
  if ((was.screen_config ?? null) !== (dev.screen_config ?? null) && document.getElementById('power-overlay').classList.contains('open'))
    wireTiles('power-tiles', POWER_TILES);
  if (was.normal_theme !== dev.normal_theme || was.theme_override !== dev.theme_override) applyMyLook();
  if (dev.locked && !['locked', 'blurred'].includes(surface?.data.mode) && loggedIn) {
    document.querySelectorAll('.mo-overlay.open').forEach(o => closeMenuOverlay(o.id));
    showSurface({ mode: HOST?.isPrimary === false ? 'blurred' : 'locked', user: currentUser });
  } else if (!dev.locked && surface && (surface.data.mode === 'locked' || surface.data.mode === 'blurred')) {
    hideSurface();
    const queued = lockQueue;
    lockQueue = [];
    for (const ev of queued) handleUiEvent(ev);
  }
}

// Unlock: a user with a password types it (Admin: admin); one without
// unlocks with F9, a tap or the corner taps.
async function unlock(password) {
  const me = stationUser(currentUser);
  if (me?.has_password && !password) {
    surface?.update({ error: `Type ${me.name}'s password to unlock` });
    surface?.password.focus();
    return;
  }
  if (!me?.has_password) return wsCommand('Off DeskLock');
  try {
    const r = await fetch('/api/unlock', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: DEVICE, password }),
    });
    if (!r.ok) surface?.update({ error: (await r.json()).message || 'Wrong password' });
  } catch(_) { surface?.update({ error: 'Server not reachable' }); }
}

// Switch user on a locked device: the whole device logs in as the picked
// user (the previous login on this device ends) and unlocks.
async function switchDevice(user, password) {
  const r = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user, password: password || undefined }),
  }).catch(() => null);
  const d = r ? await r.json().catch(() => ({})) : {};
  if (!r?.ok) return surface?.update({ error: d.message || 'Login failed' });
  const old = document.cookie.match(/lumacore_token=([^;]+)/)?.[1];
  if (old && old !== d.token) await fetch('/api/logout', { method: 'POST', headers: { Authorization: `Bearer ${old}` } }).catch(() => {});
  setToken(d.token);
  rememberUser(d.user);
  await fetch('/api/unlock', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${d.token}` },
    body: JSON.stringify({ device: DEVICE, password }),
  }).catch(() => {});
  if (HOST?.switchUser) return HOST.switchUser(d.user, d.token);
  if (APP) return toApp({ type: 'user_changed', user: d.user, token: d.token });
  location.reload();
}

// ── Screens overview + tiled mode ──
// The browser's overview lists the user's screens; the app adds its displays
// and window places (LumaHost.overview → lumacoreApp.overview(data)).
async function startOverview() {
  const ov = document.createElement('luma-overview');
  document.body.append(ov);
  let mode = PAGE_MODE.get('overview') === 'tiled' ? 'tiled' : 'overview';
  const shot = no => `/?screen=${no}&mirror=1`;
  const live = no => `/?screen=${no}`;
  const draw = data => ov.update({ mode, title: `Screens · ${station?.name || ''} · ${currentUser}`, ...data,
    screens: (data.screens || []).map(s => ({ ...s, url: mode === 'tiled' ? live(s.no) : shot(s.no) })) });
  let last = {};
  window.lumacoreApp.overview = data => { last = { ...data, app: true }; draw(last); };
  ov.addEventListener('overview-mode', e => { mode = e.detail.mode; draw(last); });
  ov.addEventListener('overview-bring', e => HOST?.overviewAction?.('bring', e.detail.no));
  ov.addEventListener('overview-toggle', e => HOST?.overviewAction?.('toggle', e.detail.no));
  ov.addEventListener('overview-send', e => HOST?.overviewAction?.('send', e.detail.no, e.detail.display));
  ov.addEventListener('overview-popout', e => HOST?.overviewAction?.('popout', e.detail.no));
  if (HOST?.overview) return HOST.overview();
  let screens = [1];
  try {
    const me = await (await fetch('/api/me')).json();
    const cfg = me.screen_configs?.configs?.find(c => c.no === me.screen_configs.default) || me.screen_configs?.configs?.[0];
    if (cfg?.screens?.length) screens = cfg.screens;
  } catch(_) {}
  const w = Math.round(window.screen.width / 2), h = Math.round(window.screen.height / 2);
  last = { app: false, displays: [{ name: 'This browser', x: 0, y: 0, w: w * 2, h: h * 2, main: true }],
    screens: screens.map((no, i) => ({ no, open: true, display: 'This browser', x: (i % 2) * w, y: Math.floor(i / 2) * h, w, h })) };
  draw(last);
}

// Menu › Screens: the overview (the app opens its own window; a browser a tab).
function openScreensOverview() {
  closeMenuOverlay('menu-overlay');
  if (HOST?.openOverview) return HOST.openOverview();
  window.open('/?overview', '_blank');
}

// ── Servers… ──
// In a browser: the stations this one sees (each opens its own page and
// surface); in the app: the app's own list.
async function serversData() {
  if (HOST?.servers) return HOST.servers();
  let list = [];
  try { list = (await (await fetch('/api/lumasessions')).json()).stations || []; } catch(_) {}
  const here = station?.name;
  const rows = [{ name: here || location.host, info: `${location.host}${station?.show ? ` · ${station.show}` : ''}`, note: 'this station', current: true, dot: 'ok', url: null }];
  for (const st of list) {
    if (!st.name || st.name === here) continue;
    const host = st.ip || st.address;
    if (!host) continue;
    const port = st.http_port || 47656;
    rows.push({ name: st.name, info: `${host}:${port}${st.show ? ` · ${st.show}` : ''}`, note: st.status || '', dot: st.online === false ? 'off' : 'ok', url: `http://${host}:${port}/` });
  }
  serverRows = rows;
  return { rows, address: true, searching: 'Stations this one sees' };
}
let serverRows = [];
function openServerRow(i) {
  if (HOST?.openServer) return HOST.openServer(i);
  const row = serverRows[i];
  if (row?.url) location.href = row.url;
  else surface?.update({ showServers: false });
}
function openAddress(text) {
  if (HOST?.openAddress) return HOST.openAddress(text);
  const t = text.includes('://') ? text : `http://${text.includes(':') || text.startsWith('[') ? text : `${text}:47656`}/`;
  location.href = t;
}

// Keys while the surface shows: only the lock keys reach the station; Enter /
// Space log in now during the countdown, Esc stops it. The surface's own
// fields keep their keys.
document.addEventListener('keydown', e => {
  if (!surface) return;
  if (surface.contains(e.target) && e.target.tagName === 'INPUT') return;
  const lockKey = e.key === 'F9' || e.key === 'Pause';
  if (surface.data.mode === 'login') {
    if (countdownTimer && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const u = surface.data.countdown?.user; if (u) login(u, null); return; }
    if (e.key === 'Escape') { stopCountdown(); e.preventDefault(); return; }
  } else if (lockKey && !e.altKey && !e.ctrlKey) {
    e.preventDefault(); e.stopPropagation();
    if (e.type === 'keydown' && !e.repeat) unlock(null);
    return;
  } else if (lockKey) {
    return; // Meow+F9: the normal theme works while locked (the forwarder sends it)
  }
  if (!lockKey) { e.preventDefault(); e.stopPropagation(); }
}, true);

// AutoLock: the profile's idle minutes (LockScreen.AutoLock), measured here.
let lastInput = Date.now();
for (const t of ['pointerdown', 'keydown', 'wheel']) document.addEventListener(t, () => { lastInput = Date.now(); }, { capture: true, passive: true });
setInterval(() => {
  const minutes = stationUser(currentUser)?.look?.lock_screen?.auto_lock_minutes || 0;
  if (loggedIn && minutes > 0 && !deviceStatus.locked && Date.now() - lastInput > minutes * 60000) {
    lastInput = Date.now();
    wsCommand('On DeskLock');
  }
}, 15000);

// ── Soft keyboard (decisions §30) ──────────────────────────────────────────
// Phones and tablets: the page follows the visual viewport, so the OS
// keyboard pushes the command line bar up instead of covering it.
if (window.visualViewport) {
  const fit = () => {
    document.documentElement.style.setProperty('--lc-vvh', `${Math.round(visualViewport.height)}px`);
    window.scrollTo(0, 0);
  };
  visualViewport.addEventListener('resize', fit);
  fit();
}

// ── Boot ───────────────────────────────────────────────────────────────────
// After the kit (an ES module, loaded after this script): icons and fonts are
// in, the terminals take the theme's colours.
function whenKit() {
  return window.LumaKit ? window.LumaKit.ready : new Promise(r => window.addEventListener('lumakit', r, { once: true }));
}
whenKit().then(() => { applyTermTheme(); boot(); });
</script>
