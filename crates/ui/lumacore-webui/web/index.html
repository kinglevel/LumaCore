<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- LumaCore draws its own themes (decisions §30): colour-changing browser extensions keep out. -->
  <meta name="darkreader-lock">
  <title>LumaCore</title>
  <!-- The app icon (a copy of images/brand/prompt-icon.svg) -->
  <link rel="icon" type="image/svg+xml" href="/kit/icon.svg">
  <!-- The UI kit (decisions §30): fonts, theme tokens (the only raw colours),
       the touch baseline and the kit's custom elements. -->
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="/kit/tokens.css">
  <link rel="stylesheet" href="/kit/kit.css">
  <script type="module" src="/kit/kit.js"></script>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <!-- Screenshots (decisions §29 "11d"); every library is vendored: rigs are offline. -->
  <script src="/vendor/modern-screenshot.js"></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* The page is as tall as what is visible: an on-screen keyboard shrinks it
   (visualViewport below), so the command line bar stays above the keyboard. */
html, body { height: var(--lc-vvh, 100dvh); overflow: hidden; background: var(--lc-bg); color: var(--lc-text); font-family: var(--lc-font); font-size: var(--lc-fs); }

#app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
#topbar {
  /* The status strip (decisions top-bar-status-strip): 30 px, the touch height on a touch screen. */
  flex: 0 0 calc(30px + var(--lc-safe-top)); background: var(--lc-surface); border-bottom: 1px solid var(--lc-gap);
  display: flex; align-items: stretch; min-width: 0; overflow: hidden;
  /* Safe areas (12c2): the notch and rounded corners keep out of every edge bar. */
  padding: var(--lc-safe-top) calc(10px + var(--lc-safe-right)) 0 calc(10px + var(--lc-safe-left));
}
@media (any-pointer: coarse) { #topbar { flex-basis: calc(var(--lc-hit) + var(--lc-safe-top)); } }
#tb-strip { flex: 1; }

/* workspace */
#workspace { flex: 1; display: flex; overflow: hidden; min-height: 0; padding: 0 var(--lc-safe-right) 0 var(--lc-safe-left); }

/* left sidebar */
#sidebar-left {
  flex: 0 0 50px; background: var(--lc-surface); border-right: 1px solid var(--lc-gap);
  display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative;
}
.sl-btn {
  width: 50px; height: 50px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: var(--lc-fs-lg); color: var(--lc-text-dim); cursor: pointer; border: none; background: none;
  transition: color .1s, background .1s;
}
.sl-btn:hover { color: var(--lc-text); background: var(--lc-hover); }
.sl-waiting { color: var(--lc-accent); }
.sl-waiting[hidden] { display: none; }
.sl-btn.sl-mode small, .sl-waiting small { font-size: var(--lc-fs-small); font-weight: 600; letter-spacing: .02em; line-height: 1; }
.sl-filler { width: 50px; height: 25px; flex-shrink: 0; background: var(--lc-bg); border-top: 1px solid var(--lc-gap); border-bottom: 1px solid var(--lc-gap); }

/* panel area — renders this screen's screen split tree; windows are
   separated by the dark gap (the concept), not by borders */
#panel-area { flex: 1; display: flex; overflow: hidden; min-height: 0; min-width: 0; background: var(--lc-gap); }
.snode { display: flex; flex: 1 1 0%; overflow: hidden; min-width: 0; min-height: 0; }
.snode-h { flex-direction: row; }
.snode-v { flex-direction: column; }
.schild { flex: 1 1 0%; overflow: hidden; min-width: 0; min-height: 0; display: flex; }
/* Split handles are the kit's (kit/split.js, §30 "12e hardening"). */

/* panel */
.panel { flex: 1 1 0%; display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; position: relative; background: var(--lc-bg); }
/* focused panel: a gold frame drawn above the content */
.panel.focused::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  border: 1px solid var(--lc-accent);
}
/* Close: on hover for a mouse; on touch screens the window menu (tap the dot) closes. */
.panel-close {
  margin: auto 4px auto auto; width: var(--lc-hit); height: var(--lc-hit); flex-shrink: 0;
  color: var(--lc-text-dim); font-size: var(--lc-fs-md); line-height: 1; background: none; border: none; cursor: pointer;
  border-radius: var(--lc-radius-sm); display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: color .1s, background .1s, opacity .1s;
}
.panel-hdr:hover .panel-close { opacity: 1; }
.panel-close:hover { color: var(--lc-text); background: var(--lc-raised); }
@media (any-hover: none) { .panel-close { display: none; } }

/* panel header + tabs — every tab carries the gold dot (bright on the active
   tab); the dot is the window's header button: tap it for the window menu */
.panel-hdr {
  flex: 0 0 var(--lc-row); background: var(--lc-surface);
  display: flex; align-items: stretch; overflow: hidden;
}
.panel-tabs { display: flex; align-items: stretch; flex: 1; overflow-x: auto; overflow-y: hidden; gap: 2px; padding: 4px 4px 0; scrollbar-width: none; }
.panel-tabs::-webkit-scrollbar { display: none; }
.ptab {
  display: flex; align-items: center; gap: 0; padding: 0 14px 0 0;
  font-size: var(--lc-fs); color: var(--lc-text-dim);
  border: none; border-radius: var(--lc-radius-sm) var(--lc-radius-sm) 0 0; cursor: pointer; background: none;
  transition: color .1s, background .1s; white-space: nowrap; flex-shrink: 0; touch-action: pan-x;
}
.ptab:hover:not(.on) { color: var(--lc-text); }
.ptab.on { background: var(--lc-raised); color: var(--lc-strong); }
.tab-dot { width: 30px; align-self: stretch; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
.tab-dot::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--lc-dot-off); }
.ptab.on .tab-dot::before { background: var(--lc-accent); }
.tab-dot.open::before { box-shadow: 0 0 0 4px color-mix(in srgb, var(--lc-accent) 35%, transparent); }
@media (any-pointer: coarse) { .tab-dot { width: 44px; } .tab-dot::before { width: 12px; height: 12px; } }

/* panel body */
.panel-body { flex: 1; overflow: hidden; min-height: 0; position: relative; }
/* A window: its bar (kit luma-window-bar, 12c) above its content */
.win-wrap { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.win-wrap > :not(luma-window-bar) { flex: 1 1 0%; min-height: 0; height: auto; }
.win-wrap > .pool-win, .win-wrap > .lc-showroom { position: relative; inset: auto; }
/* The live title on the tab (12c): the station's ("U 1 Front"), sysmon errors as an alert pill */
.tab-title { margin-left: 8px; color: var(--lc-text-dim); font-weight: 400; }
.tab-title[hidden] { display: none; }
.tab-title.alert { padding: 1px 7px; border-radius: 9px; font-size: var(--lc-fs-small); color: var(--lc-alert);
  background: color-mix(in srgb, var(--lc-alert) 22%, var(--lc-raised)); }
.tab-title.ok { color: var(--lc-ok); }

/* terminal */
.terminal-wrap { width: 100%; height: 100%; background: var(--lc-gap); padding: 4px; overflow: hidden; }

/* empty pane (new split) */
.empty-pane { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--lc-bg); }
.empty-add {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 26px;
  background: none; border: 1px dashed var(--lc-line); border-radius: 6px; color: var(--lc-text-dim);
  font: inherit; font-size: var(--lc-fs-small); cursor: pointer; transition: color .1s, border-color .1s;
}
.empty-add:hover { color: var(--lc-text); border-color: var(--lc-accent); }
.empty-plus { font-size: var(--lc-fs-xxl); line-height: 1; color: var(--lc-accent); }

/* Add Window picker */
.pk-box {
  width: min(800px, calc(100vw - 32px)); height: min(480px, calc(100dvh - 32px));
  background: var(--lc-surface); border: 1px solid var(--lc-line); border-radius: 6px;
  display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; outline: none;
}
.pk-hdr { display: flex; align-items: center; gap: 8px; }
.pk-hdr h2 { flex: 1; font-size: var(--lc-fs); font-weight: 600; }
.pk-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--lc-line); flex-wrap: wrap; }
.pk-tab {
  padding: 7px 14px; background: none; border: 1px solid transparent; border-bottom: none;
  border-radius: 4px 4px 0 0; color: var(--lc-text-dim); font: inherit; font-size: var(--lc-fs-small); cursor: pointer;
}
.pk-tab:hover { color: var(--lc-text); }
@media (any-pointer: coarse) { .pk-tab { min-height: var(--lc-hit); min-width: var(--lc-hit); } .pk-filter input { min-height: var(--lc-hit); } }
.pk-tab.on { background: var(--lc-raised); color: var(--lc-accent); border-color: var(--lc-line); }
.pk-filter { display: flex; align-items: center; gap: 8px; font-size: var(--lc-fs); color: var(--lc-text-dim); }
.pk-filter[hidden] { display: none; }
.pk-filter input {
  flex: 1; background: var(--lc-bg); color: var(--lc-text); border: 1px solid var(--lc-line); border-radius: 4px;
  padding: 6px 8px; font: inherit; font-size: var(--lc-fs);
}
.pk-filter input:focus { outline: none; border-color: var(--lc-accent); }
.pk-grid {
  flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--lc-cell-min), 100%), 1fr));
  grid-auto-rows: 60px; gap: 6px; align-content: start;
}
.pk-item {
  display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; position: relative;
  background: var(--lc-raised); border: 1px solid var(--lc-line); border-radius: 5px;
  color: var(--lc-text); font: inherit; cursor: pointer; overflow: hidden;
}
/* Indicator button: colour bar on the left edge */
.pk-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ind); }
.pk-item:hover { border-color: var(--lc-text-dim); }
.pk-item.sel { border-color: var(--lc-accent); box-shadow: inset 0 0 0 1px var(--lc-accent); }
.pk-item.cur { opacity: .5; }
.pk-ico { font-size: var(--lc-fs-lg); width: 22px; text-align: center; color: var(--lc-text-dim); }
.pk-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.pk-name { font-size: var(--lc-fs); font-weight: 600; }
.pk-desc { font-size: var(--lc-fs-small); color: var(--lc-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-cat { font-size: var(--lc-fs-small);  color: var(--lc-text-dim); }
.pk-none { color: var(--lc-text-dim); font-size: var(--lc-fs); padding: 8px 2px; }
.pk-foot { font-size: var(--lc-fs-small); color: var(--lc-text-dim); }
.terminal-wrap .xterm { height: 100%; }

/* pool windows (decisions §22): one component for every pool */
.seq-win { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.pool-win { position: absolute; inset: 0; display: flex; flex-direction: column; font-size: var(--pool-font, var(--lc-fs-small)); }
.pool-title { display: flex; gap: 8px; align-items: baseline; padding: 3px 6px; border-bottom: 1px solid var(--lc-line);
  background: var(--lc-surface); font-size: var(--lc-fs-small); flex: 0 0 auto; }
.pool-title[hidden] { display: none; }
.pt-name { font-weight: 600; }
.pt-info { color: var(--lc-text-dim); font-size: var(--lc-fs-small); }
.pool-body { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
/* keyboard cursor — a frame, shown in the focused panel only */
.panel:not(.focused) .lc-pool-cell.cur { box-shadow: none; }
/* A live picture in the screens overview: drawn, never touched. */
body.mirror { pointer-events: none; }
body.mirror #cmdbar { display: none; }
/* sidebars hide from the command line bar and Meow+F10 (view bar) */
#sidebar-left.hidden, #sidebar-right.hidden { display: none; }
/* F12 = full screen of the windows (decisions §30 "12b2"): every bar hidden;
   typing floats the command line bar's own line in over the windows. */
body.fullwin #topbar, body.fullwin #sidebar-left, body.fullwin #sidebar-right { display: none; }
body.fullwin #encbar, body.mirror #encbar { display: none; }
body.fullwin:not(.typing) #cmdbar { display: none; }
body.fullwin.typing #cmdbar {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 90;
  width: min(760px, calc(100vw - 32px)); flex: none; height: 60px; padding: 0;
  border: 1px solid var(--lc-accent); border-radius: 8px; overflow: hidden;
}
body.fullwin.typing #cmdbar > :not(#cb-purr):not(#cb-line) { display: none; }

/* command line bar (the UI object and status colours) */
#cmdbar {
  flex: 0 0 calc(var(--lc-cmdbar) + var(--lc-safe-bottom)); display: flex; align-items: stretch; gap: 1px;
  padding: 0 var(--lc-safe-right) var(--lc-safe-bottom) var(--lc-safe-left);
  background: var(--lc-line); border-top: 1px solid var(--lc-line);
}
#cmdbar > * { background: var(--lc-surface); border: none; }
.cb-tri {
  flex: 0 0 50px; color: var(--lc-text-dim); font-size: var(--lc-fs); cursor: pointer;
  transition: color .1s, background .1s;
}
.cb-tri:hover { color: var(--lc-text); background: var(--lc-hover); }
.cb-purr {
  flex: 0 0 66px; cursor: pointer; color: var(--lc-accent);
  font: 600 var(--lc-fs-title)/1 var(--lc-font); letter-spacing: .08em;
  transition: background .1s;
}
.cb-purr:hover, .cb-purr.on { background: color-mix(in srgb, var(--lc-accent) 14%, var(--lc-surface)); }
#cb-line {
  flex: 1 1 auto; min-width: 300px; position: relative; cursor: text;
  background: var(--lc-bg); display: flex; align-items: center; padding: 0 8px;
}
#cb-line .terminal-wrap { height: 22px; padding: 0; background: transparent; }
#cb-line .xterm-viewport { background: transparent !important; }
/* Screenshot taken (a green flash), after the capture. */
.shot-flash { position: fixed; inset: 0; border: 6px solid var(--lc-ok); pointer-events: none; z-index: 100000; animation: shot-flash .45s ease-out forwards; }
@keyframes shot-flash { from { opacity: 1; } to { opacity: 0; } }
/* focus: a white box around the command line */
#cmdbar.focused #cb-line { box-shadow: inset 0 0 0 2px var(--lc-strong); }
#cb-status { display: flex; align-items: stretch; gap: 1px; background: var(--lc-line); }
#cb-status:empty { display: none; }
.cb-icon {
  flex: 0 0 auto; min-width: 50px; padding: 0 6px; cursor: default;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--lc-text-dim); background: var(--lc-surface); border: none; font: inherit;
}
.cb-glyph { font-size: var(--lc-fs-title); line-height: 1; }
.cb-text { font-size: var(--lc-fs-small); font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.cb-icon.active  { color: var(--lc-strong); }
.cb-icon.warning { color: var(--lc-warn); }
.cb-icon.alert   { color: var(--lc-alert); }
.cb-icon.enabled { color: var(--lc-ok); }
.cb-icon.parked  { color: var(--lc-park); }
.cb-icon.mine    { color: var(--lc-accent); }
[data-key].lit   { box-shadow: inset 0 -3px 0 var(--lc-accent); color: var(--lc-accent); }
.cb-mode { cursor: pointer; }
.cb-vk { cursor: pointer; }
.cb-vk:hover { background: var(--lc-hover); }
.cb-vk.on { color: var(--lc-accent); box-shadow: inset 0 -3px 0 var(--lc-accent); }
.cb-vk.off { opacity: .45; }
#cmd-keyboard { position: fixed; left: var(--lc-safe-left); right: var(--lc-safe-right); bottom: calc(var(--lc-cmdbar) + var(--lc-safe-bottom)); z-index: 900;
  background: var(--lc-surface); border-top: 1px solid var(--lc-line); padding: 8px 12px; }
.cb-mode:hover { background: var(--lc-hover); }
.cb-mode.prg { color: var(--lc-ok); }
.cb-mode.nav { color: var(--lc-info); }

/* command line history popup (PURR) — output layer of the session */
#history-pop {
  position: fixed; left: calc(8px + var(--lc-safe-left)); bottom: calc(var(--lc-cmdbar) + 6px + var(--lc-safe-bottom));
  width: min(760px, calc(100vw - 16px - var(--lc-safe-left) - var(--lc-safe-right))); height: min(42vh, calc(var(--lc-vvh, 100dvh) - var(--lc-cmdbar) - 60px));
  z-index: 150; display: flex; flex-direction: column;
  background: var(--lc-surface); border: 1px solid var(--lc-line); border-radius: 5px; overflow: hidden;
}
#history-pop[hidden] { display: none; }
.hp-hdr {
  flex: none; min-height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 10px;
  font-size: var(--lc-fs-small); font-weight: 600;  color: var(--lc-accent);
  border-bottom: 1px solid var(--lc-line);
}
.hp-body { flex: 1; min-height: 0; position: relative; }


/* Menu overlays: Shutdown Menu, Menu, confirmation */
/* The overlays (Shutdown, Menu, …) follow the kit's overlay
   contract (decisions §30 "12c2", kit .lc-scrim / .lc-box): ≤ the screen −
   32 px, a fixed title row with the 50 px kit close, the body scrolls. */
.mo-overlay {
  display: none; position: fixed; inset: 0; z-index: 120;
}
.mo-overlay.open { display: flex; }
.mo-box {
  background: var(--lc-surface); border: 1px solid var(--lc-line); border-radius: 6px;
}
.mo-title { padding: 0 0 0 16px; border-bottom: 1px solid var(--lc-line); font-size: var(--lc-fs-head); font-weight: 500; white-space: nowrap; }
.mo-title > span:first-child { display: inline-flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mo-info { flex: 1; min-width: 0; font-size: var(--lc-fs-note); font-weight: 400; color: var(--lc-text-dim); overflow: hidden; text-overflow: ellipsis; }
.mo-body { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 14px; }
.mo-body > luma-tiles { margin: -12px -14px -14px; flex: 1 1 auto; }
.power-box { width: 760px; }
.menu-box { width: 900px; }
.users-box { width: 1360px; height: 820px; }
.users-box .mo-body { padding: 0; overflow: hidden; }
.users-box luma-people { flex: 1; min-height: 0; }
.mo-title luma-icon { font-size: var(--lc-fs-lg); }

/* right ViewBar */
#sidebar-right {
  flex: 0 0 100px; background: var(--lc-surface); border-left: 1px solid var(--lc-line);
  display: flex; flex-direction: column; overflow: hidden;
}
.vb-nav {
  flex: 0 0 50px; display: flex; align-items: center; justify-content: center;
  font-size: var(--lc-fs-md); color: var(--lc-text-dim); cursor: pointer; border: none; background: none;
  transition: color .1s, background .1s;
}
.vb-nav:first-child { border-bottom: 1px solid var(--lc-line); }
.vb-nav:last-child  { border-top: 1px solid var(--lc-line); margin-top: auto; }
.vb-nav:hover { color: var(--lc-text); background: var(--lc-hover); }
#view-list { flex: 1; overflow-y: auto; overflow-x: hidden; }
.vbtn {
  width: 100%; height: 50px; background: none; border: none; border-bottom: 1px solid var(--lc-line);
  padding: 4px 7px; display: flex; flex-direction: column; align-items: flex-start;
  cursor: default; text-align: left;
}
.vbtn { position: relative; }
.vbtn.filled { cursor: pointer; background: color-mix(in srgb, var(--vb-kind) 16%, var(--lc-surface)); }
/* the kind's colour along the top (decisions 0287): a view, a group, a sequence, a macro */
.vbtn.filled::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--vb-kind); }
.vbtn.filled:hover { background: color-mix(in srgb, var(--vb-kind) 26%, var(--lc-surface)); }
.vbtn.gone { opacity: .55; }
.vbtn.gone .vbtn-name { font-style: italic; }
.vbtn.drop { box-shadow: inset 0 0 0 2px var(--lc-accent); }
.vbtn.on { background: color-mix(in srgb, var(--lc-accent) 8%, var(--lc-surface)); }
.vbtn-num  { font-size: var(--lc-fs-small); color: var(--lc-text-dim); font-family: var(--lc-mono); display: flex; gap: 4px; align-items: center; width: 100%; }
.vbtn-num luma-icon { margin-left: auto; font-size: var(--lc-fs-small); color: var(--vb-kind); }
.vbtn-name { font-size: var(--lc-fs-small); color: var(--lc-text-dim); margin-top: auto; }
.vbtn.filled .vbtn-name { color: var(--lc-text); }
.vbtn.on    .vbtn-name  { color: var(--lc-accent); }

/* System Monitor window */
.sysmon { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--lc-gap); }
.sm-cleared { flex: none; padding: 4px 12px; font-family: var(--lc-mono); font-size: var(--sm-font, var(--lc-fs-small)); color: var(--lc-text-dim);
  border-bottom: 1px dashed var(--lc-line); background: var(--lc-gap); }
.sm-cleared[hidden] { display: none; }
/* A virtual list (kit luma-vlist): only the visible rows exist */
.sm-list {
  flex: 1; min-height: 0; --lc-vl-font: var(--sm-font, var(--lc-fs-small));
  font-family: var(--lc-mono); font-size: var(--sm-font, var(--lc-fs-small)); line-height: 1.45;
  background: var(--lc-gap); transition: background .15s;
}
/* scrolled up = not the latest data, auto-scroll inactive */
.sm-list.paused { background: color-mix(in srgb, var(--lc-warn) 10%, var(--lc-gap)); }
.sm-row { display: flex; align-items: center; gap: 10px; padding: 0 8px; white-space: pre; color: var(--lc-text); width: max-content; min-width: 100%; }
/* Wrap (12c): rows fit the window; a long message ends in … (full text on hover) */
.sm-list.wrap .sm-row { width: 100%; }
.sm-list.wrap .sm-msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sm-row:hover { background: var(--lc-hover); }
.sm-time { color: var(--lc-text-dim); flex: 0 0 auto; }
.sm-sub { color: var(--lc-info); flex: 0 0 9ch; overflow: hidden; text-overflow: ellipsis; }
.sm-row.cmd .sm-sub { color: var(--lc-accent); }
.sm-row.warn .sm-msg { color: var(--lc-warn); }
.sm-row.error .sm-msg { color: var(--lc-alert); }
.sm-row mark { background: var(--lc-accent); color: var(--lc-on-accent); border-radius: 2px; }
.sm-list .lc-vl-empty { font-family: var(--lc-font); font-size: var(--lc-fs); }

/* Realtime window: each render stage's time per
   frame on a frame timeline, frame time, headroom, late frames, the lines'
   send rates and the session clock (decisions §24 "Step 9 hardening") */
.rt { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: auto;
      background: var(--lc-gap); font-family: var(--lc-mono); font-size: var(--lc-fs); color: var(--lc-text); }
.rt-head { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 8px; background: var(--lc-surface);
           border-bottom: 1px solid var(--lc-line); font-size: var(--lc-fs-small); }
.rt-head b { color: var(--lc-strong); font-weight: 600; }
.rt-head .rt-bad { color: var(--lc-alert); }
.rt-head .rt-ok { color: var(--lc-ok); }
.rt-sec { padding: 4px 8px 2px; color: var(--lc-text-dim); font-size: var(--lc-fs-small);  }
/* 12b2: each stage's number + a 10 s graph (kit luma-graph), every frame */
.rt-graphs { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.rt-g { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center; height: 64px; }
.rt-g luma-graph { height: 100%; }
.rt-g-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rt-g-name { font-family: var(--lc-font); font-size: var(--lc-fs-small); color: var(--lc-text-dim); }
.rt-g-now { font-size: var(--lc-fs-title); font-weight: 500; color: var(--lc-strong); white-space: nowrap; }
.rt-g-max { font-size: var(--lc-fs-small); color: var(--lc-text-dim); white-space: nowrap; }
.rt-note { padding: 0 8px 4px; font-family: var(--lc-font); font-size: var(--lc-fs-small); color: var(--lc-text-dim); }
.rt-head .rt-gap { color: var(--lc-warn); }
.rt-table { width: calc(100% - 16px); margin: 0 8px 6px; border-collapse: collapse; font-size: var(--lc-fs-small); }
.rt-table th { text-align: left; color: var(--lc-text-dim); font-weight: 400; padding: 2px 4px; border-bottom: 1px solid var(--lc-line); }
.rt-table td { padding: 2px 4px; border-bottom: 1px solid var(--lc-line); }
.rt-table td.n { text-align: right; }
.rt-empty { color: var(--lc-text-dim); padding: 2px 12px 6px; font-family: var(--lc-font); font-size: var(--lc-fs-small); }

/* DMX window: every channel of a universe, marked by
   who won it (ours / park / DMX input) */
.dmx { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--lc-gap); }
.dx-legend { display: flex; gap: 8px; margin-left: auto; color: var(--lc-text-dim); white-space: nowrap; }
.dx-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.dx-grid {
  flex: 1; min-height: 0; overflow: auto; display: grid; gap: 1px; padding: 2px; align-content: start;
  font-family: var(--lc-mono); font-size: var(--lc-fs-small);
}
.dx-row { color: var(--lc-text-dim); text-align: right; padding: 3px 4px 0 0; font-size: var(--lc-fs-small); }
.dx-cell {
  position: relative; min-height: 34px; padding: 2px 3px; overflow: hidden; background: var(--lc-surface);
  color: var(--lc-text-dim); cursor: pointer; border-radius: 0;
}
@media (any-pointer: coarse) { .dx-cell { min-height: var(--lc-hit); } }
.dx-cell.fx { background: var(--lc-raised); }
.dx-cell.fx.alt { background: var(--lc-hover); }
.dx-cell.first { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.dx-cell.last { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.dx-lvl { position: absolute; inset: 0; pointer-events: none; }
.dx-v, .dx-a, .dx-id { position: relative; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dx-v { color: var(--lc-strong); font-weight: 600; }
.dx-a { color: var(--lc-text-dim); font-size: var(--lc-fs-small); }
.dx-id { color: var(--lc-info); font-size: var(--lc-fs-small); }
.dx-cell.w-default .dx-v { color: var(--lc-text-dim); }
.dx-cell.w-park { box-shadow: inset 0 0 0 1px var(--lc-park); }
.dx-cell.w-park .dx-v { color: var(--lc-park); }
.dx-cell.w-input { box-shadow: inset 0 0 0 1px var(--lc-info); }
.dx-cell.w-input .dx-v { color: var(--lc-info); }
.dx-cell:hover { outline: 1px solid var(--lc-accent); z-index: 1; }
.dx-cell.goto { outline: 2px solid var(--lc-accent); }
.dx-status {
  flex: 0 0 auto; display: flex; gap: 12px; padding: 3px 8px; font-size: var(--lc-fs-small); color: var(--lc-text); background: var(--lc-surface);
  border-top: 1px solid var(--lc-line); white-space: nowrap; overflow: hidden; min-height: 17px;
}
.dx-hover { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dx-empty { color: var(--lc-text-dim); padding: 8px; font-family: var(--lc-font); font-size: var(--lc-fs); grid-column: 1 / -1; }


/* context menu: the kit's menu (kit/kit.css #ctx) */

/* shutdown overlay */
#picker-overlay {
  display: none; position: fixed; inset: 0; background: var(--lc-scrim);
  align-items: center; justify-content: center; z-index: 100;
}
#picker-overlay.open { display: flex; }
#prompt-input {
  background: var(--lc-bg); color: var(--lc-text); border: 1px solid var(--lc-line); border-radius: 4px;
  padding: 6px 8px; font: inherit; font-size: var(--lc-fs); min-width: 220px;
}
#prompt-input:focus { outline: none; border-color: var(--lc-accent); }
.shutdown-box {
  background: var(--lc-surface); border: 1px solid var(--lc-line); border-radius: 6px;
  padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; min-width: 220px;
}
.shutdown-box h2 { font-size: var(--lc-fs); font-weight: 600; color: var(--lc-text); }
.shutdown-actions { display: flex; gap: 8px; justify-content: flex-end; }
/* connection lost (reconnecting) */
#conn-overlay { z-index: 200; }
.conn-box { width: 380px; }
.conn-box .mo-body { padding: 16px; }
.conn-row { display: flex; align-items: center; gap: 10px; }
.conn-spin { width: 14px; height: 14px; border: 2px solid var(--lc-line); border-top-color: var(--lc-accent); border-radius: 50%; animation: conn-spin .8s linear infinite; flex: 0 0 auto; }
@keyframes conn-spin { to { transform: rotate(360deg); } }
#conn-notice { font-size: var(--lc-fs-small); color: var(--lc-text-dim); min-height: 14px; }
/* Feedback surfaces (one system: progress, flash, cards, pop-ups) ───── */
/* Progress: top-centre translucent pills, stacked */
#fb-progress {
  position: fixed; top: calc(34px + var(--lc-safe-top)); left: 50%; transform: translateX(-50%); z-index: 230;
  width: min(50vw, 760px); display: flex; flex-direction: column; gap: 4px; pointer-events: none;
}
.fb-pill {
  position: relative; overflow: hidden; border-radius: 10px; padding: 6px 14px; text-align: center;
  background: color-mix(in srgb, var(--lc-accent) 50%, transparent); color: var(--lc-strong); font-size: var(--lc-fs); transition: opacity .3s;
}
.fb-pill .fb-fill {
  position: absolute; inset: 0 auto 0 0; width: 0;
  background: color-mix(in srgb, var(--lc-ok) 55%, transparent); transition: width .15s;
}
.fb-pill .fb-label { position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-pill.done { opacity: 0; }
/* Flash: "Show saved" — green outline band at the bottom */
#fb-flash {
  position: fixed; left: calc(8px + var(--lc-safe-left)); right: calc(8px + var(--lc-safe-right)); bottom: calc(6px + var(--lc-safe-bottom)); height: 36px; z-index: 230;
  border: 2px solid var(--lc-ok); border-radius: 9px; display: flex; align-items: center; justify-content: center;
  color: var(--lc-ok); font-size: var(--lc-fs-xl); letter-spacing: .02em; pointer-events: none;
  opacity: 0; transition: opacity .3s;
}
#fb-flash.on { opacity: 1; transition: none; }
/* Cards: the notification area — top-right stack, 300 px */
#fb-cards {
  position: fixed; top: calc(34px + var(--lc-safe-top)); right: calc(8px + var(--lc-safe-right)); width: min(300px, calc(100vw - 16px)); z-index: 240;
  display: flex; flex-direction: column; gap: 6px; max-height: calc(100dvh - 120px); overflow-y: auto;
}
.fb-card {
  display: grid; grid-template-columns: 22px 1fr 18px; gap: 2px 8px; align-items: start;
  padding: 8px 10px; border-radius: 6px; color: var(--lc-text); font-size: var(--lc-fs-small); background: color-mix(in srgb, var(--lc-ok) 22%, var(--lc-surface)); border: 1px solid var(--lc-line);
  animation: fb-in .18s ease-out;
}
@keyframes fb-in { from { transform: translateX(20px); opacity: 0; } }
.fb-card.warn  { background: color-mix(in srgb, var(--lc-warn) 24%, var(--lc-surface)); }
.fb-card.error { background: color-mix(in srgb, var(--lc-warn) 30%, var(--lc-surface)); }
.fb-card.alert { background: color-mix(in srgb, var(--lc-alert) 30%, var(--lc-surface)); }
.fb-card .fb-ico { grid-row: 1 / span 2; font-size: var(--lc-fs-md); line-height: 1; }
.fb-card .fb-title { font-weight: 600; }
.fb-card .fb-text { grid-column: 2; color: var(--lc-text); word-break: break-word; }
.fb-card .fb-x { grid-row: 1; grid-column: 3; background: none; border: none; color: var(--lc-text-dim); cursor: pointer; font-size: var(--lc-fs); padding: 0;
  min-width: 24px; min-height: 24px; margin: -6px -6px 0 0; }
@media (any-pointer: coarse) { .fb-card { grid-template-columns: 22px 1fr var(--lc-hit); } .fb-card .fb-x { min-width: var(--lc-hit); min-height: var(--lc-hit); margin: -10px -10px 0 0; } }
.fb-card .fb-x:hover { color: var(--lc-strong); }
.fb-card .fb-meta { grid-column: 2; color: var(--lc-text-dim); font-size: var(--lc-fs-small); }
/* Pop-up: centred, modal */

.btn-cancel { padding: 6px 14px; border-radius: 4px; font-size: var(--lc-fs); cursor: pointer; background: none; border: 1px solid var(--lc-line); color: var(--lc-text-dim); transition: color .1s, border-color .1s; }
.btn-cancel:hover { color: var(--lc-text); border-color: var(--lc-text-dim); }
.btn-shutdown { padding: 6px 14px; border-radius: 4px; font-size: var(--lc-fs); cursor: pointer; background: color-mix(in srgb, var(--lc-alert) 15%, var(--lc-surface)); border: 1px solid var(--lc-alert); color: var(--lc-alert); transition: background .1s; }
.btn-shutdown:hover { background: color-mix(in srgb, var(--lc-alert) 25%, var(--lc-surface)); }
/* Page controls on touch screens: the 44 px floor. */
@media (any-pointer: coarse) {
  .btn-cancel, .btn-shutdown { min-height: var(--lc-hit); }
}
/* Phones (decisions §30 "12c2", PhoneFixes board): the view bar gives its
   width to the windows, and the command line bar is PURR · line · VK · ⋯ —
   the statuses, the session and the mode go into ⋯. */
#cb-more { display: none; }
@media (max-width: 600px) {
  /* 12e: the left sidebar folds into ⋯ too — the panes get the full width. */
  #sidebar-right, #sidebar-left { display: none; }
  #cb-line { min-width: 0; }
  #cmdbar #cb-left, #cmdbar #cb-right, #cmdbar #cb-status, #cmdbar #cb-mode { display: none; }
  #cmdbar .cb-purr { flex-basis: 60px; }
  #cmdbar .cb-icon { min-width: 48px; }
  #cmdbar #cb-more { display: flex; }
  #cb-more .cb-glyph { color: var(--lc-ok); }
  #cb-more.alert .cb-glyph { color: var(--lc-alert); }
  #cb-more.warning .cb-glyph { color: var(--lc-warn); }
}
/* Miniature panes on touch screens (kit minipane.js) and the held / maximised
   window (kit luma-maxbar): decisions §30 "12c2", the HoldFullscreen board. */
.lc-mini-inner { flex: 1 1 0%; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.panel.lc-mini { outline: 1px solid var(--lc-raised); outline-offset: -1px; }
.panel.max-win { position: absolute; inset: 0; z-index: 6; }
#panel-area { position: relative; }

  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <!-- The status strip (decisions top-bar-status-strip): the mark, the show, the facts, the modes, the clock -->
    <luma-status-strip id="tb-strip"></luma-status-strip>
  </div>

  <div id="workspace">
    <div id="sidebar-left">
      <button class="sl-btn" data-key="power" title="Shutdown Menu (Meow+F11)"><luma-icon name="power"></luma-icon></button>
      <button class="sl-btn" data-key="desklock" title="DeskLock — lock this device (F9 / Pause)"><luma-icon name="lock"></luma-icon><small>LOCK</small></button>
      <!-- The mode keys, Oops and Meow live in the top bar's strip (decisions top-bar-status-strip). -->
      <!-- New attributes wait for this user's answer (§30 "12f-a"): tap = your board -->
      <button class="sl-btn sl-waiting" id="sl-waiting" hidden title="New attributes wait for your answer — tap: your attribute board" onclick="wsCommand('Edit UserProfile Attribute /New')"><luma-icon name="sparkles"></luma-icon><small></small></button>
      <div class="sl-filler"></div>
      <button class="sl-btn" data-key="menu" title="Menu — double-click: Quick Save"><luma-icon name="settings"></luma-icon></button>
    </div>

    <div id="panel-area"></div>

    <div id="sidebar-right">
      <button class="vb-nav up" title="Previous set" onclick="viewPageUp()"><luma-icon name="chevron-up"></luma-icon></button>
      <div id="view-list"></div>
      <button class="vb-nav down" title="Next set" onclick="viewPageDown()"><luma-icon name="chevron-down"></luma-icon></button>
    </div>
  </div>

  <!-- The screen's encoder bar (decisions §30 "12f"): above the command line, on / off per screen -->
  <luma-encoder-bar id="encbar" hidden></luma-encoder-bar>

  <!-- Command line bar: full width, 50 px, every screen -->
  <div id="cmdbar">
    <button class="cb-tri" id="cb-left" title="Toggles the control bar (F12: full screen of the windows)" onclick="toggleSidebar('left')"><luma-icon name="chevron-left"></luma-icon></button>
    <button class="cb-purr" id="cb-purr" title="Toggles the command line history" onclick="toggleHistory()">PURR</button>
    <div id="cb-line" title="Command line"></div>
    <div id="cb-status"></div>
    <button class="cb-icon cb-vk" id="cb-vk" data-kit="vk" title="Keyboard — tap: show / hide · hold: Auto / OS / Built-in / Off"><span class="cb-glyph"><luma-icon name="keyboard"></luma-icon></span><span class="cb-text">VK</span></button>
    <!-- Phones (12c2): the statuses, session and mode in one overflow -->
    <button class="cb-icon" id="cb-more" data-kit="cb-more" title="Status, session and mode" aria-label="Status, session and mode" onclick="cbMoreMenu(this, event)"><span class="cb-glyph"><luma-icon name="ellipsis"></luma-icon></span></button>
    <button class="cb-icon cb-mode" id="cb-mode" title="Shortcut mode — click to cycle (Shortcuts)" onclick="wsCommand('Shortcuts')"><span class="cb-glyph"><luma-icon name="keyboard"></luma-icon></span><span class="cb-text">KBD</span></button>
    <button class="cb-tri" id="cb-right" title="Toggles the view bar (Meow+F10)" onclick="toggleSidebar('right')"><luma-icon name="chevron-right"></luma-icon></button>
  </div>
</div>

<!-- F12 full screen: the corner handle brings the bars back (kit corner handle) -->
<button class="lc-corner-handle" id="fs-handle" data-kit="corner-handle" hidden title="Show the bars (F12)" aria-label="Show the bars (F12)" onclick="setSidebars({ full: false })"><luma-icon name="minimize"></luma-icon></button>

<div id="history-pop" hidden>
  <div class="hp-hdr"><span>Command Line History</span><button class="lc-close" data-kit="close" aria-label="Close" onclick="toggleHistory(false)"><luma-icon name="x"></luma-icon></button></div>
  <div class="hp-body"></div>
</div>

<!-- Connection lost: reconnecting, or back to the server list -->
<div id="conn-overlay" class="mo-overlay lc-scrim">
  <div class="mo-box lc-box conn-box">
    <div class="mo-body lc-box-body">
    <div class="conn-row"><div class="conn-spin"></div><span id="conn-text">Connection lost — reconnecting…</span></div>
    <div id="conn-notice"></div>
    <div class="shutdown-actions"><button class="btn-cancel" id="conn-cancel">Cancel</button></div>
    </div>
  </div>
</div>
<div id="fb-progress"></div>
<div id="fb-flash"></div>
<div id="fb-cards"></div>

<!-- Shutdown Menu (no Reboot) + this device's screen config (12c2) -->
<div id="power-overlay" class="mo-overlay lc-scrim">
  <div class="mo-box lc-box power-box">
    <div class="mo-title lc-box-title"><span><luma-icon name="power"></luma-icon> Shutdown Menu</span><span class="mo-info" id="power-info"></span><button class="lc-close" data-kit="close" aria-label="Close" onclick="closeMenuOverlay('power-overlay')"><luma-icon name="x"></luma-icon></button></div>
    <luma-tiles id="power-tiles" class="lc-box-body"></luma-tiles>
  </div>
</div>

<!-- Menu — the menu centre; the kit's tile grid (12c2, MenuTiles board) -->
<div id="menu-overlay" class="mo-overlay lc-scrim">
  <div class="mo-box lc-box menu-box">
    <div class="mo-title lc-box-title"><span><luma-icon name="layout-grid"></luma-icon> <span id="menu-title">Menu</span></span><span id="menu-info" class="mo-info"></span><button class="lc-close" data-kit="close" aria-label="Close" onclick="closeMenuOverlay('menu-overlay')"><luma-icon name="x"></luma-icon></button></div>
    <luma-tiles id="menu-tiles" class="lc-box-body"></luma-tiles>
  </div>
</div>

<div id="ctx" hidden></div>


<div id="picker-overlay" class="lc-scrim">
  <div class="pk-box lc-box" tabindex="-1">
    <div class="pk-hdr lc-box-title"><h2 class="pk-title">Add Window</h2><button class="lc-close" data-kit="close" aria-label="Close" onclick="closePicker()"><luma-icon name="x"></luma-icon></button></div>
    <div class="pk-tabs"></div>
    <div class="pk-filter" hidden><label>Filter:</label><input type="text" placeholder="Type to search windows" maxlength="40"></div>
    <div class="pk-grid"></div>
    <div class="pk-foot">Type to search · ←↑↓→ select · Enter add · Tab next category · Esc close</div>
  </div>
</div>




<script>
// Inside the LumaCore app (thin client) the app injects LUMACORE_APP: this
// window's server, user, token, screen config and screen, and its saved page
// state. Login, Logout, screen configs and Connect then go through the app.
const APP = window.LUMACORE_APP || null;
function toApp(msg) { try { window.ipc.postMessage(JSON.stringify(msg)); } catch(_) {} }
// Is the server another machine? (Power-off warning.)
function serverIsRemote() {
  return APP ? !APP.local : !['localhost', '127.0.0.1', '::1', '[::1]'].includes(location.hostname);
}
// ── Terminals ──────────────────────────────────────────────────────────────
// Every Terminal window shows the same shell session: the user's command
// line, history and output. Each visible terminal is registered as a viewport
// with its own size; the server composites the session once per viewport
// (stacked rendering) and tags each frame with the terminal's window number.
// The primary terminal (focused, else last focused) is listed first: it gets
// the suggestion menu and popups, and scroll keys act on it.
// Colours come from the theme tokens (LumaKit.theme.terminalTheme, set at boot
// and again when the preset changes).
const TERM_OPTS = {
  cursorBlink: true,
  fontSize: 13,
  fontFamily: '"JetBrains Mono","Cascadia Code","Menlo",monospace',
  theme: {},
};
// Re-colour every terminal from the tokens (boot, preset change).
function applyTermTheme() {
  TERM_OPTS.theme = LumaKit.theme.terminalTheme();
  for (const [no, t] of terms)
    t.term.options.theme = no === BAR_VIEW ? barTermTheme() : TERM_OPTS.theme;
}
function barTermTheme() {
  return { ...LumaKit.theme.terminalTheme({ background: 'bg' }), cursor: LumaKit.theme.TRANSPARENT };
}
window.addEventListener('lc-theme', () => applyTermTheme());
const terms = new Map(); // window no (or BAR_VIEW / HISTORY_VIEW) → { term, fit, host, opened, layers }
// Viewport ids of the command line bar (input layer only) and the PURR
// history popup (output layer only); kept out of the window number range.
const BAR_VIEW = 2147483646;
const HISTORY_VIEW = 2147483645;
let primaryTerm = null;  // window no of the primary terminal

// xterm can only be opened once, so each terminal window keeps a persistent
// host element that is re-parented into its panel on every render.
function termFor(no, opts = {}) {
  if (terms.has(no)) return terms.get(no);
  const term = new Terminal({ ...TERM_OPTS, ...(opts.term || {}), theme: opts.term?.theme || TERM_OPTS.theme });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const host = document.createElement('div');
  host.className = 'terminal-wrap';
  term.attachCustomKeyEventHandler(xtermKey);
  // Keystrokes are forwarded as structured events (below); onData only carries pastes.
  term.onData(d => { if (ws?.readyState === WebSocket.OPEN) ws.send(d); });
  new ResizeObserver(() => syncTermSizes()).observe(host);
  const t = { term, fit, host, opened: false, layers: opts.layers || 'full' };
  terms.set(no, t);
  return t;
}

// Open terminals that became visible, fit each to its own panel and send the
// viewport list to the server: full terminals first (the primary one leads —
// it draws the suggestion menu), then the bar and the history popup.
function syncTermSizes() {
  const viewports = [];
  for (const [no, t] of terms) {
    if (!t.host.isConnected) continue;
    if (!t.opened) { t.term.open(t.host); t.opened = true; }
    let d = null;
    try { d = t.fit.proposeDimensions(); } catch(_) {}
    if (!d?.cols || !d?.rows) continue;
    const rows = t.layers === 'input' ? 1 : d.rows;
    if (t.term.cols !== d.cols || t.term.rows !== rows) t.term.resize(d.cols, rows);
    viewports.push({ view: no, cols: d.cols, rows, layers: t.layers });
  }
  const rank = v => v.layers !== 'full' ? 2 : v.view === primaryTerm ? 0 : 1;
  viewports.sort((a, b) => rank(a) - rank(b));
  sendViewports(viewports);
  const full = viewports.find(v => v.layers === 'full');
  if (full) sendResize(full.cols, full.rows);
}

let lastViewports = '';
function sendViewports(viewports) {
  const json = JSON.stringify(viewports);
  if (json === lastViewports || ws?.readyState !== WebSocket.OPEN) return;
  lastViewports = json;
  ws.send(JSON.stringify({ type: 'viewports', viewports }));
}

let lastSize = '';
function sendResize(cols, rows) {
  const size = `${cols}x${rows}`;
  if (size === lastSize || ws?.readyState !== WebSocket.OPEN) return;
  lastSize = size;
  ws.send(JSON.stringify({ type: 'resize', cols, rows }));
}

// Dispose terminals whose window is gone (or became another type).
function pruneTerms() {
  for (const [no, t] of terms) {
    if (no === BAR_VIEW || no === HISTORY_VIEW || layout.windows[no]?.kind === 'terminal') continue;
    t.term.dispose();
    terms.delete(no);
    if (primaryTerm === no) primaryTerm = null;
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────
// The top bar's strip (decisions top-bar-status-strip): its connection follows this socket.
const strip = document.getElementById('tb-strip');
let stripConn = 'retry';
let ws;

function connect() {
  if (!loggedIn) return;
  // Same origin as the page: whichever server this UI was loaded from.
  // The token rides on the URL too: a cookie just written by the page may not reach the
  // upgrade request yet (the app's token, connected at once for the Meow License).
  const token = myToken();
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/shell?device=${encodeURIComponent(DEVICE)}${token ? `&token=${encodeURIComponent(token)}` : ''}`);
  ws.binaryType = 'arraybuffer';
  shellUp = false;
  ws.onopen = () => {
    hideConnLost();
    stripConn = 'up';
    updateNet();
    lastSize = '';
    lastViewports = '';
    lastFocusMsg = '';
    syncTermSizes();
    syncKeyboardFocus();
    if (liveScreen) wsSend({ type: 'live_screen', no: liveScreen });
  };
  // Binary = terminal frame (4-byte LE viewport id, then ANSI; id 0 = before
  // any viewport is registered, for every terminal). Text = JSON control
  // message (see ws/shell bridge).
  ws.onmessage = e => {
    if (typeof e.data !== 'string') {
      const view = new DataView(e.data).getUint32(0, true);
      const ansi = new Uint8Array(e.data, 4);
      if (view === 0) { for (const t of terms.values()) if (t.opened) t.term.write(ansi); }
      else { const t = terms.get(view); if (t?.opened) t.term.write(ansi); }
      return;
    }
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'ui') handleUiEvent(msg.event);
      if (msg.type === 'status') { renderStatus(msg.status); shellReady(); }
      if (msg.type === 'suggestions') LumaKit.suggest.receive(msg);
      // The server refused the shell (e.g. the login expired): log in again.
      if (msg.type === 'error') {
        loginError = msg.message;
        if (APP) { loggedIn = false; return toApp({ type: 'logged_out', message: msg.message }); }
        logout();
      }
    } catch(_) {}
  };
  ws.onclose = () => {
    stripConn = 'retry';
    updateNet();
    if (!loggedIn) return;
    // After a confirmed Shutdown the app goes back to its server list.
    if (APP && shutdownSent) { loggedIn = false; return toApp({ type: 'disconnect', message: 'The server was shut down.' }); }
    showConnLost();
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}
function wsSend(obj) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// The shell is up once its first status came (the login is through): lines
// that waited for it (a setup menu's EditSetting right after login) go now.
let shellUp = false;
const shellWaiters = [];
function shellReady() {
  if (shellUp) return;
  shellUp = true;
  for (const line of shellWaiters.splice(0)) wsCommand(line);
}

// A command from the UI: runs in our shell session and echoes in the terminal.
// Queued behind pending layout saves, so it can address windows just created.
// `win`: the window the line belongs to (a window bar, the window menu, its
// settings window) — `Self` in the line is that window (decisions §30 "12c").
// Without it the station takes the focused window (the focus packet).
function wsCommand(cmd, win) {
  saveChain = saveChain.then(() => wsSend(win != null ? { type: 'command', cmd, window: Number(win) } : { type: 'command', cmd }));
}

// A continuous control's line (decisions §30 "12f", the gesture channel): quiet on the station,
// the newest move wins while it is busy, the end files one entry ("Fader Master 2.1: 100 → 63.5").
// g = { id, line, phase: 'move' | 'end', window?, label?, from?, value? } — kit controls only:
// every `<luma-fader>` (and later the encoder bar) emits a `gesture` event.
function wsGesture(g) {
  const msg = { type: 'gesture', id: String(g.id), line: g.line, phase: g.phase === 'end' ? 'end' : 'move' };
  for (const k of ['label', 'from', 'value']) if (g[k] != null) msg[k] = String(g[k]);
  if (g.window != null) msg.window = Number(g.window);
  saveChain = saveChain.then(() => wsSend(msg));
}
// A control inside a window that needs `Self` sends its own (stopPropagation + wsGesture with it).
document.addEventListener('gesture', e => {
  if (e.detail?.line) wsGesture(e.detail);
});

// ── Connection lost / notices ──────────────────────────────────────────────
let shutdownSent = false;
function connText() {
  const crit = fb.lastCritical && Date.now() - fb.lastCritical.at < 15000 ? fb.lastCritical.title : null;
  document.getElementById('conn-text').textContent =
    crit === 'Server restarting' ? 'Server restarting — reconnecting…'
    : shutdownSent || crit === 'Server shutting down' ? 'The server is shutting down…'
    : 'Connection lost — reconnecting…';
}
function showConnLost() {
  connText();
  openMenuOverlay('conn-overlay');
}
function hideConnLost() {
  closeMenuOverlay('conn-overlay');
  document.getElementById('conn-notice').textContent = '';
  shutdownSent = false;
}
document.getElementById('conn-cancel').onclick = () => {
  closeMenuOverlay('conn-overlay');
  if (APP) { loggedIn = false; toApp({ type: 'disconnect' }); }
  else logout();
};
// A local notice (this client only) is a card like any other message.
function notice(text, ms = 6000, level = 'info') {
  return fbCard({ title: text, text: '', level, timed: ms });
}
// Called by the app.
window.lumacoreApp = {
  // The app moved the full lock surface to another window (or here).
  primaryChanged() {
    if (surface && deviceStatus.locked) surface.update({ mode: HOST?.isPrimary === false ? 'blurred' : 'locked' });
  },
  // Quit Server and Client: Shutdown with its confirmation (Save / Don't Save).
  quitServer() { wsCommand('Shutdown'); },
  // The app wrote a copy to the OS clipboard (ok) or couldn't.
  copied(ok) { LumaKit.clipboard.appCopied(ok); },
  notice(text) {
    if (document.getElementById('conn-overlay').classList.contains('open'))
      document.getElementById('conn-notice').textContent = text;
    else notice(text);
  },
};

// ── Feedback (one system: progress, flash, messages, statuses) ────────────
// GET /api/feedback: this profile's notification settings + what is active;
// the `feedback` feed: every feedback event for this user (sysmon lines with a
// `feedback`). The server sets importance; here it decides the surface:
// critical → pop-up always, important → never hidden (none → card),
// normal → the user's setting, info → nothing (System Monitor only).
const fb = { seq: 0, sub: null, live: false, settings: null, progress: new Map(), statuses: new Map(), lastCritical: null };
const FB_ICON = { info: 'info', warn: 'triangle-alert', error: 'octagon-alert', alert: 'octagon-alert' };
const FB_STATUS_STYLE = {
  black: ['alert', 'Blackout is active', 'power'],
  parked: ['parked', 'Channels parked', 'circle-parking'], sacn: ['enabled', 'sACN output running', 'radio'],
  watches: ['active', 'Watches active', 'activity'], debug: ['alert', 'Debug mode is on', 'terminal'],
};

// ── Client feeds (decisions §30 "12b2", "12d"): one /ws/feeds socket per page ──
// Everything live (the station view for the lock screen, feedback, System
// Monitor, Realtime, DMX, pools, the pool editor, the menus, Backup, the
// screen's events) is a subscription on the kit's FeedClient — no SSE, no
// poll. A window or menu subscribes while it shows and closes its
// subscription when it goes. The socket opens before a login (the open
// `station` feed); `auth` logs it in and every subscription stays.
let feedClient = null;
function feeds() {
  // A station updated under this page (another client protocol): reload.
  return feedClient ??= new LumaKit.feeds.FeedClient({ onProtocol: () => location.reload() });
}
// The login token this page holds (the app's, else the cookie's).
function myToken() {
  if (APP?.token) return APP.token;
  const m = document.cookie.match(/(?:^|;\s*)lumacore_token=([^;]+)/);
  return m ? m[1] : null;
}

async function loadFeedbackSettings() {
  try {
    const r = await fetch('/api/feedback');
    if (!r.ok) return;
    const d = await r.json();
    fb.settings = d.settings;
    for (const line of d.active || []) fbHandle(line);
  } catch(_) {}
}

function feedbackConnect() {
  if (fb.sub) return;
  fb.sub = feeds().sub('feedback', {}, {
    batch: m => { fb.live = true; for (const line of m.items || []) fbHandle(line); },
  });
}

function fbSurface(f, level) {
  if (f.importance === 'critical') return 'popup';
  if (f.importance === 'info') return 'none';
  const key = `${f.category}.${level}`;
  let s = fb.settings?.surfaces?.[key] ?? ({ warn: 'card', error: 'card', alert: 'popup' }[level] || 'none');
  if (f.importance === 'important' && s === 'none') s = 'card';
  return s;
}

function fbHandle(line) {
  const f = line?.feedback;
  if (!f) return;
  // Progress ticks and statuses repeat their id/key; messages are one-shot.
  if (f.kind === 'message' || f.kind === 'flash') {
    if (line.seq <= fb.seq) return;
    fb.seq = line.seq;
  }
  if (f.kind === 'progress') return fbProgress(f);
  if (f.kind === 'flash') return fbFlash(f.title);
  if (f.kind === 'status') {
    if (f.active) fb.statuses.set(f.key, f); else fb.statuses.delete(f.key);
    if (barStatus) renderStatus(barStatus);
    return;
  }
  // message
  if (f.importance === 'critical') {
    fb.lastCritical = { title: f.title, at: Date.now() };
    // The shell may close a moment before the feed brings the reason.
    if (document.getElementById('conn-overlay').classList.contains('open')) connText();
    // The station is going down (a Shutdown answered here, elsewhere or by
    // its countdown): the app goes back to its server list afterwards.
    if (f.title === 'Server shutting down') {
      shutdownSent = true;
      if (APP && !powerSent) { powerSent = true; toApp({ type: 'power', command: 'Shutdown' }); }
    }
  }
  const surface = fbSurface(f, line.level);
  if (surface === 'popup') fbPopup(f, line.level);
  else if (surface === 'card') fbCard({ title: f.title, text: f.text, level: line.level, time: line.time_ms });
}

function fbProgress(f) {
  const box = document.getElementById('fb-progress');
  let el = fb.progress.get(f.id);
  if (!el) {
    if (!f.active) return;
    el = document.createElement('div');
    el.className = 'fb-pill';
    el.innerHTML = '<div class="fb-fill"></div><div class="fb-label"></div>';
    el.dataset.since = Date.now();
    box.appendChild(el);
    fb.progress.set(f.id, el);
  }
  el.querySelector('.fb-label').textContent = f.text ? `${f.title} ${f.text}` : f.title;
  const p = f.progress;
  const fill = el.querySelector('.fb-fill');
  if (p?.range && p.range[1] > p.range[0]) {
    fill.style.width = `${Math.max(0, Math.min(1, (p.value - p.range[0]) / (p.range[1] - p.range[0]))) * 100}%`;
  } else fill.style.width = '0';
  if (!f.active) {
    // Visible at least a moment, then fade (gone when done).
    const left = Math.max(0, 600 - (Date.now() - Number(el.dataset.since)));
    fb.progress.delete(f.id);
    setTimeout(() => { el.classList.add('done'); setTimeout(() => el.remove(), 300); }, left);
  }
}

let fbFlashTimer = null;
function fbFlash(text) {
  const el = document.getElementById('fb-flash');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(fbFlashTimer);
  fbFlashTimer = setTimeout(() => el.classList.remove('on'), 1100);
}

function fbCard({ title, text = '', level = 'info', time = Date.now(), timed }) {
  const box = document.getElementById('fb-cards');
  const card = document.createElement('div');
  card.className = `fb-card ${level}`;
  card.innerHTML = '<span class="fb-ico"></span><span class="fb-title"></span><button class="fb-x" title="Close"><luma-icon name="x"></luma-icon></button><span class="fb-text"></span><span class="fb-meta"></span>';
  card.querySelector('.fb-ico').innerHTML = LumaKit.icon(FB_ICON[level] || FB_ICON.info);
  card.querySelector('.fb-title').textContent = title;
  card.querySelector('.fb-text').textContent = text;
  card.querySelector('.fb-meta').textContent = new Date(time).toLocaleTimeString();
  card.querySelector('.fb-x').onclick = () => card.remove();
  box.prepend(card);
  while (box.childElementCount > 6) box.lastElementChild.remove();
  const permanent = fb.settings?.mode === 'permanent' && timed == null;
  if (!permanent) setTimeout(() => card.remove(), timed ?? fb.settings?.timed_ms ?? 5000);
  return card;
}

const fbPopups = [];
function fbPopup(f, level) {
  fbPopups.push({ f, level });
  if (fbPopups.length === 1) fbShowPopup();
}
// A critical or OK / Confirm message: the kit's standard dialog (decisions
// §30 "12b"), one after the other.
async function fbShowPopup() {
  const next = fbPopups[0];
  if (!next) return;
  await LumaKit.dialog.openDialog({
    title: next.f.title,
    meta: next.level === 'alert' ? 'critical' : next.level,
    meta_tone: next.level === 'alert' ? 'alert' : next.level === 'info' ? null : 'warn',
    text: next.f.text || '',
    buttons: [{ label: 'OK', value: true, kind: 'primary' }],
    primary: 0, cancel: 0,
  });
  syncKeyboardFocus();
  fbPopups.shift();
  fbShowPopup();
}

// ── UI keys (decisions §17) ─────────────────────────────────────────────────
// Buttons with `data-key="<id>"` report gestures — press, release, hold,
// releaseafterhold, double — and whether Meow is on (latched with 🐾, or the
// profile's Meow modifier held); the server runs the key's command line (GET
// /api/ui-keys: definitions + this profile's timing). The press acts at
// once, a second press within the window is the double press. The press may
// open an overlay over the button, so a second click at the same spot within
// the window counts wherever it lands.
const uiKeys = { defs: new Map(), double: 300, hold: 500, meowKey: 'Shift', meowLatched: false, last: null, holdTimer: null, held: false, down: null };
const GESTURE_FIELD = { press: 'press', release: 'release', hold: 'hold', releaseafterhold: 'release_after_hold', double: 'double_press' };
// Does key `id` have a command line for `gesture` (plain or Meow)?
function keyHas(id, gesture) {
  const def = uiKeys.defs.get(id?.toLowerCase());
  const f = GESTURE_FIELD[gesture];
  return !!(def && (def[f] || def.meow?.[f]));
}
function meowHeld(e) {
  return uiKeys.meowLatched || !!(e && { alt: e.altKey, ctrl: e.ctrlKey, shift: e.shiftKey }[uiKeys.meowKey.toLowerCase()]);
}
function setMeowLatch(on) {
  uiKeys.meowLatched = on;
  updateStrip();
}
// The strip's Meow (decisions top-bar-status-strip): a tap latches, as the sidebar button did.
strip.addEventListener('meow', () => setMeowLatch(!uiKeys.meowLatched));
// The strip's Meow lights while the profile's Meow key is held (decisions
// §30 "12b2"); a window losing focus lets go of it.
const MEOW_KEY_NAME = { Alt: 'Alt', Ctrl: 'Control', Shift: 'Shift' };
let meowHeldNow = false;
function setMeowHeld(on) { meowHeldNow = on; updateStrip(); }
// On a Mac the F-keys are media keys unless fn is held (or "Use F1, F2, etc.
// keys as standard function keys" is on): say so once, the first time Meow is
// held on a device that never sent an F-key. LumaCore changes no OS setting.
const IS_MAC = /Mac/.test(navigator.userAgentData?.platform || navigator.platform || '');
let fKeySeen = false;
function fnHint() {
  if (!IS_MAC || fKeySeen) return;
  try { if (localStorage.getItem('lumacore.fnHint')) return; localStorage.setItem('lumacore.fnHint', '1'); } catch(_) { return; }
  fbCard({ title: 'On a Mac, F9–F12 need fn', level: 'info', timed: 12000,
    text: 'Hold fn (the globe key), or turn on System Settings › Keyboard › Keyboard Shortcuts › Function Keys › "Use F1, F2, etc. keys as standard function keys".' });
}
window.addEventListener('keydown', e => {
  if (/^F([1-9]|1[0-2])$/.test(e.key)) fKeySeen = true;
  if (e.key === MEOW_KEY_NAME[uiKeys.meowKey]) { setMeowHeld(true); if (!e.repeat) fnHint(); }
}, true);
window.addEventListener('keyup', e => { if (e.key === MEOW_KEY_NAME[uiKeys.meowKey]) setMeowHeld(false); }, true);
window.addEventListener('blur', () => setMeowHeld(false));

async function loadUiKeys() {
  try {
    const r = await fetch('/api/ui-keys');
    if (!r.ok) return;
    const d = await r.json();
    uiKeys.double = d.double_click_ms || 300;
    uiKeys.hold = d.hold_ms || 500;
    LumaKit.pointer.setHoldTime(uiKeys.hold);
    LumaKit.pointer.setDoubleTime?.(uiKeys.double);
    uiKeys.meowKey = d.meow_key || 'Shift';
    uiKeys.holdFollows = d.hold_follows ?? true;
    pools.drag = d.pool_drag || 'Move';
    uiKeys.defs = new Map((d.keys || []).map(k => [k.id.toLowerCase(), k]));
    renderKeyLeds(ledModes);
  } catch(_) {}
}

// Without a server connection the core keys still open their menus.
const UI_KEY_FALLBACK = { menu: () => openMenu(), power: () => openPowerMenu() };
function keyAction(key, gesture, e) {
  const meow = meowHeld(e);
  if (ws?.readyState === WebSocket.OPEN) wsSend({ type: 'key_action', key, gesture, meow });
  else if (gesture === 'press') UI_KEY_FALLBACK[key]?.();
  // A latched Meow lasts for one key: it ends with the key's last gesture.
  if (uiKeys.meowLatched && gesture !== 'press' && gesture !== 'hold') setMeowLatch(false);
  else if (uiKeys.meowLatched && gesture === 'press' && !keyHas(key, 'release') && !keyHas(key, 'double')) setMeowLatch(false);
}

document.addEventListener('pointerdown', e => {
  const el = e.target.closest?.('[data-key]');
  clearTimeout(uiKeys.holdTimer);
  uiKeys.held = false;
  uiKeys.down = null;
  if (!el || e.button !== 0) return;
  const key = el.dataset.key;
  uiKeys.down = key;
  if (!keyHas(key, 'hold') && !keyHas(key, 'releaseafterhold')) return;
  if (!LumaKit.pointer.claim(e)) return;
  // tidy: hold-ok (UI keys: Press / Release / Hold / ReleaseAfterHold / DoublePress are their own gesture, timed by the profile's HoldTime)
  LumaKit.pointer.showRing(e.clientX, e.clientY, LumaKit.pointer.holdTime());
  uiKeys.holdTimer = setTimeout(() => {
    LumaKit.pointer.hideRing();
    uiKeys.held = true;
    uiKeys.last = null;
    if (keyHas(key, 'hold')) keyAction(key, 'hold', e);
  }, LumaKit.pointer.holdTime());
}, true);
// Release: `releaseafterhold` when the hold fired, else `release`.
document.addEventListener('pointerup', e => {
  clearTimeout(uiKeys.holdTimer);
  if (uiKeys.down) LumaKit.pointer.hideRing();
  const key = uiKeys.down;
  uiKeys.down = null;
  if (!key) return;
  if (uiKeys.held) { if (keyHas(key, 'releaseafterhold')) keyAction(key, 'releaseafterhold', e); }
  else if (keyHas(key, 'release')) setTimeout(() => keyAction(key, 'release', e)); // after the click's press
}, true);
document.addEventListener('pointercancel', () => { clearTimeout(uiKeys.holdTimer); uiKeys.down = null; }, true);

document.addEventListener('click', e => {
  const now = performance.now();
  const last = uiKeys.last;
  // Second click of a double press: same spot, inside the window — even if
  // the first press opened something on top of the button.
  if (last && now - last.t <= uiKeys.double && Math.hypot(e.clientX - last.x, e.clientY - last.y) <= 12
      && keyHas(last.key, 'double')) {
    e.preventDefault();
    e.stopPropagation();
    uiKeys.last = null;
    keyAction(last.key, 'double', e);
    return;
  }
  const el = e.target.closest?.('[data-key]');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  if (uiKeys.held) { uiKeys.held = false; return; } // the hold already ran
  uiKeys.last = { key: el.dataset.key, t: now, x: e.clientX, y: e.clientY };
  keyAction(el.dataset.key, 'press', e);
}, true);

// ── Key forwarding ─────────────────────────────────────────────────────────
// Every key goes to the server as a DOM key event, whichever panel has focus.
// The server's session decides: typing → command line, navigation keys →
// focused panel (returned as `ui` events) or the terminal.
function shouldForward(e) {
  if (e.isComposing || e.metaKey) return false;                 // IME, Cmd shortcuts (copy/paste/quit)
  if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Dead', 'Unidentified'].includes(e.key)) return false;
  if (LumaKit.dialog.dialogOpen() || document.querySelector('.mo-overlay.open, #picker-overlay.open, .lc-kp-scrim, .lc-pick-scrim, .lc-set-scrim')) return false;
  if (!document.getElementById('ctx').hidden) return false;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' ||
            (t.tagName === 'TEXTAREA' && !t.classList.contains('xterm-helper-textarea')))) return false;
  return true;
}
// In F12 full screen, typing floats the command line in (decisions §30
// "12b2"); Please or Esc sends it away again, the bars stay hidden.
function floatLine(e) {
  if (!sidebars.full) return;
  const body = document.body;
  if (e.key === 'Escape' || e.key === 'Enter') {
    if (body.classList.contains('typing')) setTimeout(() => { body.classList.remove('typing'); window.dispatchEvent(new Event('resize')); }, 120);
  } else if (e.key.length === 1 || e.key === 'Backspace') {
    if (!body.classList.contains('typing')) { body.classList.add('typing'); window.dispatchEvent(new Event('resize')); }
  }
}
window.addEventListener('keydown', e => {
  if (!sidebars.full || e.metaKey || e.ctrlKey || e.isComposing) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || (t.tagName === 'TEXTAREA' && !t.classList.contains('xterm-helper-textarea')))) return;
  if (LumaKit.dialog.dialogOpen() || document.querySelector('.mo-overlay.open, .lc-set-scrim, .lc-kp-scrim, .lc-pick-scrim')) return;
  floatLine(e);
}, true);
function forwardKey(e) {
  // The suggestion list above the command line bar takes Tab, ↑ ↓ and Esc
  // while it is open (decisions §30 "12b2").
  if (barSuggest.key(e)) return;
  const mods = { ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey };
  // A latched Meow (🐾) holds the profile's Meow modifier for this one key.
  if (uiKeys.meowLatched) { mods[uiKeys.meowKey.toLowerCase()] = true; setMeowLatch(false); }
  wsSend({ type: 'key', key: e.key, ...mods, repeat: e.repeat });
  if (!e.repeat) keyDown(e.key, mods);
}
// Keyboard keys bound to UI keys get Hold / Release / ReleaseAfterHold too
// (decisions §17, §29): `key_hold` after the profile's hold time while the
// key is still down, `key_up` when it comes up. The station runs the bound
// key's line for the gesture (nothing when it has none).
const keysDown = new Map();
function keyDown(key, mods) {
  clearTimeout(keysDown.get(key)?.timer);
  const down = { mods, held: false };
  down.timer = setTimeout(() => {
    down.held = true;
    wsSend({ type: 'key_hold', key, ...mods });
  }, uiKeys.hold);
  keysDown.set(key, down);
}
document.addEventListener('keyup', e => {
  // Print Screen often only reaches the page as keyup (Windows): send it
  // then, so its binding (Screenshot) still runs.
  if (e.key === 'PrintScreen' && !keysDown.has(e.key) && shouldForward(e)) {
    wsSend({ type: 'key', key: e.key, ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, repeat: false });
    return;
  }
  const down = keysDown.get(e.key);
  if (!down) return;
  clearTimeout(down.timer);
  keysDown.delete(e.key);
  wsSend({ type: 'key_up', key: e.key, ...down.mods, held: down.held });
}, true);
window.addEventListener('blur', () => {
  for (const [key, down] of keysDown) {
    clearTimeout(down.timer);
    wsSend({ type: 'key_up', key, ...down.mods, held: down.held });
  }
  keysDown.clear();
});
// Terminal focused: xterm sees the key first. Swallow it there and forward.
function xtermKey(e) {
  if (!shouldForward(e)) return true;
  if (e.type === 'keydown') { forwardKey(e); e.preventDefault(); e.lumaForwarded = true; }
  return false;
}
// Panel focused: xterm is blurred, keys land on the document.
document.addEventListener('keydown', e => {
  if (e.lumaForwarded) return;
  if (!shouldForward(e)) return;
  forwardKey(e);
  e.preventDefault();
});

// ── Window kinds ───────────────────────────────────────────────────────────
// Window types this UI can render. Labels, icons, categories and settings are
// refreshed from the server registry (GET /api/window-types =
// Root.Resources.WindowTypes); `windowTypes` keeps the full list for the picker.
const TAB_KINDS = {
  terminal: { label: 'Terminal', ico: 'terminal', build: buildTerminalPanel },
  groups:   { label: 'Groups',   ico: 'layout-grid', build: win => buildPoolPanel(win, 'Group'), onUi: poolUi },
  sequences: { label: 'Sequences', ico: 'list-ordered', build: win => buildPoolPanel(win, 'Sequence'), onUi: poolUi },
  // One window type per pool (decisions 0287).
  macros:   { label: 'Macros', ico: 'wand-sparkles', build: win => buildPoolPanel(win, 'Macro'), onUi: poolUi },
  views:    { label: 'Views', ico: 'layout-dashboard', build: win => buildPoolPanel(win, 'View'), onUi: poolUi },
  // The one preset pool, following the programmer's feature group (decisions 0288).
  presets:  { label: 'Presets', ico: 'palette', build: win => buildPoolPanel(win, 'Preset'), onUi: poolUi },
  sequence: { label: 'Sequence', ico: 'list-start', build: buildSequencePanel },
  tags:     { label: 'Tags', ico: 'tag', build: buildTagsPanel },
  empty:    { label: 'Empty',    ico: 'plus', build: buildEmptyPanel },
  sysmon:   { label: 'System Monitor', ico: 'scroll-text', build: buildSysmonPanel },
  dmx:      { label: 'DMX', ico: 'grid-3x3', build: buildDmxPanel },
  devices:  { label: 'Device Sheet', ico: 'columns-3', build: buildDevicePanel },
  // NAV's tree and inspector as a window (decisions 0292).
  tree:     { label: 'Tree', ico: 'list-tree', build: buildTreePanel },
  // The attribute rules in order (decisions 0294).
  rules:    { label: 'Rules', ico: 'list-ordered', build: buildRulesPanel },
  realtime: { label: 'Realtime', ico: 'activity', build: buildRealtimePanel },
  // The kit's Showroom (decisions §30): every element in every state.
  showroom: { label: 'Showroom', ico: 'showroom', build: () => LumaKit.showroom() },
};
let windowTypes = [];

function buildTerminalPanel(win) {
  const t = termFor(win.no);
  const cfg = winSettings(win);
  t.term.options.fontSize = cfg.font_size || TERM_OPTS.fontSize; // 0 = Default
  t.term.options.cursorBlink = cfg.cursor_blink ?? true;
  return t.host;
}

// An empty pane (new split): an empty screen area — pick a window for it.
function buildEmptyPanel(win) {
  const el = document.createElement('div');
  el.className = 'empty-pane';
  const btn = document.createElement('button');
  btn.className = 'empty-add';
  btn.innerHTML = '<span class="empty-plus"><luma-icon name="plus"></luma-icon></span>Add window';
  btn.onclick = () => openPicker({ mode: 'fill', win: win.no });
  el.appendChild(btn);
  return el;
}

// ── Split tree ─────────────────────────────────────────────────────────────
// Client model of a screen (Root.Runtime.Sessions.<user>.Screens.<n>):
//   layout.root:    { type:'split', dir:'h'|'v', ratio, children:[a, b] }   h = side by side, v = stacked
//                   { type:'leaf', wins:[window no…], active }               a pane; its windows are tabs
//   layout.windows: { <no>: { no, kind, label, settings } }
// The server owns the canonical state. Layout edits (split, resize, close, tab
// switch, settings) are PUT to /api/screens/<n>/layout; creating,
// retyping and labelling windows are commands (Store Window …) so they echo in
// the terminal. `screen_changed` SSE events are applied by revision.
let layout = defaultLayout();
let liveScreen = null;  // our screen number
let viewUser = null;     // its owner
let revision = 0;        // last revision we applied or saved
let saveChain = Promise.resolve();

function newWindow(no, kind) { return { no, kind, label: null, settings: {} }; }

function defaultLayout() {
  return {
    root: { type: 'leaf', wins: [1, 2], active: 0 },
    windows: { 1: newWindow(1, 'terminal'), 2: newWindow(2, 'groups') },
  };
}

function nextWinNo() { return Math.max(0, ...Object.keys(layout.windows).map(Number)) + 1; }

// Coerce a server tree into a valid one: drop unknown windows and empty
// leaves, collapse half-empty splits.
function normalizeNode(n, windows, seen) {
  if (n?.type === 'split' && Array.isArray(n.children) && n.children.length === 2) {
    const a = normalizeNode(n.children[0], windows, seen);
    const b = normalizeNode(n.children[1], windows, seen);
    if (!a || !b) return a || b;
    const r = Number(n.ratio);
    return { type: 'split', dir: n.dir === 'v' ? 'v' : 'h', ratio: r > 0 && r < 1 ? r : 0.5, children: [a, b] };
  }
  if (n?.type === 'leaf') {
    const wins = (n.windows || []).filter(no => TAB_KINDS[windows[no]?.kind] && !seen.has(no));
    wins.forEach(no => seen.add(no));
    if (!wins.length) return null;
    return { type: 'leaf', wins, active: Math.min(Math.max(0, n.active | 0), wins.length - 1) };
  }
  return null;
}

// Client tree → server layout + windows (only windows the tree shows). The
// page owns only the structure: a window the station already has (same number
// and kind) goes as {no, kind} — its settings, label, colour, scroll and preset
// stay the station's (they change only by commands). A new window (a split's
// empty pane) carries what it has.
function toServer() {
  const windows = {};
  const walk = n => {
    if (n.type === 'split') return { type: 'split', dir: n.dir, ratio: n.ratio, children: n.children.map(walk) };
    for (const no of n.wins) {
      const w = layout.windows[no];
      windows[no] = serverKinds.get(Number(no)) === w.kind ? { no, kind: w.kind }
        : { no, kind: w.kind, label: w.label || undefined, settings: w.settings || {} };
    }
    return { type: 'leaf', windows: [...n.wins], active: n.active };
  };
  return { root: walk(layout.root), windows };
}

// The station's windows (number → kind) as last applied or saved.
let serverKinds = new Map();

function applySession(s) {
  revision = s.revision;
  const windows = {};
  serverKinds = new Map();
  for (const [no, w] of Object.entries(s.windows || {})) {
    windows[no] = { no: Number(no), kind: w.kind, label: w.label || null, settings: w.settings || {}, scroll: w.scroll };
    serverKinds.set(Number(no), w.kind);
  }
  const root = normalizeNode(s.root, windows, new Set());
  layout = root ? { root, windows } : defaultLayout();
  stationMax(s.maximized);
  renderLayout();
  if (pendingFocus != null) focusWindow(pendingFocus);
}

// The user this client works as (from the server's status; changes on Login).
// Until clients authenticate (thin client phase 2) the HTTP endpoints take it
// as a parameter.
let currentUser = null;
// The screen config this machine uses for this user (client-local, like the
// thin client will keep per server + user); null = the user's default.
function cfgKey() { return `lumacore.screenConfig.${currentUser || 'Admin'}`; }
// The device's own setting wins (decisions §30 "12c2": `Set Device
// ScreenConfig <n>`, kept by the station in Status.device.screen_config);
// Follow user falls back to this machine's last choice (`ScreenConfig n`).
function screenConfigChoice() {
  if (deviceStatus.screen_config) return deviceStatus.screen_config;
  if (APP) return APP.config || null;
  try { return Number(localStorage.getItem(cfgKey())) || null; } catch(_) { return null; }
}
let loadedConfig;          // the config the screen was opened with (undefined: not yet)

// Join our screen: `?vs=<n>` for a specific screen, else screen
// `?screen=<n>` (default 1) of this machine's screen config — live if it is
// open elsewhere, otherwise laid out from the show.
async function loadLayout() {
  const params = new URLSearchParams(location.search);
  const join = Number(params.get('vs')) || null;
  const screen = Number(params.get('screen')) || 1;
  loadedConfig = screenConfigChoice();
  try {
    const r = await fetch('/api/screens', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ join, config: screenConfigChoice() || undefined, screen }),
    });
    if (r.ok) {
      const session = await r.json();
      liveScreen = session.no;
      loadKeyboardMode();
      viewUser = session.user;
      wsSend({ type: 'live_screen', no: liveScreen });
      windowsSubscribe();
      encoderSubscribe();
      if (started) screenSubscribe();
      applySidebars();
      return applySession(session);
    }
  } catch(_) {}
  layout = defaultLayout();
  renderLayout();
}

// One layout save, on the revision this page has when it goes out (after the
// saves before it). A stale revision (409: the screen changed meanwhile) is
// sent again once on the station's revision when only what windows hold
// changed (a `Set Self`, a `Label Self` — the PUT keeps those anyway), then
// the page takes the station's screen. Refused otherwise (the windows
// themselves changed, a locked device 423, …): the page shows the station's
// screen again and says why; a refused save never looks saved.
function saveLayout() {
  if (!liveScreen) return;
  const body = toServer();
  const base = new Map(serverKinds);
  const no = liveScreen;
  const sameWindows = s => {
    const wins = Object.values(s?.windows || {});
    return wins.length === base.size && wins.every(w => base.get(Number(w.no)) === w.kind);
  };
  saveChain = saveChain.then(async () => {
    let r, reply, retried = false;
    for (;;) {
      try {
        r = await fetch(`/api/screens/${no}/layout`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Luma-Device': DEVICE },
          body: JSON.stringify({ ...body, revision }),
        });
      } catch(_) {
        notice('Layout not saved: the station can\'t be reached.', 6000, 'warn');
        return;
      }
      reply = await r.json().catch(() => ({}));
      if (r.status === 409 && !retried && sameWindows(reply.screen)) {
        retried = true;
        revision = reply.screen.revision;
        continue;
      }
      break;
    }
    if (r.ok) {
      revision = Math.max(revision, reply.revision);
      serverKinds = new Map(Object.values(body.windows).map(w => [Number(w.no), w.kind]));
      // After a retry: what the windows hold changed meanwhile — take it.
      if (retried && no === liveScreen) {
        try {
          const s = await fetch(`/api/screens/${no}`);
          if (s.ok) applySession(await s.json());
        } catch(_) {}
      }
      return;
    }
    notice(reply.message || `Layout not saved (${r.status}).`, 6000, 'warn');
    if (no !== liveScreen) return;
    if (reply.screen) return applySession(reply.screen);
    try {
      const s = await fetch(`/api/screens/${no}`);
      if (s.ok) applySession(await s.json());
    } catch(_) {}
  });
}

// SSE: someone changed a screen. Wait for our own saves first so our
// echoes are recognised by revision.
function onScreenChanged(ev) {
  if (ev.no !== liveScreen) return;
  saveChain = saveChain.then(async () => {
    if (ev.revision <= revision) return;
    try {
      const r = await fetch(`/api/screens/${liveScreen}`);
      if (r.ok) {
        const session = await r.json();
        if (session.revision > revision) applySession(session);
      }
    } catch(_) {}
  });
}

function commit() { renderLayout(); saveLayout(); }

function findParent(node, target) {
  if (node.type !== 'split') return null;
  for (const c of node.children) {
    if (c === target) return node;
    const p = findParent(c, target);
    if (p) return p;
  }
  return null;
}

function replaceNode(target, replacement) {
  if (layout.root === target) { layout.root = replacement; return; }
  const p = findParent(layout.root, target);
  if (p) p.children[p.children.indexOf(target)] = replacement;
}
