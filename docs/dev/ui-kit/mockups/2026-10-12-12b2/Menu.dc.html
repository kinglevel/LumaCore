<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Daylight","Night"],"default":"Dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 'users' }; }
  renderVals() {
    const P = {
      Dark:{bg:'#121212',surface:'#1c1c1c',raised:'#303030',line:'#424242',text:'#d1d1d1',dim:'#787878',gap:'#080808',accent:'#9a7a08',info:'#758ba0',ok:'#00a60a',warn:'#c27a12',alert:'#e10000',prog:'#d86a7c',blind:'#8a80c8',park:'#3f9a90',onAccent:'#f3ecd3'},
      Daylight:{bg:'#e4e4e4',surface:'#f0f0f0',raised:'#fbfbfb',line:'#bdbdbd',text:'#161616',dim:'#5a5a5a',gap:'#d4d4d4',accent:'#7c6200',info:'#3d5a78',ok:'#007a07',warn:'#9a5600',alert:'#c00000',prog:'#a8384e',blind:'#5a4fb0',park:'#1f756c',onAccent:'#ffffff'},
      Night:{bg:'#0b0505',surface:'#140909',raised:'#1d0d0d',line:'#2e1515',text:'#d07a68',dim:'#8a4a40',gap:'#050202',accent:'#e0862e',info:'#b0705f',ok:'#9aa040',warn:'#e0862e',alert:'#ff4a3a',prog:'#e0607a',blind:'#9a6ab0',park:'#4a9a8a',onAccent:'#0b0505'}
    };
    const t = P[this.props.theme ?? 'Dark'];
    const s = this.state;
    const tiles = {"patch": true, "livepatch": true, "connector": true, "desk": true, "network": false, "inout": true, "dmx": false, "settings": true, "backup": false, "quicksave": false, "creator": true, "prefs": true, "luma": false, "users": false, "screens": false};
    const opens = { network: 'Network', dmx: 'DMX Protocols', backup: 'Backup', quicksave: 'SaveShow', luma: 'LumaSessions', users: 'Users & Profiles', screens: 'Screens overview' };
    const tl = {};
    for (const id of Object.keys(tiles)) {
      const off = tiles[id], on = s.sel === id, please = id === 'quicksave';
      tl[id] = { off, pick: () => this.setState({ sel: id }),
        bg: off ? 'transparent' : (please ? 'color-mix(in srgb, ' + t.ok + ' 12%, ' + t.raised + ')' : t.raised),
        fg: off ? 'color-mix(in srgb, ' + t.dim + ' 70%, transparent)' : t.text,
        border: on ? t.accent : (please ? t.ok : (off ? t.line : t.line)) };
    }
    const what = opens[s.sel];
    return { t, tl, lastLine: what === 'SaveShow' ? '› SaveShow' : '› opens ' + what + ' — its title shows the same icon' };
  }
}
</script>
