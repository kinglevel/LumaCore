<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Window settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9a7a08}a:hover{color:#c9a227}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 40px; background: color-mix(in srgb, {{t.bg}} 70%, #000); color: {{t.text}}; font-family: 'Myriad Pro', 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; gap: 24px; position: relative">
  <section style="width: 980px; flex-shrink: 0; display: flex; flex-direction: column; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}; overflow: hidden">
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 18px; border-bottom: 1px solid {{t.line}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path> <circle cx="12" cy="12" r="3"></circle></svg><span style="font-size: 18px; font-weight: 500; margin-right: auto">{{winTitle}}</span>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 5px; border: 1px solid {{t.line}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; font-size: 14px">Load preset</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 5px; border: 1px solid {{t.line}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; font-size: 14px">Save preset</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 5px; border: 1px solid color-mix(in srgb, {{t.alert}} 55%, transparent); background: color-mix(in srgb, {{t.alert}} 14%, {{t.raised}}); color: {{t.alert}}; font: inherit; font-size: 14px">Delete window</button>
      <button type="button" aria-label="Close" style="width: 50px; height: 50px; border: none; background: none; color: {{t.text}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path> <path d="m6 6 12 12"></path></svg></button>
    </div>
    <div style="flex: 1; display: flex; min-height: 0">
      <sc-if value="{{hasTabs}}" hint-placeholder-val="{{ true }}">
        <div style="width: 150px; flex-shrink: 0; border-right: 1px solid {{t.line}}; display: flex; flex-direction: column">
          <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
            <button type="button" onClick="{{tb.pick}}" style="height: 56px; border: none; border-bottom: 1px solid {{t.line}}; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; font-size: 15px; text-align: left; padding: 0 16px; box-shadow: {{tb.mark}}">{{tb.name}}</button>
          </sc-for>
        </div>
      </sc-if>
      <div style="flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
            <button type="button" onClick="{{c.tap}}" style="height: 76px; border-radius: 6px; border: 1px solid {{c.border}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between">
              <span style="font-size: 12px; color: {{t.dim}}; display: flex; justify-content: space-between; width: 100%">{{c.label}}<span style="color: {{c.kc}}">{{c.kind}}</span></span>
              <span style="font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 8px"><span style="width: {{c.swW}}px; height: 18px; border-radius: 3px; background: {{c.sw}}; border: {{c.swB}}"></span>{{c.value}}<span style="font-size: 12px; font-weight: 400; color: {{t.dim}}">{{c.note}}</span></span>
            </button>
          </sc-for>
        </div>
        <div class="mono" style="margin-top: auto; padding: 10px 12px; border-radius: 5px; background: {{t.bg}}; font-size: 13px; color: {{t.dim}}">{{lastLine}}</div>
      </div>
    </div>
  </section>
  <section style="flex: 1; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; color: {{t.dim}}">Window type (the shell is the same; tabs come from the settings' sections)</span>
    <sc-for list="{{types}}" as="ty" hint-placeholder-count="4">
      <button type="button" onClick="{{ty.pick}}" style="height: 60px; border-radius: 6px; border: 2px solid {{ty.border}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; text-align: left; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{ty.name}}</span><span style="font-size: 12px; color: {{t.dim}}">{{ty.sub}}</span></button>
    </sc-for>
  </section>
  <sc-if value="{{pickOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: center; justify-content: center">
      <div style="width: 440px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}; overflow: hidden; display: flex; flex-direction: column">
        <div style="height: 52px; display: flex; align-items: center; padding: 0 6px 0 16px; border-bottom: 1px solid {{t.line}}"><span style="font-size: 17px; font-weight: 500; margin-right: auto">{{pickTitle}}</span><button type="button" onClick="{{closePick}}" aria-label="Close" style="width: 48px; height: 48px; border: none; background: none; color: {{t.text}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path> <path d="m6 6 12 12"></path></svg></button></div>
        <div style="margin: 10px 12px; height: 44px; border-radius: 5px; border: 1px solid {{t.line}}; background: {{t.bg}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{t.dim}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path> <circle cx="11" cy="11" r="8"></circle></svg><span style="font-size: 15px">Filter</span></div>
        <div style="display: flex; flex-direction: column; padding: 0 12px 12px; gap: 6px">
          <sc-for list="{{pickItems}}" as="it" hint-placeholder-count="4">
            <button type="button" onClick="{{it.pick}}" style="height: 54px; border-radius: 5px; border: 2px solid {{it.border}}; background: {{it.bg}}; color: {{t.text}}; font: inherit; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-align: left"><em style="font-style: normal; width: 28px; color: {{t.dim}}; font-size: 14px">{{it.no}}</em><span style="font-size: 16px; flex: 1">{{it.name}}</span><small style="font-size: 12px; color: {{t.dim}}">{{it.note}}</small></button>
          </sc-for>
        </div>
        <span style="font-size: 12px; color: {{t.dim}}; padding: 0 16px 12px">{{pickNote}}</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Daylight","Night"],"default":"Dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { type: 'groups', tab: 0, dp: 'sel', font: 'Default', cols: 'Fit', pick: null, last: 'Set Window 2 DataPool Selected' }; }
  renderVals() {
    const P = {
      Dark:{bg:'#121212',surface:'#1c1c1c',raised:'#303030',line:'#424242',text:'#d1d1d1',dim:'#787878',gap:'#080808',accent:'#9a7a08',info:'#758ba0',ok:'#00a60a',warn:'#c27a12',alert:'#e10000',prog:'#d86a7c',blind:'#8a80c8',park:'#3f9a90',onAccent:'#f3ecd3'},
      Daylight:{bg:'#e4e4e4',surface:'#f0f0f0',raised:'#fbfbfb',line:'#bdbdbd',text:'#161616',dim:'#5a5a5a',gap:'#d4d4d4',accent:'#7c6200',info:'#3d5a78',ok:'#007a07',warn:'#9a5600',alert:'#c00000',prog:'#a8384e',blind:'#5a4fb0',park:'#1f756c',onAccent:'#ffffff'},
      Night:{bg:'#0b0505',surface:'#140909',raised:'#1d0d0d',line:'#2e1515',text:'#d07a68',dim:'#8a4a40',gap:'#050202',accent:'#e0862e',info:'#b0705f',ok:'#9aa040',warn:'#e0862e',alert:'#ff4a3a',prog:'#e0607a',blind:'#9a6ab0',park:'#4a9a8a',onAccent:'#0b0505'}
    };
    const t = P[this.props.theme ?? 'Dark'];
    const s = this.state;
    const kc = { choice: t.accent, number: t.info, toggle: t.ok, link: t.park, colour: t.prog, text: t.dim };
    const C = (label, value, kind, extra) => ({ label, value, kind, sw: 'transparent', swW: 0, swB: 'none', note: '', tap: () => {}, border: t.line, ...extra });
    const dpLabel = s.dp === 'sel' ? 'Selected DataPool' : s.dp;
    const dpNote = s.dp === 'sel' ? '→ 1 Default' : '';
    const open = (pick) => () => this.setState({ pick });
    const sw = c => ({ sw: c, swW: 28, swB: '1px solid ' + t.line });
    const T = {
      groups: { name: 'Group pool', no: 2, tabs: {
        Pool: [C('Tap action', 'Select', 'choice'), C('DataPool', dpLabel, 'link', { note: dpNote, tap: open('dp'), border: t.accent }), C('First index', '1', 'number')],
        Layout: [C('Columns', s.cols, 'number', { tap: () => { const n = s.cols === 'Fit' ? '12' : 'Fit'; this.setState({ cols: n, last: 'Set Window 2 Columns ' + n }); }, border: t.accent }), C('Rows', 'Fit', 'number'), C('Size', 'Medium', 'choice'), C('Font size', s.font, 'choice', { tap: open('font'), border: t.accent }), C('Show title', 'Yes', 'toggle'), C('Show empty', 'Yes', 'toggle')],
        Colours: [C('Empty', 'Theme', 'colour', sw(t.gap)), C('For all', 'Theme', 'colour', sw(t.ok)), C('For some', 'Theme', 'colour', sw(t.warn)), C('For none', 'Theme', 'colour', sw(t.line))]
      } },
      dmx: { name: 'DMX', no: 4, tabs: {
        Display: [C('Universe', '1 "Front"', 'link', { tap: open('uni'), border: t.accent }), C('View', 'Grid', 'choice'), C('Readout', 'Percent', 'choice'), C('Columns', 'Fit', 'number'), C('Font size', 'Default', 'choice'), C('Level bar', 'Yes', 'toggle')],
        Mask: [C('Only selection', 'No', 'toggle'), C('Show value', 'Yes', 'toggle'), C('Show attribute', 'No', 'toggle'), C('Show ID', 'Yes', 'toggle')]
      } },
      sysmon: { name: 'System Monitor', no: 5, tabs: {
        Display: [C('Level', 'Info', 'choice'), C('Subsystems', 'All', 'choice'), C('Font size', 'Default', 'choice'), C('Auto scroll', 'Yes', 'toggle')]
      } },
      terminal: { name: 'Terminal', no: 1, tabs: {
        Display: [C('Font size', 'Default', 'choice'), C('Cursor blink', 'Yes', 'toggle')]
      } }
    };
    const ty = T[s.type];
    const names = Object.keys(ty.tabs);
    const tab = Math.min(s.tab, names.length - 1);
    const tabs = names.map((n, i) => ({ name: n, pick: () => this.setState({ tab: i }), bg: i === tab ? t.raised : 'transparent', fg: i === tab ? t.text : t.dim, mark: i === tab ? 'inset 3px 0 0 ' + t.accent : 'none' }));
    const cells = ty.tabs[names[tab]].map(c => ({ ...c, kc: kc[c.kind] }));
    const types = Object.keys(T).map(k => ({ name: T[k].name, sub: Object.keys(T[k].tabs).length > 1 ? Object.keys(T[k].tabs).join(' · ') : 'one section → no tab strip', border: k === s.type ? t.accent : t.line, pick: () => this.setState({ type: k, tab: 0 }) }));
    let pickItems = [], pickTitle = '', pickNote = '';
    const row = (no, name, note, on, act) => ({ no, name, note, pick: act, border: on ? t.accent : 'transparent', bg: on ? 'color-mix(in srgb, ' + t.accent + ' 16%, ' + t.raised + ')' : t.raised });
    if (s.pick === 'dp') {
      pickTitle = 'DataPool · Window 2';
      pickNote = 'Selected DataPool follows your Select DataPool; a datapool is stored by its GUID';
      const set = (v, line) => () => this.setState({ dp: v, pick: null, last: line });
      pickItems = [row('', 'Selected DataPool', 'follows you · now 1', s.dp === 'sel', set('sel', 'Set Window 2 DataPool Selected')),
        row(1, 'Default', '3 groups', s.dp === 'Default', set('Default', 'Set Window 2 DataPool 1')),
        row(2, 'Busk', '12 groups', s.dp === 'Busk', set('Busk', 'Set Window 2 DataPool 2')),
        row(3, 'Festival', '40 groups', s.dp === 'Festival', set('Festival', 'Set Window 2 DataPool 3'))];
    } else if (s.pick === 'font') {
      pickTitle = 'Font size · Window 2';
      pickNote = 'Default = the profile\'s size';
      pickItems = ['Default', '10', '12', '14', '16', '18', '20', '24', '28'].slice(0, 6).map(f => row('', f, f === 'Default' ? '14 px' : 'px', s.font === f, () => this.setState({ font: f, pick: null, last: 'Set Window 2 FontSize ' + f })));
    } else if (s.pick === 'uni') {
      pickTitle = 'Universe · Window 4';
      pickNote = 'The show\'s universes';
      pickItems = [row(1, 'Front', '96 ch', true, () => this.setState({ pick: null })), row(2, 'Wash', '320 ch', false, () => this.setState({ pick: null, last: 'Set Window 4 Universe 2' })), row(3, 'Spots', '448 ch', false, () => this.setState({ pick: null, last: 'Set Window 4 Universe 3' }))];
    }
    return { t, tabs, cells, types, hasTabs: names.length > 1, winTitle: 'Settings · Window ' + ty.no + ' · ' + ty.name,
      pickOpen: !!s.pick, pickItems, pickTitle, pickNote, closePick: () => this.setState({ pick: null }), lastLine: '› ' + s.last };
  }
}
</script>
</body>
</html>
