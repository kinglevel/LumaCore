<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Network menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9a7a08}a:hover{color:#c9a227}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 40px; background: color-mix(in srgb, {{t.bg}} 70%, #000); color: {{t.text}}; font-family: 'Myriad Pro', 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex">
  <section style="flex: 1; display: flex; flex-direction: column; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}; overflow: hidden">
    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 6px 0 18px; border-bottom: 1px solid {{t.line}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="1.8" aria-hidden="true"><path d="M12 3v6M5 15v-3h14v3M12 9v3M3 15h4v5H3zM10 15h4v5h-4zM17 15h4v5h-4z"></path></svg>
      <span style="font-size: 18px; font-weight: 500">Network</span>
      <span style="font-size: 14px; color: {{t.dim}}">desk1 · station-local, never in the show</span>
      <span style="margin-left: auto; display: flex; gap: 8px">
        <sc-for list="{{status}}" as="s" hint-placeholder-count="3"><span style="height: 34px; padding: 0 12px; border-radius: 17px; display: flex; align-items: center; gap: 8px; font-size: 13px; background: {{t.raised}}; border: 1px solid {{t.line}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{s.c}}"></span>{{s.label}}</span></sc-for>
      </span>
      <button type="button" aria-label="Close" style="width: 50px; height: 50px; border: none; background: none; color: {{t.text}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="flex: 1; display: flex; min-height: 0">
      <div style="width: 160px; flex-shrink: 0; border-right: 1px solid {{t.line}}; display: flex; flex-direction: column">
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
          <button type="button" onClick="{{tb.pick}}" style="height: 60px; border: none; border-bottom: 1px solid {{t.line}}; background: {{tb.bg}}; color: {{tb.fg}}; font: inherit; font-size: 15px; text-align: left; padding: 0 18px; box-shadow: {{tb.mark}}">{{tb.name}}</button>
        </sc-for>
      </div>
      <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <div style="display: grid; grid-template-columns: 1.1fr 1.4fr 1fr 1fr 1fr; gap: 8px; padding: 0 12px; font-size: 13px; color: {{t.dim}}"><span>Interface</span><span>Address</span><span>LumaSession</span><span>Shell</span><span>HTTP</span></div>
        <sc-for list="{{ifaces}}" as="r" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 1.1fr 1.4fr 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 6px; background: {{t.raised}}; border: 1px solid {{t.line}}">
            <span style="font-size: 16px; font-weight: 500">{{r.name}}</span>
            <span class="mono" style="font-size: 14px; color: {{t.dim}}">{{r.addr}}</span>
            <sc-for list="{{r.svcs}}" as="v" hint-placeholder-count="3">
              <button type="button" onClick="{{v.tap}}" disabled="{{v.locked}}" style="height: 48px; border-radius: 5px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.fg}}; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{v.dot}}"></span>{{v.label}}</button>
            </sc-for>
          </div>
        </sc-for>
        <div class="mono" style="margin-top: auto; padding: 10px 12px; border-radius: 5px; background: {{t.bg}}; font-size: 13px; color: {{t.dim}}">› {{last}}</div>
      </div>
      <aside style="width: 260px; flex-shrink: 0; border-left: 1px solid {{t.line}}; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, {{t.bg}} 35%, {{t.surface}})">
        <span style="font-size: 12px; color: {{t.dim}}; letter-spacing: 0">Actions</span>
        <button type="button" style="height: 60px; border-radius: 6px; border: 1px solid {{t.line}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; font-size: 15px; text-align: left; padding: 0 14px">Store Network…</button>
        <button type="button" style="height: 60px; border-radius: 6px; border: 1px solid {{t.line}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; font-size: 15px; text-align: left; padding: 0 14px">Map network to NIC…</button>
        <span style="font-size: 12px; color: {{t.dim}}; letter-spacing: 0; margin-top: 6px">Settings</span>
        <button type="button" onClick="{{cycleAlone}}" style="height: 60px; border-radius: 6px; border: 1px solid {{t.line}}; background: {{t.raised}}; color: {{t.text}}; font: inherit; text-align: left; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="font-size: 12px; color: {{t.dim}}">Output when alone</span><span style="font-size: 16px; font-weight: 500">{{alone}}</span></button>
        <button type="button" onClick="{{toggleSession}}" style="margin-top: auto; height: 96px; border-radius: 6px; border: 2px solid {{pwBorder}}; background: {{pwBg}}; color: {{pwFg}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg>
          <span style="font-size: 16px; font-weight: 500">{{pwLabel}}</span>
        </button>
      </aside>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Daylight","Night"],"default":"Dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { tab: 0, off: {}, session: true, alone: 0, last: 'Set Interface en0 LumaSession Yes' }; }
  renderVals() {
    const P = {
      Dark:{bg:'#121212',surface:'#1c1c1c',raised:'#303030',line:'#424242',text:'#d1d1d1',dim:'#787878',accent:'#9a7a08',info:'#758ba0',ok:'#00a60a',warn:'#c27a12',alert:'#e10000',prog:'#d86a7c',blind:'#8a80c8',park:'#3f9a90',onAccent:'#f3ecd3'},
      Daylight:{bg:'#e4e4e4',surface:'#f0f0f0',raised:'#fbfbfb',line:'#bdbdbd',text:'#161616',dim:'#5a5a5a',accent:'#7c6200',info:'#3d5a78',ok:'#007a07',warn:'#9a5600',alert:'#c00000',prog:'#a8384e',blind:'#5a4fb0',park:'#1f756c',onAccent:'#ffffff'},
      Night:{bg:'#0b0505',surface:'#140909',raised:'#1d0d0d',line:'#2e1515',text:'#d07a68',dim:'#8a4a40',accent:'#e0862e',info:'#b0705f',ok:'#9aa040',warn:'#e0862e',alert:'#ff4a3a',prog:'#e0607a',blind:'#9a6ab0',park:'#4a9a8a',onAccent:'#0b0505'}
    };
    const t = P[this.props.theme ?? 'Dark'];
    const s = this.state;
    const tabs = ['Interfaces', 'Networks', 'Stations'].map((n, i) => ({ name: n, pick: () => this.setState({ tab: i }), bg: i === s.tab ? t.raised : 'transparent', fg: i === s.tab ? t.text : t.dim, mark: i === s.tab ? 'inset 3px 0 0 ' + t.accent : 'none' }));
    const svc = ['LumaSession', 'Shell', 'HTTP'];
    const ifaces = [['en0', '192.0.2.212/24'], ['en1', '198.51.100.229/24'], ['en2', '198.51.100.145/16'], ['lo0', '127.0.0.1/8']].map(([name, addr]) => ({
      name, addr,
      svcs: svc.map(sv => {
        const key = name + sv, locked = name === 'lo0', on = locked || !s.off[key];
        return { label: locked ? 'Always' : on ? 'Yes' : 'No', locked,
          tap: () => { const off = { ...s.off, [key]: on }; this.setState({ off, last: 'Set Interface ' + name + ' ' + sv + ' ' + (on ? 'No' : 'Yes') }); },
          bg: on && !locked ? 'color-mix(in srgb, ' + t.ok + ' 16%, ' + t.surface + ')' : t.surface,
          border: on && !locked ? 'color-mix(in srgb, ' + t.ok + ' 50%, transparent)' : t.line,
          fg: locked ? t.dim : t.text, dot: on ? t.ok : t.line };
      })
    }));
    const aloneNames = ['Off', 'On'];
    return { t, tabs, ifaces,
      status: [{ label: 'Online', c: t.ok }, { label: s.session ? 'LumaSession: standalone' : 'LumaSession off', c: s.session ? t.info : t.dim }, { label: 'sACN 1/1', c: t.ok }],
      last: s.last, alone: aloneNames[s.alone],
      cycleAlone: () => this.setState({ alone: 1 - s.alone, last: 'Set Station OutputWhenAlone ' + aloneNames[1 - s.alone] }),
      toggleSession: () => this.setState({ session: !s.session, last: 'Set Station LumaSession ' + (s.session ? 'Off' : 'On') }),
      pwLabel: s.session ? 'LumaSession on' : 'LumaSession off',
      pwBg: s.session ? 'color-mix(in srgb, ' + t.ok + ' 20%, ' + t.raised + ')' : t.raised,
      pwBorder: s.session ? t.ok : t.line, pwFg: s.session ? t.text : t.dim };
  }
}
</script>
</body>
</html>
