<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9a7a08}a:hover{color:#c9a227}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
</style>
</helmet>
<div style="width: 1024px; height: 768px; background: {{t.bg}}; color: {{t.text}}; font-family: 'Myriad Pro', 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; display: flex; min-height: 0">
    <nav style="width: 60px; flex-shrink: 0; background: {{t.surface}}; border-right: 1px solid {{t.line}}; display: flex; flex-direction: column">
      <sc-for list="{{side}}" as="b" hint-placeholder-count="6">
        <button type="button" style="height: 60px; border: none; border-bottom: 1px solid {{t.line}}; background: {{b.bg}}; color: {{b.c}}; font: inherit; font-size: 12px; font-weight: 500">{{b.name}}</button>
      </sc-for>
    </nav>
    <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
      <div style="height: 50px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: {{t.surface}}; border-bottom: 1px solid {{t.line}}">
        <span style="height: 44px; display: flex; align-items: center; padding: 0 16px 0 0; border: 1px solid {{t.line}}; border-bottom: none; border-radius: 5px 8px 0 0; background: {{t.raised}}; font-size: 16px; font-weight: 500"><span style="width: 44px; display: flex; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{t.accent}}"></span></span>Groups</span>
        <span style="height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: {{t.dim}}"><span style="width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, {{t.accent}} 35%, {{t.bg}}); display: inline-block; margin-right: 8px"></span>Sequences</span>
      </div>
      <div style="height: 44px; display: flex; align-items: center; gap: 22px; padding: 0 12px; background: {{t.bg}}; border-bottom: 1px solid {{t.surface}}; font-size: 15px; color: {{t.dim}}">
        <span>DataPool: <span style="color: {{t.text}}">1 ▾</span></span>
        <span>Tap: <span style="color: {{t.text}}">Select ▾</span></span>
        <span style="display: flex; align-items: center; gap: 8px"><span style="width: 20px; height: 20px; border-radius: 3px; background: {{t.raised}}"></span>Show empty</span>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px; align-content: start">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="10">
          <div style="height: 92px; border-radius: 6px; border: 2px solid {{c.border}}; background: {{t.raised}}; padding: 8px 10px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 13px; color: {{t.dim}}">{{c.no}}</span><span style="font-size: 17px; font-weight: 500">{{c.name}}</span><span style="height: 5px; width: {{c.cover}}%; border-radius: 3px; background: {{t.info}}"></span></div>
        </sc-for>
      </div>
      <div style="height: 200px; display: flex; gap: 8px; padding: 10px; border-top: 1px solid {{t.line}}; background: {{t.surface}}">
        <sc-for list="{{faders}}" as="f" hint-placeholder-count="6">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span class="mono" style="font-size: 14px; font-weight: 500">{{f.v}}%</span>
            <div style="flex: 1; width: 100%; border-radius: 6px; background: {{t.raised}}; border: 1px solid {{t.line}}; position: relative"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{f.v}}%; border-radius: 0 0 9px 9px; background: color-mix(in srgb, {{t.accent}} 30%, transparent)"></div><div style="position: absolute; left: 6px; right: 6px; bottom: calc({{f.v}}% - 10px); height: 20px; border-radius: 5px; background: {{t.text}}"></div></div>
            <span style="font-size: 13px; color: {{t.dim}}">{{f.name}}</span>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
  <footer style="height: 56px; flex-shrink: 0; display: flex; align-items: stretch; background: {{t.surface}}; border-top: 1px solid {{t.line}}">
    <button type="button" style="width: 72px; border: none; background: none; color: {{t.accent}}; font: inherit; font-weight: 500">PURR</button>
    <div class="mono" style="flex: 1; display: flex; align-items: center; padding: 0 12px; font-size: 16px; border-left: 1px solid {{t.line}}; border-right: 1px solid {{t.line}}"><span style="color: {{t.dim}}">Root&gt;&nbsp;</span>Group 2</div>
    <button type="button" aria-label="Keyboard" style="width: 64px; border: none; background: none; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg></button>
    <span style="width: 70px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: {{t.ok}}">ONLINE</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Daylight","Night"],"default":"Dark"},"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      Dark:{bg:'#121212',surface:'#1c1c1c',raised:'#303030',line:'#424242',text:'#d1d1d1',dim:'#787878',accent:'#9a7a08',info:'#758ba0',ok:'#00a60a',warn:'#c27a12',alert:'#e10000',prog:'#d86a7c',blind:'#8a80c8',park:'#3f9a90',onAccent:'#f3ecd3'},
      Daylight:{bg:'#e4e4e4',surface:'#f0f0f0',raised:'#fbfbfb',line:'#bdbdbd',text:'#161616',dim:'#5a5a5a',accent:'#7c6200',info:'#3d5a78',ok:'#007a07',warn:'#9a5600',alert:'#c00000',prog:'#a8384e',blind:'#5a4fb0',park:'#1f756c',onAccent:'#ffffff'},
      Night:{bg:'#0b0505',surface:'#140909',raised:'#1d0d0d',line:'#2e1515',text:'#d07a68',dim:'#8a4a40',accent:'#e0862e',info:'#b0705f',ok:'#9aa040',warn:'#e0862e',alert:'#ff4a3a',prog:'#e0607a',blind:'#9a6ab0',park:'#4a9a8a',onAccent:'#0b0505'}
    };
    const t = P[this.props.theme ?? 'Dark'];
    const side = ['⏻', 'BLND', 'HI', 'FRZ', 'SOLO', '☰'].map((n, i) => ({ name: n, c: i === 2 ? t.onAccent : t.dim, bg: i === 2 ? t.accent : t.surface }));
    const names = ['All', 'Odd', 'Even', 'Front', 'Back', 'Spots', 'Wash L', 'Wash R', 'Floor', 'Truss 1'];
    const cells = names.map((n, i) => ({ no: i + 1, name: n, cover: i === 1 ? 100 : 0, border: i === 1 ? t.accent : t.line }));
    const faders = [['Main', 80], ['Busk', 0], ['FX', 35], ['House', 100], ['Walk', 55], ['GM', 100]].map(([name, v]) => ({ name, v }));
    return { t, side, cells, faders };
  }
}
</script>
</body>
</html>
