<style>
:root{--bg:#141414;--fg:#e6e3dc;--mute:#9a968e;--line:#2c2c2c;--card:#1b1b1b;--raised:#262626;--gold:#d4a634;--id:#8fb3d9;--green:#6fcf8f;--red:#e06a5c;--hover:#222;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#141414;--fg:#e6e3dc;color-scheme:dark}}
:root[data-theme="light"]{--bg:#141414;--fg:#e6e3dc;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);margin:0;font:13.5px/1.35 "IBM Plex Sans",system-ui,sans-serif;padding-block:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));height:100vh;display:flex;flex-direction:column;gap:8px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;font-weight:600}header .crumb{color:var(--mute)}header .sp{flex:1}
.btn{background:var(--card);border:1px solid #333;color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer;min-height:32px}.btn.on{border-color:var(--gold);color:#f0e6c8;background:var(--raised)}.btn:hover{background:var(--hover)}
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:10px;flex:1;min-height:0}
@media (max-width:760px){.lab{grid-template-columns:1fr}.side{max-height:38vh}}
.side,.grid{background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column;min-height:0}
.side{padding:8px;overflow:auto}
.gby{display:flex;gap:4px;margin-bottom:6px}.gby .btn{flex:1;text-align:center;padding:6px 4px;font-size:12px}
.gby.sub .btn{padding:3px;min-height:26px}
.srow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;white-space:nowrap;cursor:pointer;min-height:30px}.srow:hover{background:var(--hover)}.srow.sel{background:var(--raised);box-shadow:inset 3px 0 0 var(--gold)}.srow.drop{outline:2px solid var(--gold);background:#2a2716}.chip{position:fixed;pointer-events:none;background:#2a2a2a;border:1px solid var(--gold);color:#f0e6c8;border-radius:8px;padding:5px 10px;font-size:12px;z-index:50}
.fold{width:18px;height:18px;border:1px solid #444;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#ddd;flex:none;background:#202020;cursor:pointer}.fold.leaf{border-color:transparent;background:transparent;cursor:default}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis}.ct{color:var(--mute);font-size:11.5px}.pill{font-size:10px;border:1px solid var(--gold);color:#e6c66a;border-radius:9px;padding:0 6px}.id{font-size:11px;color:var(--id);font-family:"IBM Plex Mono",ui-monospace,monospace}
.bar{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}.bar b{color:var(--green)}.bar .sp{flex:1}
.scroll{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{position:sticky;top:0;background:var(--card);color:var(--mute);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}th.on{color:#f0e6c8}
td{padding:5px 8px;border-bottom:1px solid #242424;white-space:nowrap}tr{cursor:default}tr:hover td{background:var(--hover)}tr.sel td{background:#2a2a1e;box-shadow:inset 0 -1px 0 #3a3a2a}tr.cur td{box-shadow:inset 3px 0 0 var(--gold)}
tr.node td{background:#1f1f1f;color:#f0e6c8}tr.node.sel td{background:#2f2d22}
td.no{color:var(--mute);width:84px}.arrow{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;color:#ccc;cursor:pointer;border-radius:4px}.arrow:hover{background:#333}
.line{font:12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#0f0f0f;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:#cfe3ff;white-space:pre-wrap;max-height:84px;overflow:auto}
.menu{position:fixed;background:#1e1e1e;border:1px solid #3a3a3a;border-radius:8px;padding:4px;min-width:220px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}.menu .hd{color:var(--mute);font-size:11px;padding:6px 10px;border-bottom:1px solid #333}.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px 10px;font:inherit;border-radius:5px;cursor:pointer;min-height:36px}.menu button:hover{background:var(--hover)}.menu button[disabled]{color:#666;cursor:default}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}.dlg .box{background:#1d1d1d;border:1px solid #3a3a3a;border-radius:10px;padding:16px 18px;max-width:520px;width:100%}.dlg h3{margin:0 0 8px;font-size:1rem}.dlg p{margin:.3em 0;color:#ddd}.dlg .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dlg .btn.primary{border-color:var(--gold)}.dlg select,.dlg input{width:100%;background:#111;border:1px solid #333;color:var(--fg);padding:6px 8px;border-radius:6px;font:inherit;margin:4px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:8px 14px;font-size:12.5px;z-index:40}
.help{color:var(--mute);font-size:12px}
</style>

  {label:'Assign', run:d=>assignInto(byG.get(d.querySelector('#dest').value))}, {label:'Cancel'}]); }
function assignInto(dest){ const fs=[...S.sel].map(g=>byG.get(g)).filter(o=>o.fx&&o.fid!=null); if(!fs.length) return; for (const o of fs){ if (o.g===dest.g || isUnder(dest.g,o.g)) { toast(`${handle(o)} can't go under itself`); return; } }
  const nodesIn=fs.filter(o=>o.isNode); const line=`Assign ${selLine()} At ${handle(dest)}`; const apply=()=>{ let order=Math.max(0,...children(dest.g).map(c=>c.order||0)); for (const o of fs){ o.parent=dest.g; order+=10; o.order=order; } draw(); toast(`${fs.length} into ${dest.name||handle(dest)}`); };
  if (nodesIn.length){ say(line+'  → asks'); dialog('Move', `<p>${esc(nodesIn.map(o=>`${handle(o)} "${o.name}"`).join(', '))} ${nodesIn.length>1?'become children':'becomes a child'} of ${esc(handle(dest))} "${esc(dest.name)}" (${nodesIn.reduce((n,o)=>n+deepCount(o.g),0)} fixtures)?</p>`,[{label:'Nest',run:()=>{say(line+' /NoConfirmation'); apply();}},{label:'Cancel'}]); }
  else { say(line); apply(); } }
function renameDialog(o){ dialog(`Rename ${handle(o)}`, `<input id="nm" value="${esc(o.name||'')}">`,[{label:'Please',run:d=>{ o.name=d.querySelector('#nm').value; say(`Set ${handle(o)} "Name" "${o.name}"`); draw(); }},{label:'Cancel'}]); }
let nextCid=8000;
function newFolder(parent){ dialog('New folder', `<p>Under ${esc(parent.name||handle(parent))}.</p><input id="nm" placeholder="Name">`,[{label:'Please',run:d=>{ const name=d.querySelector('#nm').value||'Folder'; const g='new-'+(nextCid); const o={g,fid:null,idt:'Generic',cid:nextCid++,name,type:'Grouping',mode:'',fp:0,addr:'',parent:parent.g,order:(Math.max(0,...children(parent.g).map(c=>c.order||0))+10),isNode:true,fx:true}; byG.set(g,o); fx.push(o); say(`Store Fixture Generic ${o.cid} "${name}" /FixtureType "Grouping" At ${handle(parent)}`); draw(); }},{label:'Cancel'}]); }
function removeSubtree(g){ for (const c of children(g)) removeSubtree(c.g); const o=byG.get(g); byG.delete(g); const i=fx.indexOf(o); if (i>=0) fx.splice(i,1); const j=nodes.findIndex(n=>n.g===g); if (j>=0) nodes.splice(j,1); S.sel.delete(g); }
function liftChildren(o){ const p=o.parent; let order=o.order||0; for (const c of children(o.g)) { c.parent=p; order+=1; c.order=order; } }
function deleteDialog(o){ const n=deepCount(o.g), k=nodeCount(o.g); const what=`${handle(o)} "${o.name}"`; const under = n||k ? ` — ${k?`${k} ${k===1?'folder':'folders'} and `:''}${n} fixtures under it` : '';
  if (!(n||k)) { say(`Delete ${handle(o)}  → asks`); dialog('Delete', `<p>Delete ${esc(what)}?</p>`,[{label:'Delete',run:()=>{say(`Delete ${handle(o)} /NoConfirmation`); removeSubtree(o.g); if(S.pick===o.g) S.pick='all'; draw();}},{label:'Cancel'}]); return; }
  if (S.deleteRule==='C'){ say(`Delete ${handle(o)}  → refused`); dialog('Delete', `<p class="bad">${esc(what)} holds ${k+n} — empty it first (Assign … At …, or Delete them). [E-PATCH-0xx]</p>`,[{label:'OK'}]); return; }
  say(`Delete ${handle(o)}  → asks`);
  const btns=[{label:'Delete all',run:()=>{say(`Delete ${handle(o)} /NoConfirmation`); removeSubtree(o.g); if(S.pick===o.g||isUnder(S.pick,o.g)) S.pick='all'; draw(); toast(`${n} fixtures gone`);}}];
  if (S.deleteRule==='A') btns.push({label:`Keep them: move up to ${byG.get(o.parent)?.name||'the top'}`,run:()=>{say(`Delete ${handle(o)} /KeepChildren`); liftChildren(o); removeSubtree(o.g); if(S.pick===o.g) S.pick='all'; draw(); toast(`${o.name} gone, its ${n} kept`);}});
  btns.push({label:'Cancel'});
  dialog('Delete', `<p>Delete ${esc(what)}${esc(under)}?</p>`, btns); }
function deleteSel(){ const fs=[...S.sel].map(g=>byG.get(g)); const nodesIn=fs.filter(o=>o.isNode); if (nodesIn.length===1 && fs.length===1) return deleteDialog(nodesIn[0]); const line=`Delete ${selLine()}`; say(line+'  → asks'); dialog('Delete', `<p>Delete ${fs.length} (${esc(selLine())})${nodesIn.length?` — ${nodesIn.length} nodes among them, with ${nodesIn.reduce((a,o)=>a+deepCount(o.g),0)} fixtures under them`:''}?</p>`,[{label:'Delete',run:()=>{say(line+' /NoConfirmation'); for (const o of fs) removeSubtree(o.g); draw();}},{label:'Cancel'}]); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// start: the layer's folders open one level, folders under them folded
draw();
</script>
